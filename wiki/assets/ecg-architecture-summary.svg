<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">ECG architecture at a glance</title>
  <desc id="desc">A four-stage overview showing an edge-carried ReusePlan, dependent record and property loads, request-bound metadata, and a shared-cache replacement decision. FlowThrough changes only record placement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:16px}
      .heading{font-size:20px;font-weight:700}
      .label{font-size:16px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:13px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="455" fill="#FFFFFF"/>
  <text x="45" y="48" class="sans title">ECG architecture at a glance</text>
  <text x="45" y="76" class="sans subtitle">A compact graph record becomes request-bound guidance for one property access.</text>
  <line x1="45" y1="98" x2="1155" y2="98" stroke="#27313A" stroke-width="2"/>

  <g stroke="#27313A" stroke-width="3">
    <rect x="45" y="125" width="245" height="220" rx="11" fill="#EDF5FF"/>
    <rect x="325" y="125" width="245" height="220" rx="11" fill="#FFF0D8"/>
    <rect x="605" y="125" width="245" height="220" rx="11" fill="#E7F7EA"/>
    <rect x="885" y="125" width="270" height="220" rx="11" fill="#EEE9FF"/>
  </g>

  <circle cx="75" cy="155" r="17" fill="#27313A"/>
  <text x="75" y="161" text-anchor="middle" fill="#FFFFFF" class="sans label">1</text>
  <text x="102" y="162" class="sans heading">Edge record</text>
  <rect x="70" y="192" width="195" height="58" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="167" y="226" text-anchor="middle" class="mono label">dest | tier | e1 | e2</text>
  <text x="70" y="286" class="sans body">One compact record per edge</text>
  <text x="70" y="312" class="sans body">carries future-use guidance.</text>

  <circle cx="355" cy="155" r="17" fill="#27313A"/>
  <text x="355" y="161" text-anchor="middle" fill="#FFFFFF" class="sans label">2</text>
  <text x="382" y="162" class="sans heading">Two loads</text>
  <rect x="350" y="188" width="195" height="44" rx="8" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="447" y="216" text-anchor="middle" class="sans label">record load</text>
  <path d="M447 232 V254" class="arrow"/>
  <rect x="350" y="260" width="195" height="44" rx="8" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="447" y="288" text-anchor="middle" class="sans label">property load</text>
  <text x="447" y="328" text-anchor="middle" class="sans small">waits for the ReusePlan</text>

  <circle cx="635" cy="155" r="17" fill="#27313A"/>
  <text x="635" y="161" text-anchor="middle" fill="#FFFFFF" class="sans label">3</text>
  <text x="662" y="162" class="sans heading">Request binding</text>
  <rect x="630" y="190" width="195" height="104" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="727" y="219" text-anchor="middle" class="sans label">Property Request</text>
  <line x1="650" y1="233" x2="805" y2="233" stroke="#27313A"/>
  <text x="727" y="257" text-anchor="middle" class="sans body">address + tier</text>
  <text x="727" y="280" text-anchor="middle" class="sans body">+ future epochs</text>
  <text x="727" y="328" text-anchor="middle" class="sans small">metadata stays request-bound</text>

  <circle cx="915" cy="155" r="17" fill="#27313A"/>
  <text x="915" y="161" text-anchor="middle" fill="#FFFFFF" class="sans label">4</text>
  <text x="942" y="162" class="sans heading">Shared LLC</text>
  <rect x="910" y="190" width="220" height="92" rx="9" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="1020" y="219" text-anchor="middle" class="sans label">resident property line</text>
  <text x="1020" y="247" text-anchor="middle" class="sans body">tier 2 | epochs 12, 40</text>
  <text x="910" y="311" class="sans body">RRIP filters candidates;</text>
  <text x="910" y="335" class="sans body">ReusePlan ranks their reuse.</text>

  <path d="M290 235 H321" class="arrow"/>
  <path d="M570 235 H601" class="arrow"/>
  <path d="M850 235 H881" class="arrow"/>

  <rect x="45" y="375" width="1110" height="56" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <circle cx="76" cy="403" r="15" fill="#A8403A"/>
  <path d="M69 403 L75 409 L84 397" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="399" class="sans label">FlowThrough changes only the record miss:</text>
  <text x="102" y="421" class="sans body">fill private caches, preserve LLC hits, and skip only the new LLC insertion.</text>
</svg>
