<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">ECG architecture at a glance</title>
  <desc id="desc">A four-stage overview showing an edge-carried ReusePlan, dependent record and property loads, request-bound metadata, and a shared-cache replacement decision. FlowThrough changes only record placement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:16px}
      .heading{font-size:20px;font-weight:700}
      .label{font-size:16px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:14px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="45" y="48" class="sans title">ECG architecture at a glance</text>
  <text x="45" y="76" class="sans subtitle">Concrete example: destination 42, current epoch 10, and 4-byte property values.</text>
  <line x1="45" y1="98" x2="1155" y2="98" stroke="#27313A" stroke-width="2"/>

  <g stroke="#27313A" stroke-width="3">
    <rect x="45" y="125" width="245" height="280" rx="11" fill="#EDF5FF"/>
    <rect x="325" y="125" width="245" height="280" rx="11" fill="#FFF0D8"/>
    <rect x="605" y="125" width="245" height="280" rx="11" fill="#E7F7EA"/>
    <rect x="885" y="125" width="270" height="280" rx="11" fill="#EEE9FF"/>
  </g>

  <circle cx="75" cy="155" r="17" fill="#27313A"/>
  <text x="75" y="161" text-anchor="middle" fill="#FFFFFF" class="sans label">1</text>
  <text x="102" y="162" class="sans heading">Edge record</text>
  <rect x="70" y="188" width="195" height="104" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="167" y="214" text-anchor="middle" class="sans label">4-byte record</text>
  <text x="167" y="244" text-anchor="middle" class="mono small">dest 42 | tier 2</text>
  <text x="167" y="271" text-anchor="middle" class="mono small">e1 12 | e2 40</text>
  <text x="70" y="326" class="sans body">One record replaces</text>
  <text x="70" y="350" class="sans body">one 4-byte edge ID.</text>
  <text x="70" y="376" class="sans small">Loaded from the CSR</text>
  <text x="70" y="398" class="sans small">edge stream.</text>

  <circle cx="355" cy="155" r="17" fill="#27313A"/>
  <text x="355" y="161" text-anchor="middle" fill="#FFFFFF" class="sans label">2</text>
  <text x="382" y="162" class="sans heading">Two loads</text>
  <rect x="350" y="188" width="195" height="48" rx="8" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="447" y="218" text-anchor="middle" class="sans label">record load</text>
  <text x="447" y="260" text-anchor="middle" class="sans small">returns the ReusePlan</text>
  <path d="M447 266 V282" class="arrow"/>
  <rect x="350" y="288" width="195" height="48" rx="8" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="447" y="318" text-anchor="middle" class="sans label">property load</text>
  <text x="447" y="362" text-anchor="middle" class="sans small">waits on the record</text>
  <text x="447" y="385" text-anchor="middle" class="sans small">one dynamic access</text>

  <circle cx="635" cy="155" r="17" fill="#27313A"/>
  <text x="635" y="161" text-anchor="middle" fill="#FFFFFF" class="sans label">3</text>
  <text x="662" y="162" class="sans heading">Request binding</text>
  <rect x="630" y="188" width="195" height="150" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="727" y="215" text-anchor="middle" class="sans label">Property Request</text>
  <text x="727" y="243" text-anchor="middle" class="mono small">addr 0x8000_00A8</text>
  <line x1="650" y1="257" x2="805" y2="257" stroke="#27313A"/>
  <text x="727" y="282" text-anchor="middle" class="mono small">tier 2 | e1 12 | e2 40</text>
  <text x="727" y="307" text-anchor="middle" class="mono small">current 10 | context k</text>
  <text x="727" y="330" text-anchor="middle" class="sans small">sequence remains bound</text>
  <text x="630" y="370" class="sans body">Ordinary ordering, replay,</text>
  <text x="630" y="394" class="sans body">return, and retirement.</text>

  <circle cx="915" cy="155" r="17" fill="#27313A"/>
  <text x="915" y="161" text-anchor="middle" fill="#FFFFFF" class="sans label">4</text>
  <text x="942" y="162" class="sans heading">Shared LLC</text>
  <rect x="910" y="188" width="220" height="150" rx="9" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="1020" y="215" text-anchor="middle" class="sans label">resident property line</text>
  <text x="1020" y="243" text-anchor="middle" class="mono small">line 0x8000_0080</text>
  <line x1="930" y1="257" x2="1110" y2="257" stroke="#27313A"/>
  <text x="1020" y="282" text-anchor="middle" class="mono small">tier 2 | e1 12 | e2 40</text>
  <text x="1020" y="307" text-anchor="middle" class="sans small">stored on an LLC hit or fill</text>
  <text x="910" y="370" class="sans body">RRIP selects eligible lines;</text>
  <text x="910" y="394" class="sans body">nearest reuse ranks them.</text>

  <path d="M290 235 H321" class="arrow"/>
  <path d="M570 235 H601" class="arrow"/>
  <path d="M850 235 H881" class="arrow"/>

  <rect x="45" y="435" width="1110" height="60" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <circle cx="76" cy="465" r="15" fill="#A8403A"/>
  <path d="M69 465 L75 471 L84 459" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="460" class="sans label">FlowThrough changes only the record miss:</text>
  <text x="102" y="484" class="sans body">fill private caches, preserve LLC hits, and skip only the new LLC insertion.</text>
</svg>
