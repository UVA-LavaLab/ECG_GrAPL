<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Detailed FlowThrough architecture and LLC outcomes</title>
  <desc id="desc">The upper path shows a FlowThrough record Request through the load queue, translation, private caches, MSHR, LLC, and memory. Lower panels separate normal LLC hits, LLC misses with a blocked insertion gate, and a property Request that is never bypassed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:17px}
      .domain{font-size:15px;font-weight:700;letter-spacing:1.2px}
      .heading{font-size:21px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:14px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .slot{fill:#FFFFFF;stroke:#27313A;stroke-width:2}
    </style>
  </defs>

  <rect width="1400" height="750" fill="#FFFFFF"/>
  <text x="40" y="48" class="sans title">FlowThrough: detailed cache path and LLC outcomes</text>
  <text x="40" y="77" class="sans subtitle">One request bit changes only allocation after a record misses in the LLC.</text>
  <line x1="40" y1="102" x2="1360" y2="102" stroke="#27313A" stroke-width="2"/>

  <!-- Full architecture path -->
  <rect x="30" y="125" width="1340" height="225" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <circle cx="58" cy="154" r="16" fill="#27313A"/>
  <text x="58" y="160" text-anchor="middle" fill="#FFFFFF" class="sans label">2</text>
  <text x="84" y="160" class="sans heading">FlowThrough record Request through the shared hierarchy</text>

  <g text-anchor="middle">
    <rect x="50" y="190" width="150" height="86" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
    <text x="125" y="219" class="sans label">CPU</text>
    <text x="125" y="244" class="mono small">ecg.flow.load</text>
    <text x="125" y="265" class="mono small">.compact</text>

    <rect x="235" y="190" width="160" height="86" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
    <text x="315" y="219" class="sans label">Load queue</text>
    <text x="315" y="244" class="mono small">size 4 · FT 1</text>
    <text x="315" y="265" class="sans small">ordering + replay</text>

    <rect x="430" y="190" width="110" height="86" rx="9" class="slot"/>
    <text x="485" y="219" class="sans label">D-TLB</text>
    <text x="485" y="251" class="sans small">VA → PA</text>

    <rect x="575" y="190" width="110" height="86" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
    <text x="630" y="219" class="sans label">L1D</text>
    <text x="630" y="251" class="sans small">lookup / fill</text>

    <rect x="720" y="190" width="110" height="86" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
    <text x="775" y="219" class="sans label">L2</text>
    <text x="775" y="251" class="sans small">lookup / fill</text>

    <rect x="865" y="190" width="120" height="86" rx="9" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
    <text x="925" y="219" class="sans label">MSHR</text>
    <text x="925" y="244" class="sans small">retains FT flag</text>
    <text x="925" y="265" class="sans small">until fill</text>

    <rect x="1020" y="180" width="140" height="106" rx="9" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
    <text x="1090" y="211" class="sans label">LLC</text>
    <text x="1090" y="236" class="sans small">tag lookup</text>
    <rect x="1040" y="248" width="100" height="24" rx="5" fill="#F7DEDC" stroke="#27313A"/>
    <text x="1090" y="265" class="sans small">insertion gate</text>

    <rect x="1210" y="190" width="140" height="86" rx="9" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
    <text x="1280" y="219" class="sans label">Memory</text>
    <text x="1280" y="251" class="sans small">miss service</text>
  </g>

  <path d="M200 233 H231" class="arrow"/>
  <path d="M395 233 H426" class="arrow"/>
  <path d="M540 233 H571" class="arrow"/>
  <path d="M685 233 H716" class="arrow"/>
  <path d="M830 233 H861" class="arrow"/>
  <path d="M985 233 H1016" class="arrow"/>
  <path d="M1160 233 H1206" class="arrow"/>

  <text x="315" y="315" text-anchor="middle" class="sans small">Request type: record · allocation hint: FlowThrough</text>
  <text x="1090" y="315" text-anchor="middle" class="sans small">LLC tag lookup occurs before the outcomes below</text>

  <!-- LLC hit -->
  <rect x="30" y="390" width="350" height="260" rx="11" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <text x="55" y="425" class="sans heading">LLC hit</text>
  <g text-anchor="middle">
    <rect x="55" y="455" width="85" height="62" rx="8" class="slot"/>
    <rect x="165" y="455" width="85" height="62" rx="8" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
    <rect x="275" y="455" width="80" height="62" rx="8" class="slot"/>
    <text x="97" y="481" class="sans label">LLC</text><text x="97" y="503" class="sans small">tag hit</text>
    <text x="207" y="481" class="sans label">L2/L1</text><text x="207" y="503" class="sans small">response</text>
    <text x="315" y="481" class="sans label">rd</text><text x="315" y="503" class="sans small">record</text>
  </g>
  <path d="M140 486 H161" class="arrow"/>
  <path d="M250 486 H271" class="arrow"/>
  <text x="55" y="554" class="sans body">The existing LLC line returns normally.</text>
  <text x="55" y="581" class="sans body">Memory is not accessed.</text>
  <text x="55" y="608" class="sans body">No allocation decision is needed.</text>
  <text x="55" y="632" class="sans small">FlowThrough never bypasses an LLC hit.</text>

  <!-- LLC miss -->
  <rect x="405" y="390" width="640" height="260" rx="11" fill="#F7DEDC" stroke="#27313A" stroke-width="3"/>
  <text x="430" y="425" class="sans heading">LLC miss and returning fill</text>
  <g text-anchor="middle">
    <rect x="430" y="455" width="110" height="62" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
    <rect x="575" y="455" width="110" height="62" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
    <rect x="720" y="455" width="120" height="62" rx="8" class="slot"/>
    <rect x="885" y="455" width="130" height="62" rx="8" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
    <text x="485" y="481" class="sans label">MSHR</text><text x="485" y="503" class="sans small">miss state</text>
    <text x="630" y="481" class="sans label">Memory</text><text x="630" y="503" class="sans small">fetch line</text>
    <text x="780" y="481" class="sans label">Return</text><text x="780" y="503" class="sans small">record line</text>
    <text x="950" y="481" class="sans label">L2 / L1</text><text x="950" y="503" class="sans small">private fill</text>
  </g>
  <path d="M540 486 H571" class="arrow"/>
  <path d="M685 486 H716" class="arrow"/>
  <path d="M840 486 H881" class="arrow"/>

  <path d="M780 517 V539" class="arrow"/>
  <rect x="655" y="545" width="250" height="62" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="780" y="571" text-anchor="middle" class="sans label">LLC insertion gate</text>
  <text x="780" y="596" text-anchor="middle" class="mono body">FT = 1 → do not allocate</text>
  <circle cx="925" cy="576" r="15" fill="#A8403A"/>
  <path d="M917 576 H933" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="430" y="631" class="sans small">The line returns and fills private caches; only LLC allocation is suppressed.</text>

  <!-- Property contrast -->
  <rect x="1070" y="390" width="300" height="260" rx="11" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <text x="1095" y="425" class="sans heading">Property Request</text>
  <rect x="1095" y="452" width="250" height="84" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="1220" y="480" text-anchor="middle" class="sans label">FT = 0 · ReuseBind valid</text>
  <text x="1220" y="506" text-anchor="middle" class="mono small">T2 | e1 12 | e2 40</text>
  <path d="M1220 536 V558" class="arrow"/>
  <rect x="1095" y="564" width="250" height="58" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="1220" y="588" text-anchor="middle" class="sans label">LLC hit or fill</text>
  <text x="1220" y="611" text-anchor="middle" class="sans small">store metadata; return property</text>
  <text x="1095" y="642" class="sans small">Property requests are never FlowThrough.</text>

  <rect x="155" y="682" width="1090" height="42" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="700" y="709" text-anchor="middle" class="sans body">Selective change: preserve translation, lookup, miss service, response, and private fills; suppress only LLC insertion.</text>
</svg>
