<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">ReusePlan mechanism overview</title>
  <desc id="desc">Four-stage flow from graph preprocessing to a ReusePlan record, a request-bound property load, and an LLC replacement decision, with FlowThrough controlling record placement.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.2" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"],[fill="#ffffff"]{fill:#1E2327}
        [fill="#F8F6EC"]{fill:#252A2E}[fill="#EDF5FF"]{fill:#273846}
        [fill="#E7F7EA"]{fill:#24382A}[fill="#FFF0D8"]{fill:#3B3122}
        [fill="#F7DEDC"]{fill:#3D292A}[fill="#EEE9FF"]{fill:#302C3C}
        [stroke="#9AA3AD"]{stroke:#747D86}
      }
      .title{font:700 30px Arial,sans-serif}
      .subtitle{font:400 17px Arial,sans-serif}
      .card-title{font:700 20px Arial,sans-serif}
      .body{font:400 15px Arial,sans-serif}
      .number{font:700 16px Arial,sans-serif;fill:#fff}
      .strip-title{font:700 18px Arial,sans-serif}
      .strip-body{font:400 15px Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="460" fill="#FFFFFF"/>
  <text x="60" y="48" class="title">Edge-carried reuse guidance</text>
  <text x="60" y="75" class="subtitle">ReusePlan transports graph knowledge from the edge stream to the exact property request.</text>

  <g stroke="#27313A" stroke-width="3">
    <rect x="55" y="112" width="235" height="190" rx="12" fill="#EDF5FF"/>
    <rect x="330" y="112" width="235" height="190" rx="12" fill="#E7F7EA"/>
    <rect x="605" y="112" width="235" height="190" rx="12" fill="#FFF0D8"/>
    <rect x="880" y="112" width="265" height="190" rx="12" fill="#EEE9FF"/>
  </g>

  <circle cx="86" cy="142" r="17" fill="#27313A"/>
  <text x="86" y="148" text-anchor="middle" class="number">1</text>
  <text x="112" y="149" class="card-title">Graph pass</text>
  <text x="80" y="187" class="body">For each property line:</text>
  <circle cx="87" cy="216" r="4" fill="#1769C2"/>
  <text x="101" y="221" class="body">classify reuse tier</text>
  <circle cx="87" cy="244" r="4" fill="#1769C2"/>
  <text x="101" y="249" class="body">find next two epochs</text>
  <circle cx="87" cy="272" r="4" fill="#1769C2"/>
  <text x="101" y="277" class="body">pack with destination</text>

  <circle cx="361" cy="142" r="17" fill="#27313A"/>
  <text x="361" y="148" text-anchor="middle" class="number">2</text>
  <text x="387" y="149" class="card-title">ReusePlan record</text>
  <rect x="360" y="184" width="48" height="43" rx="7" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <rect x="417" y="184" width="34" height="43" rx="7" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <rect x="460" y="184" width="34" height="43" rx="7" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <rect x="503" y="184" width="34" height="43" rx="7" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="384" y="211" text-anchor="middle" class="body">dest</text>
  <text x="434" y="211" text-anchor="middle" class="body">tier</text>
  <text x="477" y="211" text-anchor="middle" class="body">e1</text>
  <text x="520" y="211" text-anchor="middle" class="body">e2</text>
  <text x="360" y="257" class="body">Streamed in place of</text>
  <text x="360" y="279" class="body">the ordinary edge identifier.</text>

  <circle cx="636" cy="142" r="17" fill="#27313A"/>
  <text x="636" y="148" text-anchor="middle" class="number">3</text>
  <text x="662" y="149" class="card-title">ReuseBind</text>
  <rect x="638" y="186" width="168" height="56" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="722" y="209" text-anchor="middle" class="body">property address</text>
  <text x="722" y="230" text-anchor="middle" class="body">+ tier + two epochs</text>
  <text x="638" y="270" class="body">Metadata travels with the</text>
  <text x="638" y="290" class="body">property request.</text>

  <circle cx="911" cy="142" r="17" fill="#27313A"/>
  <text x="911" y="148" text-anchor="middle" class="number">4</text>
  <text x="937" y="149" class="card-title">LLC decision</text>
  <text x="910" y="187" class="body">RRIP selects eligible lines.</text>
  <text x="910" y="211" class="body">ReusePlan ranks eligible</text>
  <text x="910" y="233" class="body">property lines by nearest reuse.</text>
  <rect x="910" y="257" width="203" height="30" rx="8" fill="#EDF5FF" stroke="#27313A"/>
  <text x="1012" y="277" text-anchor="middle" class="body">evict farthest future use</text>

  <line x1="290" y1="207" x2="326" y2="207" stroke="#1769C2" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="565" y1="207" x2="601" y2="207" stroke="#1769C2" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="840" y1="207" x2="876" y2="207" stroke="#1769C2" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="220" y="350" width="760" height="72" rx="10" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <circle cx="259" cy="386" r="20" fill="#27313A"/>
  <path d="M250 386 L258 394 L270 377" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="292" y="380" class="strip-title">FlowThrough controls the edge-record miss</text>
  <text x="292" y="404" class="strip-body">Fill L1/L2, preserve LLC hits, and skip LLC insertion only when the record misses.</text>
</svg>
