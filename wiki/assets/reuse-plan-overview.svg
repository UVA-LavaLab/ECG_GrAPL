<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">ReusePlan mechanism overview</title>
  <desc id="desc">Four-stage flow from graph preprocessing to a ReusePlan record, a request-bound property load, and an LLC replacement decision, with FlowThrough controlling record placement.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.2" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#49657a"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 15px Arial,sans-serif;fill:#607487}
      .card-title{font:700 18px Arial,sans-serif;fill:#17324d}
      .body{font:400 14px Arial,sans-serif;fill:#405568}
      .number{font:700 16px Arial,sans-serif;fill:#fff}
      .strip-title{font:700 16px Arial,sans-serif;fill:#17324d}
      .strip-body{font:400 14px Arial,sans-serif;fill:#405568}
    </style>
  </defs>
  <rect width="1200" height="460" fill="#ffffff"/>
  <text x="60" y="48" class="title">Edge-carried reuse guidance</text>
  <text x="60" y="75" class="subtitle">ReusePlan transports graph knowledge from the edge stream to the exact property request.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="112" width="235" height="190" rx="18" fill="#f5f8fb" stroke="#c9d5df"/>
    <rect x="330" y="112" width="235" height="190" rx="18" fill="#eef8f6" stroke="#9bcfc6"/>
    <rect x="605" y="112" width="235" height="190" rx="18" fill="#fff7e8" stroke="#e8c982"/>
    <rect x="880" y="112" width="265" height="190" rx="18" fill="#f5f8fb" stroke="#c9d5df"/>
  </g>

  <circle cx="86" cy="142" r="17" fill="#17324d"/>
  <text x="86" y="148" text-anchor="middle" class="number">1</text>
  <text x="112" y="149" class="card-title">Graph pass</text>
  <text x="80" y="187" class="body">For each governed property line:</text>
  <circle cx="87" cy="216" r="4" fill="#2a9d8f"/>
  <text x="101" y="221" class="body">classify reuse tier</text>
  <circle cx="87" cy="244" r="4" fill="#2a9d8f"/>
  <text x="101" y="249" class="body">find next two epochs</text>
  <circle cx="87" cy="272" r="4" fill="#2a9d8f"/>
  <text x="101" y="277" class="body">pack with destination</text>

  <circle cx="361" cy="142" r="17" fill="#2a9d8f"/>
  <text x="361" y="148" text-anchor="middle" class="number">2</text>
  <text x="387" y="149" class="card-title">ReusePlan record</text>
  <rect x="360" y="184" width="48" height="43" rx="8" fill="#d9efeb" stroke="#75b9ad"/>
  <rect x="417" y="184" width="34" height="43" rx="8" fill="#f7dca0" stroke="#d9af54"/>
  <rect x="460" y="184" width="34" height="43" rx="8" fill="#f5b7a9" stroke="#df9180"/>
  <rect x="503" y="184" width="34" height="43" rx="8" fill="#d5dfeb" stroke="#9badbd"/>
  <text x="384" y="211" text-anchor="middle" class="body">dest</text>
  <text x="434" y="211" text-anchor="middle" class="body">tier</text>
  <text x="477" y="211" text-anchor="middle" class="body">e1</text>
  <text x="520" y="211" text-anchor="middle" class="body">e2</text>
  <text x="360" y="257" class="body">Streamed in place of, or beside,</text>
  <text x="360" y="279" class="body">the ordinary edge identifier.</text>

  <circle cx="636" cy="142" r="17" fill="#e5a93d"/>
  <text x="636" y="148" text-anchor="middle" class="number">3</text>
  <text x="662" y="149" class="card-title">ReuseBind request</text>
  <rect x="638" y="186" width="168" height="56" rx="12" fill="#ffffff" stroke="#d9af54"/>
  <text x="722" y="209" text-anchor="middle" class="body">property address</text>
  <text x="722" y="230" text-anchor="middle" class="body">+ tier + two epochs</text>
  <text x="638" y="270" class="body">Metadata travels on the same</text>
  <text x="638" y="290" class="body">request as the property load.</text>

  <circle cx="911" cy="142" r="17" fill="#17324d"/>
  <text x="911" y="148" text-anchor="middle" class="number">4</text>
  <text x="937" y="149" class="card-title">LLC decision</text>
  <text x="910" y="187" class="body">RRIP selects eligible lines.</text>
  <text x="910" y="215" class="body">ReusePlan ranks eligible properties by</text>
  <text x="910" y="237" class="body">their nearest future reuse.</text>
  <rect x="910" y="257" width="203" height="30" rx="15" fill="#dfe8f0"/>
  <text x="1012" y="277" text-anchor="middle" class="body">evict farthest future use</text>

  <line x1="290" y1="207" x2="326" y2="207" stroke="#49657a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="565" y1="207" x2="601" y2="207" stroke="#49657a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="840" y1="207" x2="876" y2="207" stroke="#49657a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="220" y="350" width="760" height="72" rx="18" fill="#edf7f5" stroke="#8fc8be"/>
  <circle cx="259" cy="386" r="20" fill="#2a9d8f"/>
  <path d="M250 386 L258 394 L270 377" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="292" y="380" class="strip-title">FlowThrough controls the edge-record miss</text>
  <text x="292" y="404" class="strip-body">Fill L1/L2, preserve LLC hits, and skip LLC insertion only when the record misses.</text>
</svg>
