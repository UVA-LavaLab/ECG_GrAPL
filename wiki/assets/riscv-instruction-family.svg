<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">ECG RISC-V instruction roles and operand handoff</title>
  <desc id="desc">Three panels show record-load variants, custom-0 decode and ReusePlan register dependency, and computed or indexed property-load variants. A footer shows exact Request binding and LLC use.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:17px}
      .heading{font-size:22px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:14px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="650" fill="#FFFFFF"/>
  <text x="40" y="48" class="sans title">ECG RISC-V instruction roles and operand handoff</text>
  <text x="40" y="77" class="sans subtitle">The record load creates the ReusePlan operand consumed by one dynamic property-load instruction.</text>
  <line x1="40" y1="100" x2="1360" y2="100" stroke="#27313A" stroke-width="2"/>

  <g stroke="#27313A" stroke-width="3">
    <rect x="35" y="120" width="400" height="390" rx="11" fill="#F7DEDC"/>
    <rect x="500" y="120" width="400" height="390" rx="11" fill="#FFF0D8"/>
    <rect x="965" y="120" width="400" height="390" rx="11" fill="#E7F7EA"/>
  </g>

  <!-- Stage 2 -->
  <circle cx="67" cy="152" r="17" fill="#27313A"/>
  <text x="67" y="159" text-anchor="middle" fill="#FFFFFF" class="sans label">2</text>
  <text x="96" y="159" class="sans heading">Record-load instructions</text>

  <rect x="60" y="185" width="350" height="130" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="235" y="215" text-anchor="middle" class="mono label">ecg.plan.load*</text>
  <text x="80" y="242" class="sans body">rs1 = record address</text>
  <text x="80" y="264" class="sans body">rd = packed ReusePlan</text>
  <text x="80" y="286" class="sans body">ordinary cacheable record placement</text>
  <text x="80" y="307" class="sans small">compact and general-width forms</text>

  <rect x="60" y="330" width="350" height="155" rx="9" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="235" y="360" text-anchor="middle" class="mono label">ecg.flow.load*</text>
  <text x="80" y="390" class="sans body">same operands and ReusePlan result</text>
  <rect x="80" y="405" width="310" height="34" rx="7" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="235" y="428" text-anchor="middle" class="mono small">ECG_FLOWTHROUGH request flag</text>
  <text x="80" y="458" class="sans small">private fills and LLC hits remain normal;</text>
  <text x="80" y="478" class="sans small">only a returning LLC miss skips insertion</text>

  <!-- Stage 3 -->
  <circle cx="532" cy="152" r="17" fill="#27313A"/>
  <text x="532" y="159" text-anchor="middle" fill="#FFFFFF" class="sans label">3</text>
  <text x="561" y="159" class="sans heading">Decode + register dependency</text>

  <rect x="525" y="185" width="350" height="95" rx="9" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="700" y="214" text-anchor="middle" class="sans label">custom-0 decode</text>
  <text x="545" y="244" class="sans body">role + memory width + destination class</text>
  <text x="545" y="268" class="sans small">reads rd/fd and rs1/rs2 instruction fields</text>

  <rect x="525" y="305" width="350" height="92" rx="9" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="700" y="335" text-anchor="middle" class="sans label">ReusePlan register rd</text>
  <text x="700" y="366" text-anchor="middle" class="mono body">dest 42 | T2 | e1 12 | e2 40</text>

  <rect x="525" y="422" width="350" height="64" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="700" y="448" text-anchor="middle" class="sans body">property instruction reads this value as rs2</text>
  <text x="700" y="472" text-anchor="middle" class="sans small">rename and issue preserve the exact dependency</text>

  <!-- Stage 4 -->
  <circle cx="997" cy="152" r="17" fill="#27313A"/>
  <text x="997" y="159" text-anchor="middle" fill="#FFFFFF" class="sans label">4</text>
  <text x="1026" y="159" class="sans heading">Property-load instructions</text>

  <rect x="990" y="185" width="350" height="120" rx="9" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="1165" y="215" text-anchor="middle" class="mono label">ecg.bind.load.*</text>
  <text x="1010" y="247" class="sans body">rs1 = computed property address</text>
  <text x="1010" y="272" class="sans body">rs2 = ReusePlan → typed property result</text>
  <text x="1010" y="296" class="sans small">U32, S32, U64, F32, and weighted forms</text>

  <rect x="990" y="325" width="350" height="150" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="1165" y="355" text-anchor="middle" class="mono label">ecg.bind.iload.*</text>
  <text x="1010" y="387" class="sans body">rs1 = property-array base</text>
  <text x="1010" y="412" class="sans body">rs2 = ReusePlan with destination</text>
  <text x="1010" y="437" class="sans body">EA = base + destination × element size</text>
  <text x="1010" y="463" class="sans small">fuses indexed address generation with binding</text>

  <path d="M435 315 H496" class="arrow"/>
  <path d="M900 315 H961" class="arrow"/>

  <!-- Stages 5 and 6 -->
  <rect x="35" y="540" width="1330" height="80" rx="10" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <line x1="700" y1="552" x2="700" y2="608" stroke="#9AA3AD" stroke-width="2"/>
  <circle cx="65" cy="580" r="15" fill="#27313A"/>
  <text x="65" y="586" text-anchor="middle" fill="#FFFFFF" class="sans label">5</text>
  <text x="92" y="573" class="sans label">Exact property Request</text>
  <text x="92" y="598" class="sans body">LSQ attaches dest, tier, epochs, current, context, and sequence as ReuseBind.</text>
  <circle cx="730" cy="580" r="15" fill="#27313A"/>
  <text x="730" y="586" text-anchor="middle" fill="#FFFFFF" class="sans label">6</text>
  <text x="757" y="573" class="sans label">LLC and completion</text>
  <text x="757" y="598" class="sans body">LLC stores metadata on hit/fill; data writes back and retires normally.</text>
</svg>
