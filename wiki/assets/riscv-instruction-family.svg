<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">ECG Next experimental RISC-V instruction family</title>
  <desc id="desc">Four cards separate ReusePlan record acquisition, FlowThrough record placement, computed-address ReuseBind property loads, and indexed ReuseBind property loads.</desc>
  <style>
    :root{color-scheme:light dark}
    @media(prefers-color-scheme:dark){
      [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
      [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
      [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
      [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
      [stroke="#9AA3AD"]{stroke:#747D86}
    }
    .title{font:700 30px Arial,sans-serif}
    .subtitle{font:400 15px Arial,sans-serif}
    .group{font:700 18px Arial,sans-serif}
    .mnemonic{font:700 17px 'Courier New',monospace}
    .box-title{font:700 15px Arial,sans-serif}
    .body{font:400 12px Arial,sans-serif}
    .note{font:400 12px Arial,sans-serif}
    .mono{font:700 12px 'SFMono-Regular',Consolas,monospace}
  </style>

  <rect width="1400" height="620" fill="#FFFFFF"/>
  <text x="42" y="45" class="title">Experimental RISC-V custom-0 instruction family</text>
  <text x="42" y="72" class="subtitle">The instruction names describe request roles; the implementation uses raw .insn encodings in gem5 RISC-V guest code.</text>

  <rect x="35" y="105" width="650" height="410" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="715" y="105" width="650" height="410" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="60" y="137" class="group">ReusePlan record acquisition</text>
  <text x="740" y="137" class="group">ReuseBind property access</text>

  <rect x="60" y="165" width="285" height="315" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="82" y="198" class="mnemonic">ecg.plan.load*</text>
  <text x="82" y="227" class="box-title">Ordinary record placement</text>
  <text x="82" y="256" class="body">Input: rs1 = record address</text>
  <text x="82" y="280" class="body">Output: rd = packed ReusePlan</text>
  <text x="82" y="304" class="body">Address: rs1 + immediate</text>
  <text x="82" y="328" class="body">Request: normal cacheable load</text>
  <text x="82" y="352" class="body">Compact form widens</text>
  <text x="82" y="374" class="body">to canonical fields</text>
  <text x="82" y="410" class="note">Use for ordinary</text>
  <text x="82" y="432" class="note">cache placement.</text>

  <rect x="375" y="165" width="285" height="315" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="3"/>
  <text x="397" y="198" class="mnemonic">ecg.flow.load*</text>
  <text x="397" y="227" class="box-title">FlowThrough record placement</text>
  <text x="397" y="256" class="body">Input: rs1 = record address</text>
  <text x="397" y="280" class="body">Output: rd = packed ReusePlan</text>
  <text x="397" y="304" class="body">Address: rs1 + immediate</text>
  <text x="397" y="328" class="body">Request flag:</text>
  <text x="397" y="350" class="mono">ECG_FLOWTHROUGH</text>
  <text x="397" y="374" class="body">Private fills and LLC hits</text>
  <text x="397" y="396" class="body">remain normal</text>
  <text x="397" y="422" class="note">LLC miss: returning record</text>
  <text x="397" y="444" class="note">skips LLC insertion.</text>

  <rect x="740" y="165" width="285" height="315" rx="9" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <text x="762" y="198" class="mnemonic">ecg.bind.load.*</text>
  <text x="762" y="227" class="box-title">Computed-address ReuseBind</text>
  <text x="762" y="256" class="body">Input: rs1 = property address</text>
  <text x="762" y="280" class="body">Input: rs2 = ReusePlan fields</text>
  <text x="762" y="304" class="body">Address: EA = rs1</text>
  <text x="762" y="328" class="body">Output: typed property value</text>
  <text x="762" y="352" class="body">Request: attaches</text>
  <text x="762" y="374" class="body">ReuseBind extension</text>
  <text x="762" y="410" class="note">Widths: U32, S32, U64,</text>
  <text x="762" y="432" class="note">F32, and weighted forms.</text>

  <rect x="1055" y="165" width="285" height="315" rx="9" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <text x="1077" y="198" class="mnemonic">ecg.bind.iload.*</text>
  <text x="1077" y="227" class="box-title">Indexed ReuseBind</text>
  <text x="1077" y="256" class="body">Input: rs1 = property-array base</text>
  <text x="1077" y="280" class="body">Input: rs2 = ReusePlan fields</text>
  <text x="1077" y="304" class="body">Address: base + destination</text>
  <text x="1077" y="326" class="body">x element size</text>
  <text x="1077" y="350" class="body">Output: typed property value</text>
  <text x="1077" y="374" class="body">Request: attaches</text>
  <text x="1077" y="396" class="body">ReuseBind extension</text>
  <text x="1077" y="422" class="note">Fuses address generation</text>
  <text x="1077" y="444" class="note">with metadata binding.</text>

  <rect x="35" y="540" width="1330" height="58" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="700" y="565" text-anchor="middle" class="note">Research implementation: custom-0 encoding in gem5 RISC-V.</text>
  <text x="700" y="585" text-anchor="middle" class="note">Not a ratified RISC-V extension or a fabricated processor.</text>
</svg>
