<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Graph to CSR and edge-aligned ReusePlan masks</title>
  <desc id="desc">A four-node graph is converted to CSR row pointers and destination IDs. A ReusePlan mask aligns with each CSR edge position. At runtime the destination forms the property address while tier and epochs bind to that property request and guide LLC replacement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:16px}
      .heading{font-size:20px;font-weight:700}
      .label{font-size:16px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:14px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{fill:none;stroke:#27313A;stroke-width:2.2;marker-end:url(#arrow)}
      .edge-hot{fill:none;stroke:#1769C2;stroke-width:4;marker-end:url(#arrow)}
      .slot{fill:#FFFFFF;stroke:#27313A;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1200" height="550" fill="#FFFFFF"/>
  <text x="45" y="48" class="sans title">From graph topology to edge-aligned ReusePlan masks</text>
  <text x="45" y="76" class="sans subtitle">Adapted to ECG Next from the graph-to-CSR relationship illustrated in the ECG paper.</text>
  <line x1="45" y1="98" x2="1155" y2="98" stroke="#27313A" stroke-width="2"/>

  <g stroke="#27313A" stroke-width="3">
    <rect x="35" y="120" width="380" height="300" rx="11" fill="#EDF5FF"/>
    <rect x="445" y="120" width="330" height="300" rx="11" fill="#FFF0D8"/>
    <rect x="805" y="120" width="360" height="300" rx="11" fill="#F8F6EC"/>
  </g>

  <!-- Graph -->
  <text x="225" y="155" text-anchor="middle" class="sans heading">1a. Directed reader graph</text>
  <path d="M100 190 H276" class="edge"/>
  <path d="M100 190 L279 261" class="edge-hot"/>
  <path d="M100 240 L278 198" class="edge"/>
  <path d="M100 240 L278 266" class="edge"/>
  <path d="M100 290 L280 204" class="edge"/>
  <path d="M100 290 L278 274" class="edge"/>
  <path d="M100 340 L282 208" class="edge"/>
  <path d="M100 340 L276 349" class="edge"/>
  <g stroke="#27313A" stroke-width="2.5">
    <circle cx="80" cy="190" r="20" fill="#EDF5FF"/>
    <circle cx="80" cy="240" r="20" fill="#EDF5FF"/>
    <circle cx="80" cy="290" r="20" fill="#EDF5FF"/>
    <circle cx="80" cy="340" r="20" fill="#EDF5FF"/>
    <circle cx="300" cy="190" r="24" fill="#E7F7EA"/>
    <circle cx="300" cy="270" r="24" fill="#FFF0D8"/>
    <circle cx="300" cy="350" r="24" fill="#F7DEDC"/>
  </g>
  <g text-anchor="middle" class="sans label">
    <text x="80" y="196">12</text>
    <text x="80" y="246">40</text>
    <text x="80" y="296">63</text>
    <text x="80" y="346">75</text>
    <text x="300" y="196">7</text>
    <text x="300" y="276">42</text>
    <text x="300" y="356">91</text>
  </g>
  <text x="330" y="187" class="sans small">T1 HOT</text>
  <text x="330" y="206" class="sans small">4 readers</text>
  <text x="330" y="267" class="sans small">T2 MOD</text>
  <text x="330" y="286" class="sans small">3 readers</text>
  <text x="330" y="347" class="sans small">T3 COLD</text>
  <text x="330" y="366" class="sans small">1 reader</text>
  <text x="60" y="405" class="sans small">blue edge: reader 12 → property 42</text>

  <!-- CSR -->
  <text x="610" y="155" text-anchor="middle" class="sans heading">1b. CSR topology</text>
  <text x="470" y="190" class="mono small">vertex rows = [12, 40, 63, 75]</text>
  <text x="470" y="218" class="mono small">row_ptr = [0, 2, 4, 6, 8]</text>
  <text x="470" y="260" class="sans label">edge position i</text>
  <g transform="translate(558 238)" class="mono small" text-anchor="middle">
    <rect x="0" y="0" width="24" height="32" class="slot"/><text x="12" y="22">0</text>
    <rect x="24" y="0" width="24" height="32" fill="#FFF0D8" stroke="#1769C2" stroke-width="2.5"/><text x="36" y="22">1</text>
    <rect x="48" y="0" width="24" height="32" class="slot"/><text x="60" y="22">2</text>
    <rect x="72" y="0" width="24" height="32" class="slot"/><text x="84" y="22">3</text>
    <rect x="96" y="0" width="24" height="32" class="slot"/><text x="108" y="22">4</text>
    <rect x="120" y="0" width="24" height="32" class="slot"/><text x="132" y="22">5</text>
    <rect x="144" y="0" width="24" height="32" class="slot"/><text x="156" y="22">6</text>
    <rect x="168" y="0" width="24" height="32" class="slot"/><text x="180" y="22">7</text>
  </g>
  <text x="470" y="310" class="sans label">col_idx[i]</text>
  <g transform="translate(558 284)" class="mono small" text-anchor="middle">
    <rect x="0" y="0" width="24" height="42" fill="#E7F7EA" stroke="#27313A"/><text x="12" y="27">7</text>
    <rect x="24" y="0" width="24" height="42" fill="#FFF0D8" stroke="#1769C2" stroke-width="3"/><text x="36" y="27">42</text>
    <rect x="48" y="0" width="24" height="42" fill="#E7F7EA" stroke="#27313A"/><text x="60" y="27">7</text>
    <rect x="72" y="0" width="24" height="42" fill="#FFF0D8" stroke="#27313A"/><text x="84" y="27">42</text>
    <rect x="96" y="0" width="24" height="42" fill="#E7F7EA" stroke="#27313A"/><text x="108" y="27">7</text>
    <rect x="120" y="0" width="24" height="42" fill="#FFF0D8" stroke="#27313A"/><text x="132" y="27">42</text>
    <rect x="144" y="0" width="24" height="42" fill="#E7F7EA" stroke="#27313A"/><text x="156" y="27">7</text>
    <rect x="168" y="0" width="24" height="42" fill="#F7DEDC" stroke="#27313A"/><text x="180" y="27">91</text>
  </g>
  <text x="470" y="365" class="sans body">row 12 occupies edge positions 0–1</text>
  <text x="470" y="391" class="sans body">col_idx[1] = 42 → T2 moderate</text>

  <!-- ReusePlan / masks -->
  <text x="985" y="155" text-anchor="middle" class="sans heading">1c. Edge-aligned masks</text>
  <text x="830" y="180" class="sans small">packed: replaces col_idx[i]</text>
  <text x="830" y="199" class="sans small">sidecar: remains parallel at the same i</text>
  <g transform="translate(830 212)" class="mono small">
    <rect x="0" y="0" width="310" height="30" fill="#E7F7EA" stroke="#27313A"/><text x="10" y="21">i=0  dest 7 | T1 hot</text>
    <rect x="0" y="30" width="310" height="50" fill="#FFF0D8" stroke="#1769C2" stroke-width="3"/>
    <text x="10" y="51">i=1  dest 42 | T2 moderate</text>
    <text x="10" y="72">     e1 12 | e2 40</text>
    <rect x="0" y="80" width="310" height="30" fill="#E7F7EA" stroke="#27313A"/><text x="10" y="101">i=2  dest 7 | T1 hot</text>
    <rect x="0" y="110" width="310" height="30" fill="#FFF0D8" stroke="#27313A"/><text x="10" y="131">i=3  dest 42 | T2 moderate</text>
    <rect x="0" y="140" width="310" height="24" class="slot"/><text x="10" y="158">…</text>
    <rect x="0" y="164" width="310" height="30" fill="#F7DEDC" stroke="#27313A"/><text x="10" y="185">i=7  dest 91 | T3 cold</text>
  </g>

  <path d="M415 270 H441" class="arrow"/>
  <path d="M775 270 H801" class="arrow"/>

  <!-- Runtime use -->
  <rect x="35" y="450" width="1130" height="72" rx="10" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <rect x="60" y="462" width="220" height="48" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="170" y="482" text-anchor="middle" class="sans label">2. load record[1]</text>
  <text x="170" y="502" text-anchor="middle" class="sans small">3. decode fields into rd</text>
  <rect x="335" y="462" width="315" height="48" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="492" y="482" text-anchor="middle" class="mono small">4. dest 42 → base + 42 × 4</text>
  <text x="492" y="502" text-anchor="middle" class="sans small">property address 0x8000_00A8</text>
  <rect x="705" y="462" width="430" height="48" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="920" y="482" text-anchor="middle" class="mono small">5. T2 + epochs 12/40 → ReuseBind</text>
  <text x="920" y="502" text-anchor="middle" class="sans small">6. LLC line metadata and victim ranking</text>
  <path d="M280 486 H331" class="arrow"/>
  <path d="M650 486 H701" class="arrow"/>
</svg>
