<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Graph to CSR and edge-aligned ReusePlan masks</title>
  <desc id="desc">A four-node graph is converted to CSR row pointers and destination IDs. A ReusePlan mask aligns with each CSR edge position. At runtime the destination forms the property address while tier and epochs bind to that property request and guide LLC replacement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:16px}
      .heading{font-size:20px;font-weight:700}
      .label{font-size:16px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:14px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{fill:none;stroke:#27313A;stroke-width:2.2;marker-end:url(#arrow)}
      .edge-hot{fill:none;stroke:#1769C2;stroke-width:4;marker-end:url(#arrow)}
      .slot{fill:#FFFFFF;stroke:#27313A;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1200" height="550" fill="#FFFFFF"/>
  <text x="45" y="48" class="sans title">From graph topology to edge-aligned ReusePlan masks</text>
  <text x="45" y="76" class="sans subtitle">Adapted to ECG Next from the graph-to-CSR relationship illustrated in the ECG paper.</text>
  <line x1="45" y1="98" x2="1155" y2="98" stroke="#27313A" stroke-width="2"/>

  <g stroke="#27313A" stroke-width="3">
    <rect x="35" y="120" width="300" height="300" rx="11" fill="#EDF5FF"/>
    <rect x="365" y="120" width="350" height="300" rx="11" fill="#FFF0D8"/>
    <rect x="745" y="120" width="420" height="300" rx="11" fill="#EEE9FF"/>
  </g>

  <!-- Graph -->
  <text x="185" y="155" text-anchor="middle" class="sans heading">1. Directed graph</text>
  <path d="M122 244 L163 216" class="edge"/>
  <path d="M122 276 L163 304" class="edge-hot"/>
  <path d="M207 216 L248 244" class="edge"/>
  <path d="M207 304 L248 276" class="edge"/>
  <g stroke="#27313A" stroke-width="2.5">
    <circle cx="100" cy="260" r="27" fill="#EDF5FF"/>
    <circle cx="185" cy="200" r="27" fill="#E7F7EA"/>
    <circle cx="185" cy="320" r="27" fill="#FFF0D8"/>
    <circle cx="270" cy="260" r="27" fill="#EEE9FF"/>
  </g>
  <g text-anchor="middle" class="sans label">
    <text x="100" y="266">7</text>
    <text x="185" y="206">12</text>
    <text x="185" y="326">42</text>
    <text x="270" y="266">91</text>
  </g>
  <text x="60" y="390" class="sans body">Highlighted edge: 7 → 42</text>
  <text x="60" y="412" class="sans small">destination 42 selects property[42]</text>

  <!-- CSR -->
  <text x="540" y="155" text-anchor="middle" class="sans heading">2. CSR topology</text>
  <text x="390" y="193" class="mono small">vertex rows = [7, 12, 42, 91]</text>
  <text x="390" y="221" class="mono small">row_ptr     = [0,  2,  3,  4,  4]</text>
  <text x="390" y="260" class="sans label">edge position i</text>
  <g transform="translate(525 238)" class="mono small" text-anchor="middle">
    <rect x="0" y="0" width="42" height="32" class="slot"/><text x="21" y="22">0</text>
    <rect x="42" y="0" width="42" height="32" fill="#FFF0D8" stroke="#27313A" stroke-width="2.5"/><text x="63" y="22">1</text>
    <rect x="84" y="0" width="42" height="32" class="slot"/><text x="105" y="22">2</text>
    <rect x="126" y="0" width="42" height="32" class="slot"/><text x="147" y="22">3</text>
  </g>
  <text x="390" y="310" class="sans label">col_idx[i]</text>
  <g transform="translate(525 284)" class="mono small" text-anchor="middle">
    <rect x="0" y="0" width="42" height="42" class="slot"/><text x="21" y="27">12</text>
    <rect x="42" y="0" width="42" height="42" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/><text x="63" y="27">42</text>
    <rect x="84" y="0" width="42" height="42" class="slot"/><text x="105" y="27">91</text>
    <rect x="126" y="0" width="42" height="42" class="slot"/><text x="147" y="27">91</text>
  </g>
  <text x="390" y="365" class="sans body">row 7 occupies edge positions 0–1</text>
  <text x="390" y="391" class="sans body">col_idx[1] = 42 is the highlighted edge</text>

  <!-- ReusePlan / masks -->
  <text x="955" y="155" text-anchor="middle" class="sans heading">3. Edge-aligned ReusePlan masks</text>
  <text x="770" y="184" class="sans small">one logical mask for each CSR edge position</text>
  <g transform="translate(770 202)" class="mono small">
    <rect x="0" y="0" width="370" height="38" class="slot"/><text x="12" y="25">i=0  dest 12 | ...</text>
    <rect x="0" y="38" width="370" height="58" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
    <text x="12" y="62">i=1  dest 42 | tier 2</text>
    <text x="12" y="84">     e1 12 | e2 40</text>
    <rect x="0" y="96" width="370" height="38" class="slot"/><text x="12" y="121">i=2  dest 91 | ...</text>
    <rect x="0" y="134" width="370" height="38" class="slot"/><text x="12" y="159">i=3  dest 91 | ...</text>
  </g>
  <text x="770" y="388" class="sans small">Packed: record[i] replaces col_idx[i]</text>
  <text x="770" y="410" class="sans small">Sidecar: mask[i] remains parallel to col_idx[i]</text>

  <path d="M335 270 H361" class="arrow"/>
  <path d="M715 270 H741" class="arrow"/>

  <!-- Runtime use -->
  <rect x="35" y="450" width="1130" height="72" rx="10" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <rect x="60" y="462" width="220" height="48" rx="8" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="170" y="491" text-anchor="middle" class="sans label">load record[1]</text>
  <rect x="335" y="462" width="315" height="48" rx="8" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="492" y="482" text-anchor="middle" class="mono small">dest 42 → base + 42 × 4</text>
  <text x="492" y="502" text-anchor="middle" class="sans small">property address 0x8000_00A8</text>
  <rect x="705" y="462" width="430" height="48" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="920" y="482" text-anchor="middle" class="mono small">tier 2 + epochs 12/40 → ReuseBind</text>
  <text x="920" y="502" text-anchor="middle" class="sans small">LLC line metadata and victim ranking</text>
  <path d="M280 486 H331" class="arrow"/>
  <path d="M650 486 H701" class="arrow"/>
</svg>
