<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ReusePlan custom RISC-V instructions in an out-of-order pipeline</title>
  <desc id="desc">A conventional block diagram shows fetch, decode, rename and dispatch, issue, execute, the load-store unit, writeback and commit. Two straight colored lanes show ReuseBind reuse metadata and FlowThrough placement metadata entering the load-store unit and data cache.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.2" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#344f63"/>
    </marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.2" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrow-coral" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.2" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e76f51"/>
    </marker>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 14px Arial,sans-serif;fill:#607487}
      .stage{font:700 16px Arial,sans-serif;fill:#17324d}
      .body{font:400 12px Arial,sans-serif;fill:#405568}
      .small{font:400 11px Arial,sans-serif;fill:#506679}
      .mono{font:700 11px 'Courier New',monospace;fill:#17324d}
      .bar{font:700 15px Arial,sans-serif;fill:#17324d}
      .lane-title{font:700 12px 'Courier New',monospace}
      .lane-body{font:400 11px Arial,sans-serif;fill:#405568}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="42" class="title">Custom RISC-V load flow through the O3 pipeline</text>
  <text x="40" y="67" class="subtitle">Straight paths separate instruction flow, register state, memory requests, and cache actions.</text>

  <rect x="430" y="92" width="700" height="42" fill="#e7ebef" stroke="#738596" stroke-width="1.3"/>
  <text x="780" y="118" text-anchor="middle" class="bar">Reorder buffer: completion, exceptions, and in-order commit</text>

  <rect x="255" y="150" width="805" height="42" fill="#e7ebef" stroke="#738596" stroke-width="1.3"/>
  <text x="657" y="176" text-anchor="middle" class="bar">Register alias table and physical register files</text>

  <g fill="#f4c84a" stroke="#8f6c0f" stroke-width="1.4">
    <rect x="30" y="235" width="130" height="116" rx="12"/>
    <rect x="180" y="235" width="130" height="116" rx="12"/>
    <rect x="330" y="235" width="145" height="116" rx="12"/>
    <rect x="495" y="235" width="130" height="116" rx="12"/>
    <rect x="645" y="235" width="130" height="116" rx="12"/>
    <rect x="795" y="235" width="145" height="116" rx="12"/>
    <rect x="960" y="235" width="100" height="116" rx="12"/>
    <rect x="1080" y="235" width="90" height="116" rx="12"/>
  </g>

  <g fill="#d9dee3" stroke="#738596" stroke-width="1">
    <rect x="164" y="245" width="12" height="96"/>
    <rect x="314" y="245" width="12" height="96"/>
    <rect x="479" y="245" width="12" height="96"/>
    <rect x="629" y="245" width="12" height="96"/>
    <rect x="779" y="245" width="12" height="96"/>
    <rect x="944" y="245" width="12" height="96"/>
    <rect x="1064" y="245" width="12" height="96"/>
  </g>
  <g fill="#263746">
    <path d="M165 339 L175 339 L175 322 Z"/>
    <path d="M315 339 L325 339 L325 322 Z"/>
    <path d="M480 339 L490 339 L490 322 Z"/>
    <path d="M630 339 L640 339 L640 322 Z"/>
    <path d="M780 339 L790 339 L790 322 Z"/>
    <path d="M945 339 L955 339 L955 322 Z"/>
    <path d="M1065 339 L1075 339 L1075 322 Z"/>
  </g>

  <text x="95" y="264" text-anchor="middle" class="stage">Fetch</text>
  <text x="52" y="291" class="body">PC + predictor</text>
  <text x="52" y="314" class="body">instruction cache</text>
  <text x="52" y="336" class="body">redirect on branch</text>

  <text x="245" y="264" text-anchor="middle" class="stage">Decode</text>
  <text x="200" y="291" class="body">custom-0 opcode</text>
  <text x="200" y="314" class="mono">ecg.flow.load</text>
  <text x="200" y="336" class="mono">ecg.bind.load.*</text>

  <text x="402" y="264" text-anchor="middle" class="stage">Rename/Dispatch</text>
  <text x="350" y="291" class="body">rename destination</text>
  <text x="350" y="314" class="body">allocate ROB / IQ / LQ</text>
  <text x="350" y="336" class="body">track rs1 and rs2</text>

  <text x="560" y="264" text-anchor="middle" class="stage">Issue Queue</text>
  <text x="515" y="291" class="body">wait for operands</text>
  <text x="515" y="314" class="body">wake when ready</text>
  <text x="515" y="336" class="body">select ready load</text>

  <text x="710" y="264" text-anchor="middle" class="stage">Execute / AGU</text>
  <text x="665" y="291" class="body">compute EA</text>
  <text x="665" y="314" class="body">send address to LSU</text>

  <text x="867" y="264" text-anchor="middle" class="stage">Load / Store Unit</text>
  <text x="817" y="291" class="body">LSQ order check</text>
  <text x="817" y="314" class="body">build Request</text>
  <text x="817" y="336" class="body">attach extension</text>

  <text x="1010" y="264" text-anchor="middle" class="stage">Writeback</text>
  <text x="979" y="294" class="body">data to integer</text>
  <text x="979" y="316" class="body">or FP register</text>

  <text x="1125" y="264" text-anchor="middle" class="stage">Commit</text>
  <text x="1125" y="304" text-anchor="middle" class="body">retire in order</text>

  <g stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="160" y1="293" x2="180" y2="293"/>
    <line x1="310" y1="293" x2="330" y2="293"/>
    <line x1="475" y1="293" x2="495" y2="293"/>
    <line x1="625" y1="293" x2="645" y2="293"/>
    <line x1="775" y1="293" x2="795" y2="293"/>
    <line x1="940" y1="293" x2="960" y2="293"/>
    <line x1="1060" y1="293" x2="1080" y2="293"/>
  </g>

  <line x1="402" y1="192" x2="402" y2="231" stroke="#344f63" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="560" y1="192" x2="560" y2="231" stroke="#344f63" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1010" y1="235" x2="1010" y2="196" stroke="#344f63" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1125" y1="138" x2="1125" y2="231" stroke="#344f63" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="380,235 380,210 235,210 235,113 426,113" fill="none" stroke="#344f63" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1035" y1="235" x2="1035" y2="138" stroke="#344f63" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="180" y="382" width="760" height="36" rx="8" fill="#e8f6f3" stroke="#78bdb1"/>
  <text x="196" y="405" class="lane-title" fill="#19786d">ecg.bind.load.*</text>
  <text x="330" y="405" class="lane-body">rs1: address; rs2: dest / tier / e1 / e2</text>
  <line x1="600" y1="400" x2="735" y2="400" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
  <text x="755" y="405" class="lane-body">CSRs: current epoch / context</text>

  <rect x="180" y="430" width="760" height="36" rx="8" fill="#fff0eb" stroke="#e7a08f"/>
  <text x="196" y="453" class="lane-title" fill="#b94d34">ecg.flow.load</text>
  <text x="350" y="453" class="lane-body">rs1 record address</text>
  <line x1="500" y1="448" x2="780" y2="448" stroke="#e76f51" stroke-width="1.8" marker-end="url(#arrow-coral)"/>
  <text x="800" y="453" class="lane-body">no-allocate-on-fill</text>

  <rect x="650" y="505" width="110" height="105" rx="12" fill="#f5f8fb" stroke="#738596" stroke-width="1.3"/>
  <text x="705" y="532" text-anchor="middle" class="stage">D-TLB</text>
  <text x="672" y="558" class="body">translate VA</text>
  <text x="672" y="580" class="body">to PA</text>

  <rect x="790" y="505" width="160" height="105" rx="12" fill="#f5f8fb" stroke="#738596" stroke-width="1.3"/>
  <text x="870" y="532" text-anchor="middle" class="stage">L1D / L2</text>
  <text x="812" y="558" class="body">normal hit + fill</text>
  <text x="812" y="580" class="body">forward extension</text>

  <rect x="980" y="505" width="120" height="105" rx="12" fill="#fff7e8" stroke="#c38f27" stroke-width="1.3"/>
  <text x="1040" y="532" text-anchor="middle" class="stage">LLC</text>
  <circle cx="997" cy="556" r="4" fill="#2a9d8f"/>
  <text x="1008" y="560" class="small">store ReusePlan state</text>
  <circle cx="997" cy="580" r="4" fill="#e76f51"/>
  <text x="1008" y="584" class="small">no LLC insert</text>

  <rect x="1125" y="505" width="60" height="105" rx="12" fill="#f5f8fb" stroke="#738596" stroke-width="1.3"/>
  <text x="1155" y="532" text-anchor="middle" class="stage">Mem</text>
  <text x="1137" y="565" class="small">miss</text>
  <text x="1137" y="582" class="small">service</text>

  <polyline points="930,351 930,480 705,480 705,501" fill="none" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="760" y1="545" x2="786" y2="545" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="950" y1="545" x2="976" y2="545" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1100" y1="545" x2="1121" y2="545" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>

  <line x1="1125" y1="590" x2="1104" y2="590" stroke="#344f63" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="980" y1="590" x2="954" y2="590" stroke="#344f63" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="870,505 870,480 915,480 915,355" fill="none" stroke="#344f63" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="880" y="472" class="small">data response</text>

  <line x1="840" y1="382" x2="840" y2="355" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
  <line x1="940" y1="430" x2="940" y2="355" stroke="#e76f51" stroke-width="1.8" marker-end="url(#arrow-coral)"/>

  <rect x="180" y="640" width="990" height="34" rx="8" fill="#eef2f5"/>
  <circle cx="200" cy="657" r="5" fill="#2a9d8f"/>
  <text x="214" y="662" class="small">ReuseBind metadata belongs to the property request.</text>
  <circle cx="575" cy="657" r="5" fill="#e76f51"/>
  <text x="589" y="662" class="small">FlowThrough placement belongs to the edge-record request.</text>
</svg>
