<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">ReuseBind and FlowThrough through an out-of-order RISC-V pipeline</title>
  <desc id="desc">Two separate horizontal lanes show the stage-by-stage path of a ReuseBind property load and a ReusePlan record load with FlowThrough. A third panel shows the shared cache request and response path. Connectors remain inside their own lanes and do not cross.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L8 3.5 L0 7 Z" fill="#1769C2"/>
    </marker>
    <marker id="teal-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L8 3.5 L0 7 Z" fill="#1769C2"/>
    </marker>
    <marker id="coral-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L8 3.5 L0 7 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
      }
      .title{font:700 30px Arial,sans-serif;fill:#27313A}
      .subtitle{font:400 15px Arial,sans-serif;fill:#27313A}
      .column{font:700 14px Arial,sans-serif;fill:#27313A}
      .lane-title{font:700 20px Arial,sans-serif;fill:#27313A}
      .lane-note{font:400 13px Arial,sans-serif;fill:#27313A}
      .box-title{font:700 14px Arial,sans-serif;fill:#27313A}
      .body{font:400 11px Arial,sans-serif;fill:#27313A}
      .mono{font:700 11px 'Courier New',monospace;fill:#27313A}
      .small{font:400 11px Arial,sans-serif;fill:#27313A}
      .panel-title{font:700 18px Arial,sans-serif;fill:#27313A}
    </style>
  </defs>

  <rect width="1600" height="980" fill="#FFFFFF"/>
  <text x="42" y="44" class="title">Stage-by-stage RISC-V instruction flow</text>
  <text x="42" y="70" class="subtitle">Each colored lane owns a separate request. The common cache path is shown below on dedicated forward and response tracks.</text>

  <g fill="#F8F6EC" stroke="#27313A" stroke-width="2">
    <rect x="35" y="102" width="160" height="54" rx="9"/>
    <rect x="225" y="102" width="160" height="54" rx="9"/>
    <rect x="415" y="102" width="160" height="54" rx="9"/>
    <rect x="605" y="102" width="160" height="54" rx="9"/>
    <rect x="795" y="102" width="160" height="54" rx="9"/>
    <rect x="985" y="102" width="175" height="54" rx="9"/>
    <rect x="1190" y="102" width="180" height="54" rx="9"/>
    <rect x="1400" y="102" width="165" height="54" rx="9"/>
  </g>
  <g text-anchor="middle" class="column">
    <text x="115" y="135">Fetch</text>
    <text x="305" y="135">Decode</text>
    <text x="495" y="135">Rename / Dispatch</text>
    <text x="685" y="135">Issue / Read</text>
    <text x="875" y="135">Execute / AGU</text>
    <text x="1072" y="135">LSQ / Request</text>
    <text x="1280" y="135">Cache action</text>
    <text x="1482" y="135">Complete</text>
  </g>

  <rect x="28" y="178" width="1544" height="260" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="48" y="211" class="lane-title">ReuseBind property request</text>
  <text x="48" y="233" class="lane-note">ecg.bind.load.* uses a computed address; ecg.bind.iload.* forms an indexed address from the plan.</text>

  <g fill="#E7F7EA" stroke="#27313A" stroke-width="2">
    <rect x="35" y="255" width="160" height="145" rx="10"/>
    <rect x="225" y="255" width="160" height="145" rx="10"/>
    <rect x="415" y="255" width="160" height="145" rx="10"/>
    <rect x="605" y="255" width="160" height="145" rx="10"/>
    <rect x="795" y="255" width="160" height="145" rx="10"/>
    <rect x="985" y="255" width="175" height="145" rx="10"/>
    <rect x="1190" y="255" width="180" height="145" rx="10"/>
    <rect x="1400" y="255" width="165" height="145" rx="10"/>
  </g>

  <text x="52" y="282" class="box-title">Instruction bytes</text>
  <text x="52" y="307" class="body">fetch custom-0 opcode</text>
  <text x="52" y="329" class="body">normal I-cache path</text>
  <text x="52" y="351" class="body">branch recovery unchanged</text>

  <text x="242" y="282" class="box-title">Classify operation</text>
  <text x="242" y="307" class="mono">ecg.bind.load.*</text>
  <text x="242" y="329" class="mono">ecg.bind.iload.*</text>
  <text x="242" y="351" class="body">read rd, rs1, rs2 fields</text>

  <text x="432" y="282" class="box-title">Allocate state</text>
  <text x="432" y="307" class="body">rename rd or fd</text>
  <text x="432" y="329" class="body">allocate ROB and LQ</text>
  <text x="432" y="351" class="body">track both sources</text>

  <text x="622" y="282" class="box-title">Wait for operands</text>
  <text x="622" y="307" class="body">rs1: address or base</text>
  <text x="622" y="329" class="body">rs2: ReusePlan record</text>
  <text x="622" y="351" class="body">issue when both are ready</text>

  <text x="812" y="282" class="box-title">Form address</text>
  <text x="812" y="307" class="mono">load: EA = rs1</text>
  <text x="812" y="329" class="mono">iload: base +</text>
  <text x="812" y="351" class="mono">dest x element size</text>
  <text x="812" y="373" class="body">send EA and plan to LSQ</text>

  <text x="1002" y="282" class="box-title">Build exact Request</text>
  <text x="1002" y="307" class="body">run ordering checks</text>
  <text x="1002" y="329" class="body">attach ReuseBind extension</text>
  <text x="1002" y="351" class="body">include context and epoch</text>

  <text x="1207" y="282" class="box-title">Property access</text>
  <text x="1207" y="307" class="body">normal L1/L2/LLC lookup</text>
  <text x="1207" y="329" class="body">consume extension at LLC</text>
  <text x="1207" y="351" class="body">stamp property hit or fill</text>

  <text x="1417" y="282" class="box-title">Return property</text>
  <text x="1417" y="307" class="body">write integer or FP result</text>
  <text x="1417" y="329" class="body">mark ROB entry complete</text>
  <text x="1417" y="351" class="body">retire in program order</text>

  <g stroke="#1769C2" stroke-width="3" marker-end="url(#teal-arrow)">
    <line x1="195" y1="327" x2="221" y2="327"/>
    <line x1="385" y1="327" x2="411" y2="327"/>
    <line x1="575" y1="327" x2="601" y2="327"/>
    <line x1="765" y1="327" x2="791" y2="327"/>
    <line x1="955" y1="327" x2="981" y2="327"/>
    <line x1="1160" y1="327" x2="1186" y2="327"/>
    <line x1="1370" y1="327" x2="1396" y2="327"/>
  </g>

  <rect x="28" y="455" width="1544" height="260" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="48" y="488" class="lane-title">ReusePlan record request</text>
  <text x="48" y="510" class="lane-note">ecg.plan.load* uses ordinary placement; ecg.flow.load* carries the FlowThrough request flag.</text>

  <g fill="#F7DEDC" stroke="#27313A" stroke-width="2">
    <rect x="35" y="532" width="160" height="145" rx="10"/>
    <rect x="225" y="532" width="160" height="145" rx="10"/>
    <rect x="415" y="532" width="160" height="145" rx="10"/>
    <rect x="605" y="532" width="160" height="145" rx="10"/>
    <rect x="795" y="532" width="160" height="145" rx="10"/>
    <rect x="985" y="532" width="175" height="145" rx="10"/>
    <rect x="1190" y="532" width="180" height="145" rx="10"/>
    <rect x="1400" y="532" width="165" height="145" rx="10"/>
  </g>

  <text x="52" y="559" class="box-title">Instruction bytes</text>
  <text x="52" y="584" class="body">fetch custom-0 opcode</text>
  <text x="52" y="606" class="body">normal I-cache path</text>
  <text x="52" y="628" class="body">no frontend special case</text>

  <text x="242" y="559" class="box-title">Choose placement</text>
  <text x="242" y="584" class="mono">ecg.plan.load*</text>
  <text x="242" y="606" class="mono">ecg.flow.load*</text>
  <text x="242" y="628" class="body">read rd and rs1 fields</text>

  <text x="432" y="559" class="box-title">Allocate state</text>
  <text x="432" y="584" class="body">rename rd</text>
  <text x="432" y="606" class="body">allocate ROB and LQ</text>
  <text x="432" y="628" class="body">track record address</text>

  <text x="622" y="559" class="box-title">Wait for address</text>
  <text x="622" y="584" class="body">rs1: record address</text>
  <text x="622" y="606" class="body">no plan operand needed</text>
  <text x="622" y="628" class="body">issue when rs1 is ready</text>

  <text x="812" y="559" class="box-title">Form record EA</text>
  <text x="812" y="584" class="mono">EA = rs1 + immediate</text>
  <text x="812" y="606" class="body">compact form widens result</text>
  <text x="812" y="628" class="body">send request to LSQ</text>

  <text x="1002" y="559" class="box-title">Build record Request</text>
  <text x="1002" y="584" class="body">run ordering checks</text>
  <text x="1002" y="606" class="body">flow form sets request flag</text>
  <text x="1002" y="628" class="body">plan form sets no flag</text>

  <text x="1207" y="559" class="box-title">Record access</text>
  <text x="1207" y="584" class="body">private and LLC hits normal</text>
  <text x="1207" y="606" class="body">private fill on a miss</text>
  <text x="1207" y="628" class="body">flow form skips LLC insert</text>

  <text x="1417" y="559" class="box-title">Return record</text>
  <text x="1417" y="584" class="body">write packed plan to rd</text>
  <text x="1417" y="606" class="body">mark ROB entry complete</text>
  <text x="1417" y="628" class="body">retire in program order</text>

  <g stroke="#1769C2" stroke-width="3" marker-end="url(#coral-arrow)">
    <line x1="195" y1="604" x2="221" y2="604"/>
    <line x1="385" y1="604" x2="411" y2="604"/>
    <line x1="575" y1="604" x2="601" y2="604"/>
    <line x1="765" y1="604" x2="791" y2="604"/>
    <line x1="955" y1="604" x2="981" y2="604"/>
    <line x1="1160" y1="604" x2="1186" y2="604"/>
    <line x1="1370" y1="604" x2="1396" y2="604"/>
  </g>

  <rect x="110" y="747" width="1380" height="185" rx="12" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="135" y="778" class="panel-title">Common cache path used by both requests</text>
  <text x="135" y="799" class="small">Forward requests use the upper track; data and fill responses return on the lower track.</text>

  <g fill="#EDF5FF" stroke="#27313A" stroke-width="2">
    <rect x="285" y="815" width="150" height="72" rx="10"/>
    <rect x="505" y="815" width="150" height="72" rx="10"/>
    <rect x="725" y="815" width="150" height="72" rx="10"/>
    <rect x="945" y="815" width="150" height="72" rx="10"/>
    <rect x="1165" y="815" width="150" height="72" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="360" y="842" class="box-title">D-TLB</text>
    <text x="360" y="864" class="body">translate VA to PA</text>
    <text x="580" y="842" class="box-title">L1D / L2</text>
    <text x="580" y="864" class="body">normal hit and fill</text>
    <text x="800" y="842" class="box-title">MSHR / fill</text>
    <text x="800" y="864" class="body">merge request state</text>
    <text x="1020" y="842" class="box-title">LLC</text>
    <text x="1020" y="864" class="body">consume typed metadata</text>
    <text x="1240" y="842" class="box-title">Memory</text>
    <text x="1240" y="864" class="body">service miss</text>
  </g>

  <g stroke="#1769C2" stroke-width="3" marker-end="url(#arrow)">
    <line x1="435" y1="833" x2="501" y2="833"/>
    <line x1="655" y1="833" x2="721" y2="833"/>
    <line x1="875" y1="833" x2="941" y2="833"/>
    <line x1="1095" y1="833" x2="1161" y2="833"/>
    <line x1="1165" y1="874" x2="1099" y2="874"/>
    <line x1="945" y1="874" x2="879" y2="874"/>
    <line x1="725" y1="874" x2="659" y2="874"/>
    <line x1="505" y1="874" x2="439" y2="874"/>
  </g>

  <circle cx="135" cy="949" r="5" fill="#1769C2"/>
  <text x="148" y="953" class="small">ReuseBind metadata belongs only to the property request.</text>
  <circle cx="600" cy="949" r="5" fill="#1769C2"/>
  <text x="613" y="953" class="small">FlowThrough placement belongs only to the record request.</text>
</svg>
