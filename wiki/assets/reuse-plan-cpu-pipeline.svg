<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Detailed ECG RISC-V pipeline flow</title>
  <desc id="desc">Five large columns trace the record load, decode and dependency, property instruction, exact Request and cache path, and LLC completion using the shared ECG stage numbering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:34px;font-weight:700}
      .subtitle{font-size:17px}
      .heading{font-size:20px;font-weight:700}
      .label{font-size:16px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:14px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .slot{fill:#FFFFFF;stroke:#27313A;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="850" fill="#FFFFFF"/>
  <text x="40" y="50" class="sans title">Detailed ECG RISC-V pipeline flow</text>
  <text x="40" y="79" class="sans subtitle">The same stages 2–6 used by the graph and cache architecture figures.</text>
  <line x1="40" y1="103" x2="1560" y2="103" stroke="#27313A" stroke-width="2"/>

  <g stroke="#27313A" stroke-width="3">
    <rect x="35" y="130" width="280" height="580" rx="11" fill="#F7DEDC"/>
    <rect x="340" y="130" width="280" height="580" rx="11" fill="#FFF0D8"/>
    <rect x="645" y="130" width="280" height="580" rx="11" fill="#E7F7EA"/>
    <rect x="950" y="130" width="280" height="580" rx="11" fill="#EDF5FF"/>
    <rect x="1255" y="130" width="310" height="580" rx="11" fill="#EEE9FF"/>
  </g>

  <!-- Stage 2 -->
  <circle cx="63" cy="158" r="16" fill="#27313A"/>
  <text x="63" y="164" text-anchor="middle" fill="#FFFFFF" class="sans label">2</text>
  <text x="88" y="164" class="sans heading">Record load</text>
  <rect x="55" y="188" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="175" y="220" text-anchor="middle" class="mono label">ecg.flow.load.compact</text>

  <g text-anchor="middle">
    <rect x="55" y="270" width="48" height="58" rx="7" class="slot"/>
    <rect x="117" y="270" width="48" height="58" rx="7" class="slot"/>
    <rect x="179" y="270" width="48" height="58" rx="7" class="slot"/>
    <rect x="241" y="270" width="48" height="58" rx="7" class="slot"/>
    <text x="79" y="295" class="sans small">Fetch</text><text x="79" y="316" class="sans small">I$</text>
    <text x="141" y="295" class="sans small">Decode</text><text x="141" y="316" class="sans small">role</text>
    <text x="203" y="295" class="sans small">AGU</text><text x="203" y="316" class="sans small">EA</text>
    <text x="265" y="295" class="sans small">LQ</text><text x="265" y="316" class="sans small">FT = 1</text>
  </g>
  <path d="M103 299 H113" class="arrow"/>
  <path d="M165 299 H175" class="arrow"/>
  <path d="M227 299 H237" class="arrow"/>

  <rect x="55" y="360" width="240" height="120" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="75" y="388" class="sans label">Record Request</text>
  <text x="75" y="415" class="mono small">addr = edge line</text>
  <text x="75" y="438" class="mono small">size 4 | FT 1 | sequence s</text>
  <text x="75" y="463" class="sans small">normal ordering and replay</text>

  <rect x="55" y="510" width="240" height="82" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="175" y="539" text-anchor="middle" class="sans label">Record response → rd</text>
  <text x="175" y="566" text-anchor="middle" class="mono small">dest 42 | T2 | e1 12 | e2 40</text>
  <text x="175" y="638" text-anchor="middle" class="sans small">FlowThrough changes only</text>
  <text x="175" y="660" text-anchor="middle" class="sans small">record placement.</text>

  <!-- Stage 3 -->
  <circle cx="368" cy="158" r="16" fill="#27313A"/>
  <text x="368" y="164" text-anchor="middle" fill="#FFFFFF" class="sans label">3</text>
  <text x="393" y="164" class="sans heading">Decode + rd-to-rs2</text>

  <rect x="360" y="188" width="240" height="90" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="480" y="216" text-anchor="middle" class="sans label">custom-0 decode</text>
  <text x="380" y="245" class="sans body">role · width · rd/fd · rs1/rs2</text>
  <text x="380" y="267" class="sans small">format/context CSRs preloaded</text>

  <rect x="360" y="305" width="240" height="86" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="480" y="334" text-anchor="middle" class="sans label">ReusePlan physical register</text>
  <text x="480" y="363" text-anchor="middle" class="mono small">42 | T2 | 12 | 40</text>

  <rect x="360" y="420" width="240" height="100" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="480" y="449" text-anchor="middle" class="sans label">Issue queue</text>
  <rect x="378" y="463" width="204" height="23" fill="#F7DEDC" stroke="#27313A"/>
  <rect x="378" y="486" width="204" height="23" fill="#E7F7EA" stroke="#27313A"/>
  <text x="388" y="480" class="mono small">record load: done</text>
  <text x="388" y="503" class="mono small">property: wait both</text>

  <rect x="360" y="550" width="240" height="82" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="480" y="579" text-anchor="middle" class="sans body">record rd becomes property rs2</text>
  <text x="480" y="605" text-anchor="middle" class="sans small">ROB and rename preserve pairing</text>

  <!-- Stage 4 -->
  <circle cx="673" cy="158" r="16" fill="#27313A"/>
  <text x="673" y="164" text-anchor="middle" fill="#FFFFFF" class="sans label">4</text>
  <text x="698" y="164" class="sans heading">Property instruction</text>

  <rect x="665" y="188" width="240" height="92" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="785" y="216" text-anchor="middle" class="mono label">ecg.bind.load.f32</text>
  <text x="685" y="245" class="sans body">rs1 = computed address</text>
  <text x="685" y="267" class="sans body">rs2 = ReusePlan</text>

  <rect x="665" y="305" width="240" height="112" rx="8" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="785" y="333" text-anchor="middle" class="mono label">ecg.bind.iload.*</text>
  <text x="685" y="362" class="sans body">rs1 = property base</text>
  <text x="685" y="384" class="sans body">rs2 contains destination</text>
  <text x="685" y="406" class="sans small">EA = base + dest × element size</text>

  <rect x="665" y="445" width="240" height="82" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="785" y="474" text-anchor="middle" class="sans label">AGU + load queue</text>
  <text x="685" y="500" class="sans body">property EA · size 4 · FT 0</text>

  <rect x="665" y="555" width="240" height="82" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="785" y="584" text-anchor="middle" class="sans label">Typed property load</text>
  <text x="785" y="607" text-anchor="middle" class="sans small">one property instruction</text>
  <text x="785" y="628" text-anchor="middle" class="sans small">owns both inputs</text>

  <!-- Stage 5 -->
  <circle cx="978" cy="158" r="16" fill="#27313A"/>
  <text x="978" y="164" text-anchor="middle" fill="#FFFFFF" class="sans label">5</text>
  <text x="1003" y="164" class="sans heading">Request + cache path</text>

  <rect x="970" y="188" width="240" height="88" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="1090" y="216" text-anchor="middle" class="sans label">LSQ Request</text>
  <text x="990" y="245" class="sans body">ordering + replay checks</text>
  <text x="990" y="267" class="sans small">one exact dynamic sequence</text>

  <rect x="970" y="302" width="240" height="112" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="1090" y="330" text-anchor="middle" class="sans label">ReuseBind extension</text>
  <text x="1090" y="357" text-anchor="middle" class="mono small">dest 42 | T2 | e1 12 | e2 40</text>
  <text x="1090" y="381" text-anchor="middle" class="mono small">current 10 | ctx k | seq s</text>
  <text x="1090" y="403" text-anchor="middle" class="sans small">travels on the same Request</text>

  <g text-anchor="middle">
    <rect x="970" y="445" width="50" height="62" rx="7" class="slot"/>
    <rect x="1032" y="445" width="50" height="62" rx="7" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
    <rect x="1094" y="445" width="50" height="62" rx="7" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
    <rect x="1156" y="445" width="54" height="62" rx="7" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
    <text x="995" y="471" class="sans small">TLB</text><text x="995" y="493" class="sans small">VA/PA</text>
    <text x="1057" y="471" class="sans small">L1D</text><text x="1057" y="493" class="sans small">hit</text>
    <text x="1119" y="471" class="sans small">L2</text><text x="1119" y="493" class="sans small">hit</text>
    <text x="1183" y="471" class="sans small">MSHR</text><text x="1183" y="493" class="sans small">merge</text>
  </g>
  <path d="M1020 476 H1028" class="arrow"/>
  <path d="M1082 476 H1090" class="arrow"/>
  <path d="M1144 476 H1152" class="arrow"/>

  <rect x="970" y="545" width="240" height="90" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="990" y="573" class="sans body">same requestor + context</text>
  <text x="990" y="597" class="sans body">newest sequence owns hint</text>
  <text x="990" y="621" class="sans small">conflict invalidates ReuseBind</text>

  <!-- Stage 6 -->
  <circle cx="1283" cy="158" r="16" fill="#27313A"/>
  <text x="1283" y="164" text-anchor="middle" fill="#FFFFFF" class="sans label">6</text>
  <text x="1308" y="164" class="sans heading">LLC + completion</text>

  <rect x="1275" y="188" width="270" height="190" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="1410" y="216" text-anchor="middle" class="sans label">LLC property line</text>
  <rect x="1295" y="236" width="230" height="68" fill="#FFF0D8" stroke="#1769C2" stroke-width="3"/>
  <text x="1310" y="262" class="sans body">line 0x8000_0080 · RRPV 7</text>
  <text x="1310" y="287" class="sans body">T2 · e1 12 · e2 40</text>
  <text x="1295" y="334" class="mono small">d1 2 | d2 30 | nearest 2</text>
  <text x="1295" y="360" class="sans small">RRIP eligible → farthest reuse victim</text>

  <rect x="1275" y="405" width="270" height="112" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="1410" y="434" text-anchor="middle" class="sans label">Request-specific action</text>
  <text x="1295" y="463" class="sans body">property: store metadata on hit/fill</text>
  <text x="1295" y="487" class="sans body">record: FlowThrough skips insert</text>
  <text x="1295" y="509" class="sans small">all hits and private fills remain normal</text>

  <rect x="1275" y="545" width="270" height="90" rx="8" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="1410" y="574" text-anchor="middle" class="sans label">Completion</text>
  <text x="1295" y="602" class="sans body">data → integer/FP destination</text>
  <text x="1295" y="624" class="sans small">ROB complete → in-order retirement</text>

  <path d="M315 420 H336" class="arrow"/>
  <path d="M620 420 H641" class="arrow"/>
  <path d="M925 420 H946" class="arrow"/>
  <path d="M1230 420 H1251" class="arrow"/>

  <rect x="170" y="745" width="1260" height="55" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="800" y="778" text-anchor="middle" class="sans body">Architectural contract: two loads, one explicit rd→rs2 dependency, no metadata mailbox, and one request-bound property access.</text>
</svg>
