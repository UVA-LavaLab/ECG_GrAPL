<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Basic ECG RISC-V instruction flow</title>
  <desc id="desc">Five cards show the ReusePlan record load, decode and dependency, property load, exact Request binding, and LLC metadata and completion using the same stage numbers as the architecture figures.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:16px}
      .heading{font-size:19px;font-weight:700}
      .label{font-size:16px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:14px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="420" fill="#FFFFFF"/>
  <text x="40" y="48" class="sans title">ECG RISC-V path at a glance</text>
  <text x="40" y="76" class="sans subtitle">Two loads, one explicit register dependency, and one request-bound property access.</text>
  <line x1="40" y1="98" x2="1160" y2="98" stroke="#27313A" stroke-width="2"/>

  <g stroke="#27313A" stroke-width="3">
    <rect x="35" y="125" width="205" height="215" rx="11" fill="#F7DEDC"/>
    <rect x="265" y="125" width="205" height="215" rx="11" fill="#FFF0D8"/>
    <rect x="495" y="125" width="205" height="215" rx="11" fill="#E7F7EA"/>
    <rect x="725" y="125" width="205" height="215" rx="11" fill="#EDF5FF"/>
    <rect x="955" y="125" width="210" height="215" rx="11" fill="#EEE9FF"/>
  </g>

  <g class="sans">
    <circle cx="62" cy="152" r="16" fill="#27313A"/><text x="62" y="158" text-anchor="middle" fill="#FFFFFF" class="label">2</text>
    <text x="86" y="158" class="heading">Record load</text>
    <rect x="55" y="182" width="165" height="50" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
    <text x="137" y="203" text-anchor="middle" class="mono small">ecg.flow.load</text>
    <text x="137" y="222" text-anchor="middle" class="mono small">.compact</text>
    <text x="55" y="263" class="body">rs1: record address</text>
    <text x="55" y="287" class="body">rd: ReusePlan</text>
    <text x="55" y="317" class="small">FlowThrough flag on record</text>

    <circle cx="292" cy="152" r="16" fill="#27313A"/><text x="292" y="158" text-anchor="middle" fill="#FFFFFF" class="label">3</text>
    <text x="316" y="158" class="heading">Dependency</text>
    <text x="285" y="198" class="body">custom-0 decode</text>
    <rect x="285" y="215" width="165" height="52" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
    <text x="367" y="237" text-anchor="middle" class="label">ReusePlan rd</text>
    <text x="367" y="257" text-anchor="middle" class="mono small">42 | T2 | 12 | 40</text>
    <text x="285" y="294" class="body">rd becomes property rs2</text>
    <text x="285" y="318" class="small">issue waits for both inputs</text>

    <circle cx="522" cy="152" r="16" fill="#27313A"/><text x="522" y="158" text-anchor="middle" fill="#FFFFFF" class="label">4</text>
    <text x="546" y="158" class="heading">Property load</text>
    <rect x="515" y="182" width="165" height="50" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
    <text x="597" y="203" text-anchor="middle" class="mono small">ecg.bind.load</text>
    <text x="597" y="222" text-anchor="middle" class="mono small">.f32</text>
    <text x="515" y="263" class="body">rs1: property address</text>
    <text x="515" y="287" class="body">rs2: ReusePlan</text>
    <text x="515" y="317" class="small">one dynamic data load</text>

    <circle cx="752" cy="152" r="16" fill="#27313A"/><text x="752" y="158" text-anchor="middle" fill="#FFFFFF" class="label">5</text>
    <text x="776" y="158" class="heading">Exact Request</text>
    <text x="745" y="198" class="body">LSQ ordering + replay</text>
    <rect x="745" y="215" width="165" height="76" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
    <text x="827" y="238" text-anchor="middle" class="label">ReuseBind</text>
    <text x="827" y="260" text-anchor="middle" class="mono small">T2 | e1 12 | e2 40</text>
    <text x="827" y="281" text-anchor="middle" class="mono small">current · ctx · seq</text>
    <text x="745" y="318" class="small">bound to property Request</text>

    <circle cx="982" cy="152" r="16" fill="#27313A"/><text x="982" y="158" text-anchor="middle" fill="#FFFFFF" class="label">6</text>
    <text x="1006" y="158" class="heading">LLC + retire</text>
    <text x="975" y="198" class="body">store tier + epochs</text>
    <text x="975" y="222" class="body">RRIP + nearest reuse</text>
    <rect x="975" y="242" width="170" height="52" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
    <text x="1060" y="264" text-anchor="middle" class="mono small">d1 2 | d2 30</text>
    <text x="1060" y="285" text-anchor="middle" class="mono small">nearest 2</text>
    <text x="975" y="318" class="small">data → destination → ROB</text>
  </g>

  <path d="M240 233 H261" class="arrow"/>
  <path d="M470 233 H491" class="arrow"/>
  <path d="M700 233 H721" class="arrow"/>
  <path d="M930 233 H951" class="arrow"/>

  <rect x="150" y="365" width="900" height="38" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="390" text-anchor="middle" class="sans small">Record and property remain two loads; FlowThrough applies only to stage 2.</text>
</svg>
