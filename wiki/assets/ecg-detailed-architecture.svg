<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Detailed ECG processor and cache architecture</title>
  <desc id="desc">Six numbered cards trace an edge-aligned ReusePlan from graph preprocessing through a streaming record load, decode and register dependency, property instruction, exact cache Request, and LLC replacement. A footer separates FlowThrough record placement from normal property completion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 5 L0 10 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:38px;font-weight:700}
      .subtitle{font-size:18px}
      .heading{font-size:24px;font-weight:700}
      .label{font-size:18px;font-weight:700}
      .body{font-size:17px}
      .small{font-size:15px}
      .number{font-size:18px;font-weight:700}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .slot{fill:#FFFFFF;stroke:#27313A;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="1070" fill="#FFFFFF"/>
  <text x="40" y="52" class="sans title">ECG: graph mask to request-bound LLC replacement</text>
  <text x="40" y="83" class="sans subtitle">Representative out-of-order path. Numbering and tier colors match the README transformation figures.</text>
  <line x1="40" y1="108" x2="1560" y2="108" stroke="#27313A" stroke-width="2"/>

  <g stroke="#27313A" stroke-width="3">
    <rect x="35" y="140" width="480" height="350" rx="12" fill="#EDF5FF"/>
    <rect x="560" y="140" width="480" height="350" rx="12" fill="#F7DEDC"/>
    <rect x="1085" y="140" width="480" height="350" rx="12" fill="#FFF0D8"/>
    <rect x="35" y="550" width="480" height="380" rx="12" fill="#E7F7EA"/>
    <rect x="560" y="550" width="480" height="380" rx="12" fill="#EDF5FF"/>
    <rect x="1085" y="550" width="480" height="380" rx="12" fill="#EEE9FF"/>
  </g>

  <!-- Stage 1 -->
  <circle cx="68" cy="174" r="18" fill="#27313A"/>
  <text x="68" y="181" text-anchor="middle" fill="#FFFFFF" class="sans number">1</text>
  <text x="98" y="181" class="sans heading">Construct the CSR mask stream</text>
  <text x="60" y="215" class="sans small">Reader count sets tier; future reader order sets two epochs.</text>

  <g stroke="#27313A" stroke-width="2">
    <circle cx="100" cy="260" r="23" fill="#E7F7EA"/>
    <circle cx="275" cy="260" r="23" fill="#FFF0D8"/>
    <circle cx="445" cy="260" r="23" fill="#F7DEDC"/>
  </g>
  <g text-anchor="middle" class="sans label">
    <text x="100" y="266">7</text>
    <text x="275" y="266">42</text>
    <text x="445" y="266">91</text>
  </g>
  <text x="100" y="295" text-anchor="middle" class="sans small">T1 hot</text>
  <text x="275" y="295" text-anchor="middle" class="sans small">T2 moderate</text>
  <text x="445" y="295" text-anchor="middle" class="sans small">T3 cold</text>

  <text x="60" y="335" class="sans label">edge-aligned record[i = 1]</text>
  <g transform="translate(60 350)" text-anchor="middle">
    <rect x="0" y="0" width="200" height="65" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
    <rect x="200" y="0" width="70" height="65" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
    <rect x="270" y="0" width="70" height="65" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
    <rect x="340" y="0" width="70" height="65" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
    <text x="100" y="28" class="sans label">dest 42</text><text x="100" y="50" class="sans small">ID bits</text>
    <text x="235" y="28" class="sans label">2</text><text x="235" y="50" class="sans small">tier</text>
    <text x="305" y="28" class="sans label">12</text><text x="305" y="50" class="sans small">e1</text>
    <text x="375" y="28" class="sans label">40</text><text x="375" y="50" class="sans small">e2</text>
  </g>
  <rect x="60" y="438" width="410" height="35" rx="7" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="265" y="461" text-anchor="middle" class="mono small">dest 42 => word 0x8000_00A8 in line 0x8000_0080</text>

  <!-- Stage 2 -->
  <circle cx="593" cy="174" r="18" fill="#27313A"/>
  <text x="593" y="181" text-anchor="middle" fill="#FFFFFF" class="sans number">2</text>
  <text x="623" y="181" class="sans heading">Stream the record instruction</text>
  <rect x="590" y="205" width="420" height="50" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="800" y="237" text-anchor="middle" class="mono label">ecg.flow.load.compact</text>

  <g text-anchor="middle">
    <rect x="590" y="290" width="85" height="60" rx="8" class="slot"/>
    <rect x="700" y="290" width="85" height="60" rx="8" class="slot"/>
    <rect x="810" y="290" width="85" height="60" rx="8" class="slot"/>
    <rect x="920" y="290" width="85" height="60" rx="8" class="slot"/>
    <text x="632" y="317" class="sans label">Fetch</text><text x="632" y="339" class="sans small">custom-0</text>
    <text x="742" y="317" class="sans label">Decode</text><text x="742" y="339" class="sans small">record role</text>
    <text x="852" y="317" class="sans label">AGU</text><text x="852" y="339" class="sans small">edge address</text>
    <text x="962" y="317" class="sans label">LQ</text><text x="962" y="339" class="sans small">FT = 1</text>
  </g>
  <path d="M675 320 H696" class="arrow"/>
  <path d="M785 320 H806" class="arrow"/>
  <path d="M895 320 H916" class="arrow"/>

  <rect x="590" y="375" width="420" height="82" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="610" y="400" class="mono small">addr = edge line | size = 4</text>
  <text x="610" y="422" class="mono small">FT = 1 | sequence = s</text>
  <text x="610" y="447" class="sans body">Response writes dest, tier, e1, and e2 to rd.</text>
  <text x="800" y="476" text-anchor="middle" class="sans small">FlowThrough belongs only to this record Request.</text>

  <!-- Stage 3 -->
  <circle cx="1118" cy="174" r="18" fill="#27313A"/>
  <text x="1118" y="181" text-anchor="middle" fill="#FFFFFF" class="sans number">3</text>
  <text x="1148" y="181" class="sans heading">Track decode and dependency</text>

  <rect x="1110" y="210" width="205" height="115" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="1212" y="238" text-anchor="middle" class="sans label">Issue queue</text>
  <rect x="1128" y="254" width="169" height="25" fill="#F7DEDC" stroke="#27313A"/>
  <rect x="1128" y="279" width="169" height="28" fill="#E7F7EA" stroke="#27313A"/>
  <text x="1138" y="272" class="mono small">record: done</text>
  <text x="1138" y="298" class="mono small">property: wait both</text>

  <rect x="1335" y="210" width="200" height="115" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="1435" y="238" text-anchor="middle" class="sans label">ROB</text>
  <text x="1355" y="269" class="mono small">flow.load  done</text>
  <text x="1355" y="294" class="mono small">bind.load  waiting</text>
  <text x="1355" y="316" class="mono small">dependent op</text>

  <rect x="1110" y="350" width="425" height="92" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="1322" y="380" text-anchor="middle" class="sans label">ReusePlan register rd</text>
  <text x="1322" y="410" text-anchor="middle" class="mono body">dest 42 | tier 2 | e1 12 | e2 40</text>
  <path d="M1212 346 V329" class="arrow"/>
  <text x="1322" y="460" text-anchor="middle" class="sans small">Rename links record rd to property rs2.</text>
  <text x="1322" y="482" text-anchor="middle" class="sans small">Issue waits for address and ReusePlan.</text>

  <!-- Stage 4 -->
  <circle cx="68" cy="584" r="18" fill="#27313A"/>
  <text x="68" y="591" text-anchor="middle" fill="#FFFFFF" class="sans number">4</text>
  <text x="98" y="591" class="sans heading">Execute the property instruction</text>
  <rect x="60" y="615" width="430" height="50" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="275" y="647" text-anchor="middle" class="mono label">ecg.bind.load.f32</text>

  <rect x="60" y="695" width="195" height="65" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <rect x="280" y="695" width="210" height="65" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="157" y="722" text-anchor="middle" class="sans label">rs1: address</text>
  <text x="157" y="747" text-anchor="middle" class="mono small">0x8000_00A8</text>
  <text x="385" y="722" text-anchor="middle" class="sans label">rs2: ReusePlan</text>
  <text x="385" y="747" text-anchor="middle" class="mono small">42 | T2 | 12 | 40</text>
  <text x="275" y="790" text-anchor="middle" class="sans small">One dynamic property load owns both inputs.</text>

  <g text-anchor="middle">
    <rect x="60" y="820" width="120" height="72" rx="8" class="slot"/>
    <rect x="210" y="810" width="120" height="92" rx="8" class="slot"/>
    <rect x="360" y="810" width="130" height="92" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
    <text x="120" y="850" class="sans label">AGU</text><text x="120" y="875" class="sans small">property EA</text>
    <text x="270" y="840" class="sans label">Load queue</text><text x="270" y="865" class="sans small">size 4 · FT 0</text><text x="270" y="888" class="sans small">normal replay</text>
    <text x="425" y="840" class="sans label">Typed Request</text><text x="425" y="865" class="sans small">ReuseBind valid</text><text x="425" y="888" class="sans small">context + seq</text>
  </g>
  <path d="M180 856 H206" class="arrow"/>
  <path d="M330 856 H356" class="arrow"/>

  <!-- Stage 5 -->
  <circle cx="593" cy="584" r="18" fill="#27313A"/>
  <text x="593" y="591" text-anchor="middle" fill="#FFFFFF" class="sans number">5</text>
  <text x="623" y="591" class="sans heading">Carry the exact cache Request</text>

  <g text-anchor="middle">
    <rect x="590" y="620" width="85" height="72" rx="8" class="slot"/>
    <rect x="700" y="620" width="85" height="72" rx="8" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
    <rect x="810" y="620" width="85" height="72" rx="8" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
    <rect x="920" y="620" width="90" height="72" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
    <text x="632" y="650" class="sans label">D-TLB</text><text x="632" y="674" class="sans small">VA → PA</text>
    <text x="742" y="650" class="sans label">L1D</text><text x="742" y="674" class="sans small">lookup</text>
    <text x="852" y="650" class="sans label">L2</text><text x="852" y="674" class="sans small">lookup</text>
    <text x="965" y="650" class="sans label">MSHR</text><text x="965" y="674" class="sans small">merge</text>
  </g>
  <path d="M675 656 H696" class="arrow"/>
  <path d="M785 656 H806" class="arrow"/>
  <path d="M895 656 H916" class="arrow"/>

  <rect x="590" y="725" width="420" height="88" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="800" y="752" text-anchor="middle" class="sans label">ReuseBind extension on the same Request</text>
  <text x="800" y="778" text-anchor="middle" class="mono small">dest 42 | T2 | e1 12 | e2 40</text>
  <text x="800" y="800" text-anchor="middle" class="mono small">current 10 | ctx k | seq s</text>

  <rect x="590" y="835" width="420" height="70" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="610" y="862" class="sans body">Merge requires matching requestor and context.</text>
  <text x="610" y="888" class="sans body">Newest sequence wins; conflict invalidates.</text>

  <!-- Stage 6 -->
  <circle cx="1118" cy="584" r="18" fill="#27313A"/>
  <text x="1118" y="591" text-anchor="middle" fill="#FFFFFF" class="sans number">6</text>
  <text x="1148" y="591" class="sans heading">Store metadata + select victim</text>

  <rect x="1110" y="620" width="250" height="215" rx="8" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="1235" y="648" text-anchor="middle" class="sans label">LLC resident ways</text>
  <rect x="1128" y="665" width="214" height="42" fill="#E7F7EA" stroke="#27313A"/>
  <rect x="1128" y="707" width="214" height="70" fill="#FFF0D8" stroke="#1769C2" stroke-width="3"/>
  <rect x="1128" y="777" width="214" height="42" fill="#F7DEDC" stroke="#27313A"/>
  <text x="1140" y="691" class="sans small">way 0 · line …0040 · T1</text>
  <text x="1140" y="731" class="sans small">way 1 · line …0080 · RRPV 7</text>
  <text x="1140" y="754" class="sans small">T2 · e1 12 · e2 40</text>
  <text x="1140" y="803" class="sans small">way 2 · record line · T3</text>

  <rect x="1380" y="620" width="155" height="215" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="1457" y="648" text-anchor="middle" class="sans label">Decision</text>
  <text x="1400" y="682" class="mono small">d1 = 2</text>
  <text x="1400" y="707" class="mono small">d2 = 30</text>
  <text x="1400" y="732" class="mono small">nearest = 2</text>
  <text x="1400" y="770" class="sans small">RRIP eligible</text>
  <text x="1400" y="794" class="sans small">evict largest</text>
  <text x="1400" y="817" class="sans small">nearest reuse</text>

  <rect x="1110" y="860" width="120" height="45" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="1170" y="888" text-anchor="middle" class="sans label">Memory</text>
  <rect x="1260" y="852" width="275" height="62" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="1397" y="878" text-anchor="middle" class="sans body">property data → writeback → ROB</text>
  <text x="1397" y="901" text-anchor="middle" class="sans small">tier and epochs remain with LLC line</text>
  <path d="M1230 882 H1256" class="arrow"/>

  <!-- Inter-stage connectors -->
  <path d="M515 315 H556" class="arrow"/>
  <path d="M1040 315 H1081" class="arrow"/>
  <path d="M1325 490 V520 H275 V546" class="arrow"/>
  <path d="M515 740 H556" class="arrow"/>
  <path d="M1040 740 H1081" class="arrow"/>

  <!-- Mechanism boundary footer -->
  <rect x="35" y="965" width="1530" height="78" rx="10" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <line x1="800" y1="978" x2="800" y2="1030" stroke="#9AA3AD" stroke-width="2"/>
  <circle cx="65" cy="1004" r="15" fill="#A8403A"/>
  <path d="M57 1004 H73" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="92" y="994" class="sans label">FlowThrough record miss</text>
  <text x="92" y="1020" class="sans body">memory fetch + private fill; skip only the new LLC insertion</text>
  <circle cx="830" cy="1004" r="15" fill="#1769C2"/>
  <path d="M822 1004 L828 1010 L838 996" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="857" y="994" class="sans label">Normal property completion</text>
  <text x="857" y="1020" class="sans body">hit or fill stores metadata; data writes back and retires precisely</text>
</svg>
