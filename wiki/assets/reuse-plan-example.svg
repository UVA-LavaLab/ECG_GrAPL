<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Worked ReusePlan future-reuse example</title>
  <desc id="desc">At current epoch ten, three lines have two future epochs each. Their nearest distances are two, ten, and one, so line B is the farthest future use.</desc>
  <defs>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
      }
      .title{font:700 28px Arial,sans-serif;fill:#27313A}
      .subtitle{font:400 15px Arial,sans-serif;fill:#27313A}
      .epoch{font:700 14px Arial,sans-serif;fill:#27313A}
      .line-name{font:700 20px Arial,sans-serif;fill:#27313A}
      .body{font:400 14px Arial,sans-serif;fill:#27313A}
      .distance{font:700 18px Arial,sans-serif;fill:#27313A}
      .result{font:700 18px Arial,sans-serif;fill:#ffffff}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="60" y="48" class="title">Worked example: nearest future reuse</text>
  <text x="60" y="75" class="subtitle">Illustrative values only. Current epoch c = 10, circular epoch count N = 256.</text>

  <line x1="150" y1="125" x2="1090" y2="125" stroke="#27313A" stroke-width="3"/>
  <g>
    <circle cx="170" cy="125" r="18" fill="#27313A"/>
    <text x="170" y="130" text-anchor="middle" fill="#ffffff" class="epoch">10</text>
    <text x="170" y="101" text-anchor="middle" class="body">now</text>
    <circle cx="250" cy="125" r="7" fill="#EDF5FF" stroke="#27313A"/><text x="250" y="101" text-anchor="middle" class="epoch">11</text>
    <circle cx="330" cy="125" r="7" fill="#E7F7EA" stroke="#27313A"/><text x="330" y="101" text-anchor="middle" class="epoch">12</text>
    <circle cx="410" cy="125" r="7" fill="#EDF5FF" stroke="#27313A"/><text x="410" y="101" text-anchor="middle" class="epoch">13</text>
    <path d="M505 116 L517 134 M523 116 L535 134" stroke="#9AA3AD" stroke-width="3"/>
    <circle cx="650" cy="125" r="7" fill="#FFF0D8" stroke="#27313A"/><text x="650" y="101" text-anchor="middle" class="epoch">20</text>
    <circle cx="820" cy="125" r="7" fill="#FFF0D8" stroke="#27313A"/><text x="820" y="101" text-anchor="middle" class="epoch">30</text>
    <circle cx="980" cy="125" r="7" fill="#E7F7EA" stroke="#27313A"/><text x="980" y="101" text-anchor="middle" class="epoch">40</text>
  </g>

  <g stroke="#27313A" stroke-width="3">
    <rect x="70" y="180" width="320" height="210" rx="12" fill="#E7F7EA"/>
    <rect x="440" y="180" width="320" height="210" rx="12" fill="#FFF0D8"/>
    <rect x="810" y="180" width="320" height="210" rx="12" fill="#EDF5FF"/>
  </g>

  <text x="100" y="222" class="line-name">Line A</text>
  <text x="100" y="258" class="body">epochs = (12, 40)</text>
  <text x="100" y="291" class="body">distance 1 = 12 - 10 = 2</text>
  <text x="100" y="319" class="body">distance 2 = 40 - 10 = 30</text>
  <text x="100" y="360" class="distance">nearest distance = 2</text>

  <text x="470" y="222" class="line-name">Line B</text>
  <text x="470" y="258" class="body">epochs = (20, 30)</text>
  <text x="470" y="291" class="body">distance 1 = 20 - 10 = 10</text>
  <text x="470" y="319" class="body">distance 2 = 30 - 10 = 20</text>
  <text x="470" y="360" class="distance">nearest distance = 10</text>

  <text x="840" y="222" class="line-name">Line C</text>
  <text x="840" y="258" class="body">epochs = (11, 13)</text>
  <text x="840" y="291" class="body">distance 1 = 11 - 10 = 1</text>
  <text x="840" y="319" class="body">distance 2 = 13 - 10 = 3</text>
  <text x="840" y="360" class="distance">nearest distance = 1</text>

  <rect x="360" y="430" width="480" height="58" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="466" text-anchor="middle" class="distance">If RRIP eligibility is tied, evict Line B</text>
</svg>
