<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Grouped K2 out-of-order core and memory pipeline</title>
  <desc id="desc">The processor is divided into frontend, out-of-order backend, and load-store regions. Straight arrows show K2 custom instructions reaching the request builder and cache hierarchy.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.2" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#344f63"/>
    </marker>
    <marker id="teal" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.2" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a9d8f"/>
    </marker>
    <marker id="coral" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.2" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e76f51"/>
    </marker>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 14px Arial,sans-serif;fill:#607487}
      .region{font:700 23px Arial,sans-serif;fill:#17324d}
      .box-title{font:700 15px Arial,sans-serif;fill:#17324d}
      .body{font:400 11px Arial,sans-serif;fill:#405568}
      .mono{font:700 11px 'Courier New',monospace;fill:#17324d}
      .label{font:700 11px Arial,sans-serif;fill:#17324d}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="38" y="40" class="title">Grouped core view: where K2 enters the memory system</text>
  <text x="38" y="64" class="subtitle">Frontend, out-of-order scheduling, and the load/store path are separated into conventional regions.</text>

  <rect x="30" y="88" width="1140" height="170" rx="18" fill="#fff7df" stroke="#d8bd66"/>
  <text x="52" y="121" class="region">Frontend</text>
  <rect x="80" y="142" width="180" height="84" fill="#ffffff" stroke="#8f6c0f"/>
  <text x="170" y="170" text-anchor="middle" class="box-title">Fetch + I-cache</text>
  <text x="105" y="196" class="body">PC, predictor, fetch buffer</text>
  <rect x="330" y="142" width="200" height="84" fill="#ffffff" stroke="#8f6c0f"/>
  <text x="430" y="170" text-anchor="middle" class="box-title">Decode</text>
  <text x="355" y="195" class="mono">ecg.stream.load2</text>
  <text x="355" y="214" class="mono">ecg.k2.mload.*</text>
  <rect x="600" y="142" width="220" height="84" fill="#e8f6f3" stroke="#2a9d8f"/>
  <text x="710" y="170" text-anchor="middle" class="box-title">K2 operand decode</text>
  <text x="625" y="195" class="body">rs1: address</text>
  <text x="625" y="214" class="body">rs2: dest / tier / e1 / e2</text>
  <line x1="260" y1="184" x2="326" y2="184" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="530" y1="184" x2="596" y2="184" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#teal)"/>

  <rect x="30" y="278" width="1140" height="210" rx="18" fill="#eaf8ed" stroke="#83b88e"/>
  <text x="52" y="312" class="region">Out-of-order backend</text>
  <rect x="80" y="338" width="220" height="108" fill="#ffffff" stroke="#63846a"/>
  <text x="190" y="367" text-anchor="middle" class="box-title">Rename / Allocate / ROB</text>
  <text x="105" y="394" class="body">physical destination</text>
  <text x="105" y="416" class="body">ROB, issue, and load-queue entries</text>
  <rect x="360" y="338" width="220" height="108" fill="#ffffff" stroke="#63846a"/>
  <text x="470" y="367" text-anchor="middle" class="box-title">Issue + register read</text>
  <text x="385" y="394" class="body">wait for rs1 and rs2</text>
  <text x="385" y="416" class="body">read PRF or bypass values</text>
  <rect x="640" y="338" width="170" height="108" fill="#ffffff" stroke="#63846a"/>
  <text x="725" y="367" text-anchor="middle" class="box-title">AGU</text>
  <text x="665" y="394" class="body">compute effective address</text>
  <text x="665" y="416" class="body">send address to LSU</text>
  <rect x="870" y="338" width="230" height="108" fill="#e8f6f3" stroke="#2a9d8f"/>
  <text x="985" y="367" text-anchor="middle" class="box-title">Request extension builder</text>
  <text x="895" y="392" class="body">K2-M: tier / epochs / context</text>
  <text x="895" y="414" class="body">Stream load: no-allocate-on-fill</text>
  <line x1="300" y1="392" x2="356" y2="392" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="580" y1="392" x2="636" y2="392" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="810" y1="392" x2="866" y2="392" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="430,226 430,268 315,268 315,392 304,392" fill="none" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="710,226 710,318 985,318 985,334" fill="none" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#teal)"/>

  <rect x="30" y="508" width="1140" height="215" rx="18" fill="#f2ecff" stroke="#9a87c6"/>
  <text x="52" y="542" class="region">Load / store and cache hierarchy</text>
  <rect x="80" y="570" width="175" height="110" fill="#ffffff" stroke="#76659d"/>
  <text x="167" y="599" text-anchor="middle" class="box-title">Load queue</text>
  <text x="105" y="626" class="body">ordering and replay checks</text>
  <text x="105" y="648" class="body">request state</text>
  <rect x="300" y="570" width="130" height="110" fill="#ffffff" stroke="#76659d"/>
  <text x="365" y="599" text-anchor="middle" class="box-title">D-TLB</text>
  <text x="325" y="630" class="body">VA to PA</text>
  <rect x="475" y="570" width="180" height="110" fill="#ffffff" stroke="#76659d"/>
  <text x="565" y="599" text-anchor="middle" class="box-title">L1D / L2</text>
  <text x="500" y="626" class="body">normal hit and fill path</text>
  <text x="500" y="648" class="body">forward request extension</text>
  <rect x="700" y="570" width="150" height="110" fill="#ffffff" stroke="#76659d"/>
  <text x="775" y="599" text-anchor="middle" class="box-title">MSHR / fill path</text>
  <text x="725" y="626" class="body">merge request state</text>
  <text x="725" y="648" class="body">return response</text>
  <rect x="895" y="570" width="125" height="110" fill="#fff7e8" stroke="#c38f27"/>
  <text x="957" y="599" text-anchor="middle" class="box-title">LLC</text>
  <circle cx="915" cy="626" r="4" fill="#2a9d8f"/>
  <text x="926" y="630" class="body">stamp K2</text>
  <circle cx="915" cy="649" r="4" fill="#e76f51"/>
  <text x="926" y="653" class="body">skip record insert</text>
  <rect x="1060" y="570" width="80" height="110" fill="#ffffff" stroke="#76659d"/>
  <text x="1100" y="599" text-anchor="middle" class="box-title">Mem</text>
  <text x="1075" y="630" class="body">miss</text>
  <text x="1075" y="648" class="body">service</text>

  <line x1="255" y1="625" x2="296" y2="625" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="430" y1="625" x2="471" y2="625" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="655" y1="625" x2="696" y2="625" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="850" y1="625" x2="891" y2="625" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1020" y1="625" x2="1056" y2="625" stroke="#344f63" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="985,446 985,485 167,485 167,566" fill="none" stroke="#2a9d8f" stroke-width="1.8" marker-end="url(#teal)"/>
  <line x1="1060" y1="665" x2="1024" y2="665" stroke="#344f63" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="895" y1="665" x2="854" y2="665" stroke="#344f63" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="665" x2="659" y2="665" stroke="#344f63" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="742" y="697" class="body">response returns through LLC, fill state, and private cache</text>
</svg>
