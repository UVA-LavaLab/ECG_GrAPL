  <text x="428.976074376343" y="416.6755562530992" text-anchor="middle" class="sans body" fill="#9AA3AD">1</text>
  <line x1="350" y1="440" x2="620" y2="450" stroke="#B42318" stroke-width="3"/>
  <text x="485.3701166050988" y="435.00685166233234" text-anchor="middle" class="sans body" fill="#9AA3AD">5</text>
  <line x1="500" y1="375" x2="625" y2="270" stroke="#9AA3AD" stroke-width="2"/>
  <text x="568.9319208642328" y="330.1570486478961" text-anchor="middle" class="sans body" fill="#9AA3AD">2</text>
  <line x1="500" y1="375" x2="620" y2="450" stroke="#9AA3AD" stroke-width="2"/>
  <text x="565.2999894000318" y="404.02001695994915" text-anchor="middle" class="sans body" fill="#9AA3AD">3</text>
  <line x1="625" y1="270" x2="620" y2="450" stroke="#9AA3AD" stroke-width="2"/>
  <text x="612.5038557934728" y="359.72232932759647" text-anchor="middle" class="sans body" fill="#9AA3AD">2</text>
  <line x1="625" y1="270" x2="740" y2="335" stroke="#9AA3AD" stroke-width="2"/>
  <text x="687.420572566679" y="293.79437161279867" text-anchor="middle" class="sans body" fill="#9AA3AD">4</text>
  <line x1="620" y1="450" x2="740" y2="335" stroke="#9AA3AD" stroke-width="2"/>
  <text x="686.9190536323562" y="399.71988205115423" text-anchor="middle" class="sans body" fill="#9AA3AD">1</text>
  <path d="M374.98287084416916 440.925291512747 L592.0191846545305 448.96367350572336" fill="none" stroke="#B42318" stroke-width="3" marker-end="url(#arrow-red)" data-flow-kind="model-edge"/>
  <text x="52" y="552" text-anchor="start" class="sans body" fill="#15803D">green: tier 1</text>
  <text x="215" y="552" text-anchor="start" class="sans body" fill="#B45309">amber: tier 2</text>
  <text x="375" y="552" text-anchor="start" class="sans body" fill="#6D5BD0">purple: tier 3</text>
  <text x="555" y="552" text-anchor="start" class="sans body" fill="#B42318">red: tracked access 4 -&gt; 7</text>
  <circle cx="95" cy="280" r="24" fill="#FFF0D8" stroke="#B45309" stroke-width="1"/>
  <text x="95" y="286" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">0</text>
  <circle cx="95" cy="425" r="24" fill="#FFF0D8" stroke="#B45309" stroke-width="1"/>
  <text x="95" y="431" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">1</text>
  <circle cx="220" cy="335" r="24" fill="#E7F7EA" stroke="#15803D" stroke-width="1"/>
  <text x="220" y="341" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">2</text>
  <circle cx="365" cy="260" r="24" fill="#FFF0D8" stroke="#B45309" stroke-width="1"/>
  <text x="365" y="266" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">3</text>
  <circle cx="350" cy="440" r="24" fill="#E7F7EA" stroke="#B42318" stroke-width="1"/>
  <text x="350" y="446" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">4</text>
  <circle cx="500" cy="375" r="24" fill="#E7F7EA" stroke="#15803D" stroke-width="1"/>
  <text x="500" y="381" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">5</text>
  <circle cx="625" cy="270" r="24" fill="#EEE9FF" stroke="#6D5BD0" stroke-width="1"/>
  <text x="625" y="276" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">6</text>
  <circle cx="620" cy="450" r="24" fill="#E7F7EA" stroke="#B42318" stroke-width="1"/>
  <text x="620" y="456" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">7</text>
  <circle cx="740" cy="335" r="24" fill="#FFF0D8" stroke="#B45309" stroke-width="1"/>
  <text x="740" y="341" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">8</text>
  <circle cx="55" cy="500" r="18" fill="#B42318" stroke="#B42318" stroke-width="1"/>
  <text x="55" y="506" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">A</text>
  <text x="86" y="506" text-anchor="start" class="sans label" fill="#B42318" font-weight="700">tracked source edge 4 -&gt; 7</text>
  <rect x="830" y="180" width="346" height="390" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="846" y="209" text-anchor="start" class="sans label" fill="#1769C2" font-weight="700">CSR crosswalk</text>
  <text x="846" y="239" text-anchor="start" class="mono body" fill="#27313A">src 0 -&gt; int 1</text>
  <text x="846" y="263" text-anchor="start" class="mono body" fill="#27313A">row = [3, 6, 20]</text>
  <text x="846" y="287" text-anchor="start" class="mono body" fill="#27313A">src 2 -&gt; int 6</text>
  <text x="846" y="311" text-anchor="start" class="mono body" fill="#27313A">row = [1, 3, 7, 8, 20]</text>
  <text x="846" y="335" text-anchor="start" class="mono body" fill="#27313A">src 4 -&gt; int 8</text>
  <text x="846" y="359" text-anchor="start" class="mono body" fill="#27313A">row = [3, 6, 7, 11, 18]</text>
  <text x="846" y="383" text-anchor="start" class="mono body" fill="#27313A">src 7 -&gt; int 18</text>
  <text x="846" y="407" text-anchor="start" class="mono body" fill="#27313A">row = [8, 11, 15, 20]</text>
  <text x="846" y="431" text-anchor="start" class="mono body" fill="#27313A">tracked 4-&gt;7 = int 8-&gt;18</text>
  <text x="846" y="455" text-anchor="start" class="mono body" fill="#27313A">PageRank uses incoming CSR.</text>
  <text x="846" y="479" text-anchor="start" class="mono body" fill="#27313A">frontier paths use outgoing CSR</text>
  <circle cx="44" cy="615" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="621" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="622" text-anchor="start" class="sans heading" fill="#6D5BD0" font-weight="700">READER COUNTS TO REUSE TIER</text>
  <text x="1158" y="621" text-anchor="end" class="sans body" fill="#9AA3AD">stable rank: count descending, vertex ID ascending</text>
  <line x1="24" y1="641" x2="1176" y2="641" stroke="#6D5BD0" stroke-width="3"/>
  <rect x="24" y="657" width="550" height="245" rx="9" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="40" y="686" text-anchor="start" class="sans label" fill="#6D5BD0" font-weight="700">Default hot fraction = 0.15</text>
  <text x="40" y="716" text-anchor="start" class="mono body" fill="#27313A">src2/int6: 5 readers -&gt; tier 1</text>
  <text x="40" y="740" text-anchor="start" class="mono body" fill="#27313A">src4/int8: 5 readers -&gt; tier 1</text>
  <text x="40" y="764" text-anchor="start" class="mono body" fill="#27313A">src5/int11: 4 readers -&gt; tier 1</text>
  <text x="40" y="788" text-anchor="start" class="mono body" fill="#27313A">src7/int18: 4 readers -&gt; tier 1</text>
  <text x="40" y="812" text-anchor="start" class="mono body" fill="#27313A">src8/int20: 4 readers -&gt; tier 2</text>
  <text x="40" y="836" text-anchor="start" class="mono body" fill="#27313A">src0/int1: 3 readers -&gt; tier 2</text>
  <rect x="600" y="657" width="576" height="245" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="616" y="686" text-anchor="start" class="sans label" fill="#27313A" font-weight="700">Cache-line aggregation</text>
  <text x="616" y="716" text-anchor="start" class="sans body" fill="#27313A">4-byte properties -&gt; 16 vertices per 64-byte line</text>
  <text x="616" y="740" text-anchor="start" class="sans body" fill="#27313A">property 18 is in line vertices 16..31</text>
  <text x="616" y="764" text-anchor="start" class="sans body" fill="#27313A">line tier is the hottest tier among those vertices</text>
  <text x="616" y="788" text-anchor="start" class="sans body" fill="#27313A">tracked line tier = 1 (hot)</text>
  <text x="616" y="812" text-anchor="start" class="sans body" fill="#27313A">tier 0 is reserved for invalid metadata</text>
  <circle cx="44" cy="947" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="953" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="954" text-anchor="start" class="sans heading" fill="#15803D" font-weight="700">TWO FUTURE LINE READERS</text>
  <text x="1158" y="953" text-anchor="end" class="sans body" fill="#9AA3AD">reader CSR is searched strictly after the current reader</text>
  <line x1="24" y1="973" x2="1176" y2="973" stroke="#15803D" stroke-width="3"/>
  <rect x="24" y="989" width="550" height="245" rx="9" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="40" y="1018" text-anchor="start" class="sans label" fill="#15803D" font-weight="700">Tracked line reader order</text>
  <text x="40" y="1048" text-anchor="start" class="mono body" fill="#27313A">line 16..31 readers = [1, 6, 8, 11, 15, 18, 20]</text>
  <text x="40" y="1072" text-anchor="start" class="mono body" fill="#27313A">current reader = 8</text>
  <text x="40" y="1096" text-anchor="start" class="mono body" fill="#27313A">first future reader = 11 -&gt; epoch 11</text>
  <text x="40" y="1120" text-anchor="start" class="mono body" fill="#27313A">second future reader = 15 -&gt; epoch 15</text>
  <text x="40" y="1144" text-anchor="start" class="mono body" fill="#27313A">search wraps into the next traversal if needed</text>
  <rect x="600" y="989" width="576" height="245" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="616" y="1018" text-anchor="start" class="sans label" fill="#27313A" font-weight="700">Quantization and same-reader correction</text>
  <text x="616" y="1048" text-anchor="start" class="sans body" fill="#27313A">epoch = floor(reader * epoch_count / vertex_count)</text>
  <text x="616" y="1072" text-anchor="start" class="sans body" fill="#27313A">here epoch_count = vertex_count = 32</text>
  <text x="616" y="1096" text-anchor="start" class="sans body" fill="#27313A">same-source accesses to the same line are preserved</text>
  <text x="616" y="1120" text-anchor="start" class="sans body" fill="#27313A">the pair describes the line, not only one vertex</text>
  <text x="616" y="1144" text-anchor="start" class="sans body" fill="#27313A">malformed epochs are clamped before distance use</text>
  <circle cx="44" cy="1279" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="1285" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">4</text>
  <text x="74" y="1286" text-anchor="start" class="sans heading" fill="#B45309" font-weight="700">PACK, SEAL, THEN STREAM</text>
  <text x="1158" y="1285" text-anchor="end" class="sans body" fill="#9AA3AD">preprocessing produces an immutable runtime input</text>
  <line x1="24" y1="1305" x2="1176" y2="1305" stroke="#B45309" stroke-width="3"/>
  <rect x="24" y="1321" width="550" height="245" rx="9" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="40" y="1350" text-anchor="start" class="sans label" fill="#B45309" font-weight="700">Checked logical record</text>
  <text x="40" y="1380" text-anchor="start" class="mono body" fill="#27313A">destination = 18</text>
  <text x="40" y="1404" text-anchor="start" class="mono body" fill="#27313A">tier = 1</text>
  <text x="40" y="1428" text-anchor="start" class="mono body" fill="#27313A">epoch1 = 11</text>
  <text x="40" y="1452" text-anchor="start" class="mono body" fill="#27313A">epoch2 = 15</text>
  <text x="40" y="1476" text-anchor="start" class="mono body" fill="#27313A">compact bits = 5 + 2 + 2*5 = 17</text>
  <rect x="600" y="1321" width="576" height="245" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="616" y="1350" text-anchor="start" class="sans label" fill="#B42318" font-weight="700">Offline / runtime boundary</text>
  <text x="616" y="1380" text-anchor="start" class="sans body" fill="#27313A">builder output is outside the measured ROI</text>
  <text x="616" y="1404" text-anchor="start" class="sans body" fill="#27313A">sidecar header binds graph, configuration, and payload</text>
  <text x="616" y="1428" text-anchor="start" class="sans body" fill="#27313A">guest verifies offsets, hashes, width, and record count</text>
  <text x="616" y="1452" text-anchor="start" class="sans body" fill="#27313A">runtime streams the validated record in edge order</text>
  <text x="616" y="1476" text-anchor="start" class="sans body" fill="#27313A">no detailed simulator recomputes the graph pass</text>
  <path d="M190 1665 L1010 1665" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-amber)" data-flow-kind="transfer" data-flow-label="validated edge-aligned record stream" data-flow-cadence="one record per governed edge access"/>
  <text x="600" y="1650" text-anchor="middle" class="sans body" fill="#B45309" font-weight="700">validated edge-aligned record stream | one record per governed edge access</text>
</svg>
