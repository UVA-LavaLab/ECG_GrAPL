  <text x="42" y="47" text-anchor="start" class="sans title" fill="#27313A" font-weight="700">From a checked reader graph to one edge-aligned ReusePlan</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#27313A">The concrete values come from fig/ecg-figure-fixture.json and its executable test.</text>
