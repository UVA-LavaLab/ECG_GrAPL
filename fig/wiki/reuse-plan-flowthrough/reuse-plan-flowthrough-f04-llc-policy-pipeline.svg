<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380" role="img" aria-labelledby="title desc" fill="#27313A" data-figure-schema="ecg-public/v1">
  <title id="title">LLC metadata lifecycle and rrip_first victim pipeline</title>
  <desc id="desc">Four bands show how a validated ReuseBind updates line-local metadata on an LLC hit or fill, how invalidation clears it, and how the shared victim policy ages RRPV, prefers an old structural line, and otherwise selects the farthest stamped property among eligible ways.</desc>
