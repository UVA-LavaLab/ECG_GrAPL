  <rect x="495.625" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="495.625" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="512.5" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="512.5" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="529.375" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="529.375" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="546.25" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="546.25" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="563.125" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="563.125" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="580.0" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="580.0" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="596.875" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="596.875" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="613.75" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="613.75" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="630.625" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="630.625" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="647.5" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="647.5" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="664.375" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="664.375" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="681.25" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="681.25" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="698.125" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="698.125" data-y="387" data-width="16.875" data-height="42"/>
  <text x="445" y="447" text-anchor="start" class="sans body" fill="#182230">head</text>
  <text x="715" y="447" text-anchor="end" class="sans body" fill="#182230">tail</text>
  <path d="M176 315 L176 408 L445 408" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="commit refresh"/>
  <rect x="224.16" y="370.00" width="137.68" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="293" y="387" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">commit refresh</text>
  <path d="M715 408 L1010 408 L1010 315" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="resident + unexpired"/>
  <rect x="772.80" y="371.00" width="192.40" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="869" y="388" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">resident + unexpired</text>
  <text x="40" y="479" text-anchor="start" class="sans body" fill="#182230">Model: 8 governed requests of delay, at most 1 update per request, coalesce by property line.</text>
  <text x="40" y="509" text-anchor="start" class="sans body" fill="#C63C4A">Discard expired updates; an expired line prediction resolves to UNKNOWN, never DEAD.</text>
  <circle cx="44" cy="567" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="573" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="574" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">LINE STATE IS CACHE-SIZED</text>
  <text x="1158" y="573" text-anchor="end" class="sans body" fill="#475467">baseline tags, data, recency and RRPV remain separate</text>
  <line x1="24" y1="593" x2="1176" y2="593" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="593" x2="170" y2="593" stroke="#6558C5" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="625" width="940.0" height="90" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="40" data-y="625" data-width="940.0" data-height="90"/>
  <text x="510.0" y="668.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">deadline</text>
  <text x="510.0" y="692.0" text-anchor="middle" class="sans body" fill="#182230">32 bits</text>
  <rect x="980.0" y="625" width="90.0" height="90" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="980.0" data-y="625" data-width="90.0" data-height="90"/>
  <text x="1025.0" y="668.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">state</text>
  <text x="1025.0" y="692.0" text-anchor="middle" class="sans body" fill="#182230">2 bits</text>
  <rect x="1070.0" y="625" width="90.0" height="90" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="2" data-shape="rect" data-x="1070.0" data-y="625" data-width="90.0" data-height="90"/>
  <text x="1115.0" y="668.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">origin</text>
  <text x="1115.0" y="692.0" text-anchor="middle" class="sans body" fill="#182230">1 bit</text>
  <text x="40" y="757" text-anchor="start" class="sans body" fill="#182230">35 added bits per LLC line = 32-bit deadline + 2-bit future state + 1 prefetch-origin bit.</text>
  <text x="40" y="788" text-anchor="start" class="sans body" fill="#182230">Local GRASP tier is derived at the cache. It is not another field in the six-bit edge token.</text>
  <circle cx="44" cy="845" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="851" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="852" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">RANK THE ACTUAL CANDIDATE SET</text>
  <text x="1158" y="851" text-anchor="end" class="sans body" fill="#475467">invalid ways fill first; known-dead governed misses bypass</text>
  <line x1="24" y1="871" x2="1176" y2="871" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="871" x2="170" y2="871" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="902" width="1120" height="235" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="902" data-width="1120" data-height="235"/>
  <line x1="40" y1="949.0" x2="1160" y2="949.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="996.0" x2="1160" y2="996.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="1043.0" x2="1160" y2="1043.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="1090.0" x2="1160" y2="1090.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="52" y="930" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Rank</text>
  <text x="52" y="977" text-anchor="start" class="sans body" fill="#182230">first</text>
  <text x="52" y="1024" text-anchor="start" class="sans body" fill="#182230">next</text>
  <text x="52" y="1071" text-anchor="start" class="sans body" fill="#182230">then</text>
  <text x="52" y="1118" text-anchor="start" class="sans body" fill="#182230">then</text>
  <line x1="140" y1="902" x2="140" y2="1137" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="152" y="930" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Candidate class</text>
  <text x="152" y="977" text-anchor="start" class="sans body" fill="#182230">known-dead property</text>
  <text x="152" y="1024" text-anchor="start" class="sans body" fill="#182230">non-property line</text>
  <text x="152" y="1071" text-anchor="start" class="sans body" fill="#182230">finite property</text>
  <text x="152" y="1118" text-anchor="start" class="sans body" fill="#182230">unknown property</text>
  <line x1="370" y1="902" x2="370" y2="1137" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="382" y="930" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Score inside the class</text>
  <text x="382" y="977" text-anchor="start" class="sans body" fill="#182230">explicit DEAD state</text>
  <text x="382" y="1024" text-anchor="start" class="sans body" fill="#182230">recency</text>
  <text x="382" y="1071" text-anchor="start" class="sans body" fill="#182230">distanceRRPV(remaining)</text>
  <text x="382" y="1118" text-anchor="start" class="sans body" fill="#182230">max(RRPV, local GRASP)</text>
  <line x1="740" y1="902" x2="740" y2="1137" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="752" y="930" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Selection</text>
  <text x="752" y="977" text-anchor="start" class="sans body" fill="#182230">prefer reclaiming the dead line</text>
  <text x="752" y="1024" text-anchor="start" class="sans body" fill="#182230">oldest non-property line</text>
  <text x="752" y="1071" text-anchor="start" class="sans body" fill="#182230">shares the property category</text>
  <text x="752" y="1118" text-anchor="start" class="sans body" fill="#182230">shares the property category</text>
  <text x="40" y="1187" text-anchor="start" class="sans body" fill="#182230">Within the property category: score -&gt; unknown tie -&gt; remaining distance -&gt; colder tier -&gt; oldest.</text>
  <text x="40" y="1220" text-anchor="start" class="sans body" fill="#6558C5">Unknown does not always precede finite: the score is compared first.</text>
  <text x="40" y="1264" text-anchor="start" class="sans body" fill="#C56A13">This is the Scale6 model. Native gem5 update transport and cycle timing remain unimplemented.</text>
</svg>
