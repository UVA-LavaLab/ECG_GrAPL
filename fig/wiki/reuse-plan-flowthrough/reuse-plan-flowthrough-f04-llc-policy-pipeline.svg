  <rect x="0" y="0" width="1200" height="1320" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Fresh LLC state and Scale6 victim selection</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">Private hits must not leave LLC predictions stale; the functional update channel is bounded.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">PRIVATE HITS STILL PRODUCE UPDATES</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#475467">LLC hit/fill stamps and commit refresh are distinct</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="200" width="275" height="115" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="200" data-width="275" data-height="115"/>
  <text x="54" y="228" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Governed property load</text>
  <text x="54" y="257" text-anchor="start" class="sans body" fill="#182230">read value normally</text>
  <text x="54" y="282" text-anchor="start" class="sans body" fill="#182230">carry the per-edge prediction</text>
  <rect x="445" y="200" width="270" height="115" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="445" data-y="200" data-width="270" data-height="115"/>
  <text x="459" y="228" text-anchor="start" class="sans label" fill="#182230" font-weight="700">L1D / L2 hit</text>
  <text x="459" y="257" text-anchor="start" class="sans body" fill="#182230">no demand reaches the LLC</text>
  <text x="459" y="282" text-anchor="start" class="sans body" fill="#182230">prediction still advances</text>
  <path d="M315 250 L445 250" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)" data-flow-kind="transfer" data-flow-underlay="false" data-flow-label="data service" data-flow-cadence="per access"/>
  <rect x="261.00" y="169.00" width="238.00" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="380" y="186" text-anchor="middle" class="sans body" fill="#2563EB" font-weight="700">data service | per access</text>
  <rect x="860" y="200" width="300" height="115" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="860" data-y="200" data-width="300" data-height="115"/>
  <text x="874" y="228" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Resident LLC line</text>
  <text x="874" y="257" text-anchor="start" class="sans body" fill="#182230">update metadata, not data bytes</text>
  <text x="874" y="282" text-anchor="start" class="sans body" fill="#182230">never allocate for an update</text>
  <text x="445" y="373" text-anchor="start" class="sans label" fill="#6558C5" font-weight="700">16-entry coalescing queue</text>
  <rect x="445.0" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="445.0" data-y="387" data-width="16.875" data-height="42"/>
  <rect x="461.875" y="387" width="16.875" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="461.875" data-y="387" data-width="16.875" data-height="42"/>
