<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" fill="#182230" data-figure-schema="ecg-public/v1">
  <title id="title">ReuseBind acceptance and RRIP-first victim selection</title>
  <desc id="desc">The figure separates three steps: accept or reject the Request metadata, store line-local ECG state, and apply RRIP-first only after native RRIP eligibility is reached.</desc>
