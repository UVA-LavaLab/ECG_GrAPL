  <circle cx="140" cy="1100" r="9" fill="#FFFFFF" stroke="#1769C2" stroke-width="1"/>
  <line x1="430" y1="940" x2="430" y2="1160" stroke="#9AA3AD" stroke-width="1"/>
  <text x="430" y="930" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">range check</text>
  <circle cx="430" cy="980" r="9" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="1"/>
  <circle cx="430" cy="1100" r="9" fill="#FFFFFF" stroke="#1769C2" stroke-width="1"/>
  <line x1="720" y1="940" x2="720" y2="1160" stroke="#9AA3AD" stroke-width="1"/>
  <text x="720" y="930" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">Request flag/ext</text>
  <circle cx="720" cy="980" r="9" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="1"/>
  <circle cx="720" cy="1100" r="9" fill="#FFFFFF" stroke="#1769C2" stroke-width="1"/>
  <line x1="1010" y1="940" x2="1010" y2="1160" stroke="#9AA3AD" stroke-width="1"/>
  <text x="1010" y="930" text-anchor="middle" class="sans body" fill="#27313A" font-weight="700">LLC behavior</text>
  <circle cx="1010" cy="980" r="9" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="1"/>
  <circle cx="1010" cy="1100" r="9" fill="#FFFFFF" stroke="#1769C2" stroke-width="1"/>
  <text x="430" y="1015" text-anchor="middle" class="sans body" fill="#27313A">in active carrier?</text>
  <text x="720" y="1015" text-anchor="middle" class="sans body" fill="#27313A">in-range -&gt; STRUCTURAL_FLOWTHROUGH</text>
  <text x="1010" y="1015" text-anchor="middle" class="sans body" fill="#27313A">out-of-range bit stays clear</text>
  <text x="430" y="1135" text-anchor="middle" class="sans body" fill="#27313A">destination-line guard</text>
  <text x="720" y="1135" text-anchor="middle" class="sans body" fill="#27313A">ReuseBind; FlowThrough=0</text>
  <text x="1010" y="1135" text-anchor="middle" class="sans body" fill="#27313A">allocatable; hit/fill may stamp</text>
  <path d="M145 1215 L1055 1215" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-amber)" data-flow-kind="control" data-flow-label="suppress LLC insertion only when every coalesced target permits it"/>
  <text x="600" y="1200" text-anchor="middle" class="sans body" fill="#B45309" font-weight="700">suppress LLC insertion only when every coalesced target permits it</text>
</svg>
