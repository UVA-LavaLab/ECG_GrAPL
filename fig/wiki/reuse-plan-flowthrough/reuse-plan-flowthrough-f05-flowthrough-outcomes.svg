  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">FlowThrough lookup, service, and LLC fill allocation</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">The important corner case is an MSHR shared with an allocating target.</text>
