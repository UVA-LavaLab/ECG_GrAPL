  <title id="title">FlowThrough lookup, service, and LLC fill allocation</title>
  <desc id="desc">The figure separates the unchanged lookup and service path, the shared MSHR allocOnFill corner case, and the distinction between derived structural arrays and bound property loads.</desc>
