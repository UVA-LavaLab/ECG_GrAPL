  <text x="130" y="520" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">Policy row</text>
  <text x="350" y="520" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">Active structural carrier</text>
  <text x="610" y="520" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">Fairness flag</text>
  <text x="850" y="520" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">Required receipt</text>
  <text x="1060" y="520" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">Fail-closed rule</text>
  <text x="56" y="572" text-anchor="start" class="sans body" fill="#182230">LRU</text>
  <text x="236" y="572" text-anchor="start" class="sans body" fill="#2563EB">CSR edge array</text>
  <text x="496" y="572" text-anchor="start" class="mono body" fill="#C56A13">STRUCTURAL_FLOWTHROUGH</text>
  <text x="756" y="572" text-anchor="start" class="sans body" fill="#6558C5">positive structural access</text>
  <text x="976" y="572" text-anchor="start" class="sans body" fill="#C63C4A">reject zero activity</text>
  <text x="56" y="627" text-anchor="start" class="sans body" fill="#182230">GRASP</text>
  <text x="236" y="627" text-anchor="start" class="sans body" fill="#2563EB">CSR edge array</text>
  <text x="496" y="627" text-anchor="start" class="mono body" fill="#C56A13">STRUCTURAL_FLOWTHROUGH</text>
  <text x="756" y="627" text-anchor="start" class="sans body" fill="#6558C5">positive no-allocate</text>
  <text x="976" y="627" text-anchor="start" class="sans body" fill="#C63C4A">same workload cell</text>
  <text x="56" y="682" text-anchor="start" class="sans body" fill="#182230">P-OPT</text>
  <text x="236" y="682" text-anchor="start" class="sans body" fill="#2563EB">CSR + matrix traffic</text>
  <text x="496" y="682" text-anchor="start" class="mono body" fill="#C56A13">STRUCTURAL_FLOWTHROUGH</text>
  <text x="756" y="682" text-anchor="start" class="sans body" fill="#6558C5">positive structural event</text>
  <text x="976" y="682" text-anchor="start" class="sans body" fill="#C63C4A">matrix bytes retained</text>
  <text x="56" y="737" text-anchor="start" class="sans body" fill="#182230">ReusePlan</text>
  <text x="236" y="737" text-anchor="start" class="sans body" fill="#2563EB">record array; CSR on fallback</text>
  <text x="496" y="737" text-anchor="start" class="mono body" fill="#C56A13">STRUCTURAL_FLOWTHROUGH</text>
  <text x="756" y="737" text-anchor="start" class="sans body" fill="#6558C5">backend-specific counter</text>
  <text x="976" y="737" text-anchor="start" class="sans body" fill="#C63C4A">carrier receipt must match</text>
  <text x="40" y="805" text-anchor="start" class="sans body" fill="#6558C5">cache_sim: access count | gem5: no-allocate targets | Sniper: read/fill counts; translated mode rejected</text>
