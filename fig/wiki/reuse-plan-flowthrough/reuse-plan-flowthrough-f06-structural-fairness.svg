  <rect x="0" y="0" width="1200" height="1000" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Design FlowThrough and symmetric structural fairness</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">The two switches answer different experimental questions.</text>
