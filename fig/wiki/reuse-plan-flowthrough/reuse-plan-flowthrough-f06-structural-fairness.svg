  <text x="130" y="232" text-anchor="middle" class="sans label" fill="#6558C5" font-weight="700">ReusePlan array</text>
  <text x="130" y="263" text-anchor="middle" class="sans body" fill="#182230">compact / wide</text>
  <text x="130" y="289" text-anchor="middle" class="sans body" fill="#182230">weighted sidecar</text>
  <rect x="300" y="200" width="180" height="105" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="300" data-y="200" data-width="180" data-height="105"/>
  <text x="390" y="237" text-anchor="middle" class="mono label" fill="#C56A13" font-weight="700">ecg.flow.load*</text>
  <text x="390" y="275" text-anchor="middle" class="sans body" fill="#182230">record Request</text>
  <rect x="560" y="200" width="190" height="105" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="560" data-y="200" data-width="190" data-height="105"/>
  <text x="655" y="237" text-anchor="middle" class="mono body" fill="#C56A13" font-weight="700">ECG_FLOWTHROUGH</text>
  <text x="655" y="275" text-anchor="middle" class="sans body" fill="#182230">request-specific bit</text>
  <rect x="830" y="200" width="300" height="105" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="830" data-y="200" data-width="300" data-height="105"/>
  <text x="980" y="232" text-anchor="middle" class="sans body" fill="#2563EB" font-weight="700">normal TLB / private / LLC lookup</text>
