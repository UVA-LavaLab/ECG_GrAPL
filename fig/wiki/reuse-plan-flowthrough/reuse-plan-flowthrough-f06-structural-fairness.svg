  <rect x="712.04" y="168.00" width="155.92" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="790.0" y="185" text-anchor="middle" class="sans body" fill="#C56A13" font-weight="700">normal hierarchy</text>
  <line x1="40" y1="350" x2="1130" y2="350" stroke="#C63C4A" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="50" y="385" text-anchor="start" class="sans body" fill="#C63C4A" font-weight="700">not bypass | not zero bytes | not zero latency | not a victim-policy result</text>
  <circle cx="44" cy="440" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="446" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="447" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">SYMMETRIC FAIRNESS CONTROL</text>
  <text x="1158" y="446" text-anchor="end" class="sans body" fill="#98A2B3">--flowthrough all is policy-independent</text>
