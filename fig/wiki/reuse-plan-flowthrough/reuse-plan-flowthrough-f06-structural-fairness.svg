</style></defs>
  <rect x="0" y="0" width="1200" height="1000" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#27313A" font-weight="700">Design FlowThrough and symmetric structural fairness</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#27313A">The two switches answer different experimental questions.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <circle cx="44" cy="138" r="19" fill="#6D5BD0" stroke="#6D5BD0" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#6D5BD0" font-weight="700">DESIGN MECHANISM</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#9AA3AD">ECG_FLOWTHROUGH is attached by ecg.flow.load*</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#6D5BD0" stroke-width="3"/>
  <rect x="24" y="180" width="550" height="245" rx="9" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="40" y="209" text-anchor="start" class="sans label" fill="#6D5BD0" font-weight="700">ReusePlan record request</text>
  <text x="40" y="239" text-anchor="start" class="sans body" fill="#27313A">record can be compact, wide, or weighted sidecar</text>
  <text x="40" y="263" text-anchor="start" class="sans body" fill="#27313A">request-specific flag is attached by the ISA path</text>
  <text x="40" y="287" text-anchor="start" class="sans body" fill="#27313A">optional adaptive placement applies only to this stream</text>
  <text x="40" y="311" text-anchor="start" class="sans body" fill="#27313A">purpose: avoid retaining one-touch metadata records</text>
  <rect x="600" y="180" width="576" height="245" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="616" y="209" text-anchor="start" class="sans label" fill="#B42318" font-weight="700">What it does not grant</text>
  <text x="616" y="239" text-anchor="start" class="sans body" fill="#27313A">it does not bypass the governed property request</text>
  <text x="616" y="263" text-anchor="start" class="sans body" fill="#27313A">it does not remove record bytes or memory latency</text>
  <text x="616" y="287" text-anchor="start" class="sans body" fill="#27313A">it does not make P-OPT matrix traffic disappear</text>
  <text x="616" y="311" text-anchor="start" class="sans body" fill="#27313A">it is not evidence that the victim rule is better</text>
  <circle cx="44" cy="470" r="19" fill="#B45309" stroke="#B45309" stroke-width="1"/>
  <text x="44" y="476" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="477" text-anchor="start" class="sans heading" fill="#B45309" font-weight="700">SYMMETRIC FAIRNESS CONTROL</text>
  <text x="1158" y="476" text-anchor="end" class="sans body" fill="#9AA3AD">--flowthrough all is policy-independent</text>
  <line x1="24" y1="496" x2="1176" y2="496" stroke="#B45309" stroke-width="3"/>
  <rect x="24" y="512" width="360" height="245" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="40" y="541" text-anchor="start" class="sans label" fill="#1769C2" font-weight="700">Baseline policies</text>
  <text x="40" y="571" text-anchor="start" class="sans body" fill="#27313A">LRU / GRASP / P-OPT consume CSR</text>
  <text x="40" y="595" text-anchor="start" class="sans body" fill="#27313A">active carrier range = real edge array</text>
  <text x="40" y="619" text-anchor="start" class="sans body" fill="#27313A">STRUCTURAL_FLOWTHROUGH no-allocate</text>
  <text x="40" y="643" text-anchor="start" class="sans body" fill="#27313A">positive activity receipt is required</text>
  <rect x="420" y="512" width="360" height="245" rx="9" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="436" y="541" text-anchor="start" class="sans label" fill="#6D5BD0" font-weight="700">Packed-substitute ReusePlan</text>
  <text x="436" y="571" text-anchor="start" class="sans body" fill="#27313A">runtime uses record, not edge ID</text>
  <text x="436" y="595" text-anchor="start" class="sans body" fill="#27313A">active carrier range = record array</text>
  <text x="436" y="619" text-anchor="start" class="sans body" fill="#27313A">fallback paths publish CSR instead</text>
  <text x="436" y="643" text-anchor="start" class="sans body" fill="#27313A">carrier selection is fail-closed</text>
  <rect x="816" y="512" width="360" height="245" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="832" y="541" text-anchor="start" class="sans label" fill="#B42318" font-weight="700">Backend evidence</text>
  <text x="832" y="571" text-anchor="start" class="sans body" fill="#27313A">cache_sim: structural access count</text>
  <text x="832" y="595" text-anchor="start" class="sans body" fill="#27313A">gem5: no-allocate miss targets</text>
  <text x="832" y="619" text-anchor="start" class="sans body" fill="#27313A">Sniper: structural read/fill counts</text>
  <text x="832" y="643" text-anchor="start" class="sans body" fill="#27313A">translated Sniper mode is rejected</text>
  <path d="M110 845 L1090 845" fill="none" stroke="#B42318" stroke-width="3" marker-end="url(#arrow-red)" data-flow-kind="dependency" data-flow-label="compare policies only after active structural carriers are matched"/>
  <text x="600" y="830" text-anchor="middle" class="sans body" fill="#B42318" font-weight="700">compare policies only after active structural carriers are matched</text>
</svg>
