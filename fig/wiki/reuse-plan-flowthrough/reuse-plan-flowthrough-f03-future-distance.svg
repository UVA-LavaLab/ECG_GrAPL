        [fill="#FFFFFF"]{fill:#111827}[stroke="#FFFFFF"]{stroke:#111827}
        [fill="#F8FAFC"]{fill:#172033}[stroke="#F8FAFC"]{stroke:#172033}
        [fill="#EFF6FF"]{fill:#172554}[stroke="#EFF6FF"]{stroke:#172554}
        [fill="#ECFDF5"]{fill:#073B34}[stroke="#ECFDF5"]{stroke:#073B34}
        [fill="#FFF7ED"]{fill:#422A12}[stroke="#FFF7ED"]{stroke:#422A12}
        [fill="#FFF1F2"]{fill:#421B22}[stroke="#FFF1F2"]{stroke:#421B22}
        [fill="#F5F3FF"]{fill:#292349}[stroke="#F5F3FF"]{stroke:#292349}
        [fill="#182230"]{fill:#F8FAFC}[stroke="#182230"]{stroke:#F8FAFC}
        [fill="#475467"]{fill:#94A3B8}[stroke="#475467"]{stroke:#94A3B8}
        [fill="#98A2B3"]{fill:#A8B0BF}[stroke="#98A2B3"]{stroke:#A8B0BF}
        [fill="#2563EB"]{fill:#7FB0FF}[stroke="#2563EB"]{stroke:#7FB0FF}
        [fill="#0F8A72"]{fill:#5ED0B0}[stroke="#0F8A72"]{stroke:#5ED0B0}
        [fill="#C56A13"]{fill:#F0B36A}[stroke="#C56A13"]{stroke:#F0B36A}
        [fill="#6558C5"]{fill:#ADA4FF}[stroke="#6558C5"]{stroke:#ADA4FF}
        [fill="#C63C4A"]{fill:#F48B98}[stroke="#C63C4A"]{stroke:#F48B98}
      }
      .sans{font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif}
      .mono{font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:18px}
      .heading{font-size:22px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:16px}
</style></defs>
  <rect x="0" y="0" width="1200" height="1070" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">From the next use to a conservative deadline</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">The coordinate is the governed edge-request sequence, not an outer-vertex ID or a CPU cycle.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">ONE LINE, TWO DIFFERENT POSITIONS</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#475467">line 0x80000040 contains vertices 16..31</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="40" y="208" text-anchor="start" class="sans subtitle" fill="#2563EB">j=18, seq=19: read p[18]</text>
  <text x="390" y="208" text-anchor="start" class="sans subtitle" fill="#0F8A72">j=22, seq=23: next line use</text>
  <rect x="100" y="315" width="560" height="50" rx="0" fill="#ECFDF5" stroke="#0F8A72" stroke-width="1.5" data-shape="rect" data-x="100" data-y="315" data-width="560" data-height="50"/>
  <text x="380" y="347" text-anchor="middle" class="sans body" fill="#0F8A72">effective finite prediction</text>
  <line x1="100" y1="283" x2="1100" y2="283" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="100" y1="272" x2="100" y2="296" stroke="#2563EB" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="100" y="254" text-anchor="middle" class="sans body" fill="#2563EB">current</text>
  <text x="100" y="393" text-anchor="middle" class="mono body" fill="#2563EB">19</text>
  <line x1="420" y1="272" x2="420" y2="296" stroke="#0F8A72" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="420" y="238" text-anchor="middle" class="sans body" fill="#0F8A72">actual next use</text>
  <text x="420" y="393" text-anchor="middle" class="mono body" fill="#0F8A72">23</text>
  <line x1="660" y1="272" x2="660" y2="296" stroke="#6558C5" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="660" y="254" text-anchor="middle" class="sans body" fill="#6558C5">deadline</text>
  <text x="660" y="393" text-anchor="middle" class="mono body" fill="#6558C5">26</text>
  <line x1="740" y1="272" x2="740" y2="296" stroke="#C63C4A" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="740" y="230" text-anchor="middle" class="sans body" fill="#C63C4A">expired</text>
  <text x="740" y="393" text-anchor="middle" class="mono body" fill="#C63C4A">27</text>
  <line x1="1060" y1="272" x2="1060" y2="296" stroke="#475467" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="1060" y="254" text-anchor="middle" class="sans body" fill="#475467">sequence</text>
  <text x="1060" y="393" text-anchor="middle" class="mono body" fill="#475467">31</text>
  <path d="M100 428 L420 428" fill="none" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-green)" data-flow-kind="dependency" data-flow-underlay="false" data-flow-label="true distance = 4"/>
  <rect x="177.48" y="441.00" width="165.04" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="260" y="458" text-anchor="middle" class="sans body" fill="#0F8A72" font-weight="700">true distance = 4</text>
  <path d="M100 493 L660 493" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="dependency" data-flow-underlay="false" data-flow-label="decoded upper bound = 7"/>
  <rect x="270.12" y="506.00" width="219.76" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="380" y="523" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">decoded upper bound = 7</text>
  <text x="40" y="567" text-anchor="start" class="sans body" fill="#475467">Holding this prediction fixed for illustration; real hits and commit updates can refresh it.</text>
  <circle cx="44" cy="620" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="626" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="627" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">LOGARITHMIC PRECISION IS EXPLICIT</text>
  <text x="1158" y="626" text-anchor="end" class="sans body" fill="#475467">no runtime logarithm is required</text>
  <line x1="24" y1="646" x2="1176" y2="646" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="646" x2="170" y2="646" stroke="#6558C5" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="675" width="1120" height="215" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="675" data-width="1120" data-height="215"/>
  <line x1="40" y1="718.0" x2="1160" y2="718.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="761.0" x2="1160" y2="761.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="804.0" x2="1160" y2="804.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="847.0" x2="1160" y2="847.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="52" y="703" text-anchor="start" class="sans label" fill="#182230" font-weight="700">True distance</text>
  <text x="52" y="746" text-anchor="start" class="sans body" fill="#182230">1</text>
  <text x="52" y="789" text-anchor="start" class="sans body" fill="#182230">2..3</text>
  <text x="52" y="832" text-anchor="start" class="sans body" fill="#182230">4..7</text>
  <text x="52" y="875" text-anchor="start" class="sans body" fill="#182230">8..15</text>
  <line x1="285" y1="675" x2="285" y2="890" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="297" y="703" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Bucket</text>
  <text x="297" y="746" text-anchor="start" class="sans body" fill="#182230">0</text>
  <text x="297" y="789" text-anchor="start" class="sans body" fill="#182230">1</text>
  <text x="297" y="832" text-anchor="start" class="sans body" fill="#182230">2</text>
  <text x="297" y="875" text-anchor="start" class="sans body" fill="#182230">3</text>
  <line x1="550" y1="675" x2="550" y2="890" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="562" y="703" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Finite token</text>
  <text x="562" y="746" text-anchor="start" class="sans body" fill="#182230">2</text>
  <text x="562" y="789" text-anchor="start" class="sans body" fill="#182230">3</text>
  <text x="562" y="832" text-anchor="start" class="sans body" fill="#182230">4</text>
  <text x="562" y="875" text-anchor="start" class="sans body" fill="#182230">5</text>
  <line x1="820" y1="675" x2="820" y2="890" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="832" y="703" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Decoded distance</text>
  <text x="832" y="746" text-anchor="start" class="sans body" fill="#182230">1</text>
  <text x="832" y="789" text-anchor="start" class="sans body" fill="#182230">3</text>
  <text x="832" y="832" text-anchor="start" class="sans body" fill="#182230">7</text>
  <text x="832" y="875" text-anchor="start" class="sans body" fill="#182230">15</text>
  <circle cx="44" cy="939" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="945" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="946" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">EXPIRY IS NOT DEATH</text>
  <text x="1158" y="945" text-anchor="end" class="sans body" fill="#475467">wrapping the sequence counter is handled separately</text>
  <line x1="24" y1="965" x2="1176" y2="965" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="965" x2="170" y2="965" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="40" y="996" text-anchor="start" class="sans body" fill="#C63C4A">Passed bound -&gt; UNKNOWN. Only explicit no-future-use knowledge produces DEAD.</text>
  <text x="40" y="1028" text-anchor="start" class="sans body" fill="#182230">WRAP identifies next-traversal reuse; the requested final traversal cannot promise another pass.</text>
</svg>
