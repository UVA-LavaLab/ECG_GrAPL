  <text x="40" y="753" text-anchor="start" class="sans body" fill="#182230">Full14 keeps mantissa precision. Scale6 uses a compact state/distance token; its distance-four upper bound is 7.</text>
  <text x="40" y="785" text-anchor="start" class="sans body" fill="#475467">Distance 100 is a separate precision probe, not a request in the running 32-vertex graph.</text>
