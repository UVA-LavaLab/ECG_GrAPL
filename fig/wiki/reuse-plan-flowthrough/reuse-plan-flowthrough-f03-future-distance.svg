  <text x="1160" y="1058" text-anchor="end" class="sans body" fill="#475467">semantic s</text>
  <text x="40" y="1104" text-anchor="start" class="sans body" fill="#182230">The actual next B use is at s23 and can refresh its prediction. Only explicit no-future-use knowledge is DEAD.</text>
  <text x="40" y="1136" text-anchor="start" class="sans body" fill="#475467">WRAP means next-traversal reuse; it normalizes to FINITE if another pass remains, otherwise DEAD.</text>
