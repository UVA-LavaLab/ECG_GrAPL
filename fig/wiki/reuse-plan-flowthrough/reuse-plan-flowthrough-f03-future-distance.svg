  <text x="272" y="644" text-anchor="start" class="sans body" fill="#182230">4</text>
  <text x="272" y="692" text-anchor="start" class="sans body" fill="#182230">103</text>
  <line x1="485" y1="568" x2="485" y2="712" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="497" y="596" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Full14: 10/2/2</text>
