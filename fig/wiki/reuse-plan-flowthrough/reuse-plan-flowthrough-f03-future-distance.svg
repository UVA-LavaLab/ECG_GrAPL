<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc" fill="#27313A" data-figure-schema="ecg-public/v1">
  <title id="title">Cache-line access schedule and circular reuse distance</title>
  <desc id="desc">A horizontal schedule follows property line 0x80000040 from current outer vertex 8 to subsequent access-source vertices 11 and 15. The ReusePlan stores their quantized epochs, and rrip_first consults the nearer circular distance only after the line becomes RRIP eligible.</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/></marker>
<marker id="arrow-green" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#15803D"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#B45309"/></marker>
<marker id="arrow-red" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#B42318"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6D5BD0"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#9AA3AD"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#27313A"/></marker><style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        [fill="#FFFFFF"]{fill:#1E2327}[stroke="#FFFFFF"]{stroke:#1E2327}
        [fill="#F8F6EC"]{fill:#252A2E}[stroke="#F8F6EC"]{stroke:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[stroke="#EDF5FF"]{stroke:#273846}
        [fill="#E7F7EA"]{fill:#24382A}[stroke="#E7F7EA"]{stroke:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[stroke="#FFF0D8"]{stroke:#3B3122}
        [fill="#F7DEDC"]{fill:#3D292A}[stroke="#F7DEDC"]{stroke:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#EEE9FF"]{stroke:#302C3C}
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#9AA3AD"]{fill:#747D86}[stroke="#9AA3AD"]{stroke:#747D86}
        [fill="#1769C2"]{fill:#63A8FF}[stroke="#1769C2"]{stroke:#63A8FF}
        [fill="#15803D"]{fill:#63D68B}[stroke="#15803D"]{stroke:#63D68B}
        [fill="#B45309"]{fill:#F0B35A}[stroke="#B45309"]{stroke:#F0B35A}
        [fill="#6D5BD0"]{fill:#A79BF0}[stroke="#6D5BD0"]{stroke:#A79BF0}
        [fill="#B42318"]{fill:#F09B95}[stroke="#B42318"]{stroke:#F09B95}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:18px}
      .heading{font-size:22px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:16px}
</style></defs>
  <rect x="0" y="0" width="1200" height="1140" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#27313A" font-weight="700">Cache-line access schedule and circular reuse distance</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#27313A">The tracked property line is subsequently accessed from outer vertices 11 and 15 after 8.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <circle cx="44" cy="138" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#6D5BD0" font-weight="700">CHECKED CACHE-LINE TIMELINE</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#9AA3AD">one 64-byte line contains property vertices 16..31</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#6D5BD0" stroke-width="3"/>
  <rect x="24" y="180" width="1152" height="340" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="3"/>
  <line x1="85" y1="340" x2="1115" y2="340" stroke="#27313A" stroke-width="3"/>
  <line x1="85.0" y1="322" x2="85.0" y2="358" stroke="#9AA3AD" stroke-width="3"/>
  <circle cx="85.0" cy="340" r="11" fill="#FFFFFF" stroke="#9AA3AD" stroke-width="1"/>
  <text x="85.0" y="292" text-anchor="middle" class="sans label" fill="#9AA3AD" font-weight="700">0</text>
  <line x1="350.80645161290323" y1="322" x2="350.80645161290323" y2="358" stroke="#B45309" stroke-width="3"/>
  <circle cx="350.80645161290323" cy="340" r="11" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="350.80645161290323" y="395" text-anchor="middle" class="sans label" fill="#B45309" font-weight="700">8</text>
  <line x1="450.48387096774195" y1="322" x2="450.48387096774195" y2="358" stroke="#15803D" stroke-width="3"/>
  <circle cx="450.48387096774195" cy="340" r="11" fill="#FFFFFF" stroke="#15803D" stroke-width="1"/>
  <text x="450.48387096774195" y="292" text-anchor="middle" class="sans label" fill="#15803D" font-weight="700">11</text>
  <line x1="583.3870967741935" y1="322" x2="583.3870967741935" y2="358" stroke="#6D5BD0" stroke-width="3"/>
  <circle cx="583.3870967741935" cy="340" r="11" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="1"/>
  <text x="583.3870967741935" y="395" text-anchor="middle" class="sans label" fill="#6D5BD0" font-weight="700">15</text>
  <line x1="1115.0" y1="322" x2="1115.0" y2="358" stroke="#9AA3AD" stroke-width="3"/>
  <circle cx="1115.0" cy="340" r="11" fill="#FFFFFF" stroke="#9AA3AD" stroke-width="1"/>
  <text x="1115.0" y="292" text-anchor="middle" class="sans label" fill="#9AA3AD" font-weight="700">31</text>
  <text x="85" y="235" text-anchor="start" class="sans label" fill="#6D5BD0" font-weight="700">line 0x80000040 sources: [1, 6, 8, 11, 15, 18, 20]</text>
  <text x="1115" y="235" text-anchor="end" class="sans label" fill="#B45309" font-weight="700">fixture 4-&gt;7 / internal 8-&gt;18: e1=11, e2=15</text>
  <text x="260" y="450" text-anchor="start" class="sans body" fill="#B45309">current outer vertex</text>
  <text x="505" y="450" text-anchor="start" class="sans body" fill="#15803D">next line access</text>
  <text x="860" y="450" text-anchor="start" class="sans body" fill="#6D5BD0">second line access</text>
  <text x="600" y="492" text-anchor="middle" class="sans body" fill="#9AA3AD">the record encodes the next two scheduled accesses to this property line</text>
  <circle cx="44" cy="565" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="571" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="572" text-anchor="start" class="sans heading" fill="#15803D" font-weight="700">CIRCULAR DISTANCE AT THE LLC</text>
  <text x="1158" y="571" text-anchor="end" class="sans body" fill="#9AA3AD">the current victim-time epoch can advance after fill</text>
  <line x1="24" y1="591" x2="1176" y2="591" stroke="#15803D" stroke-width="3"/>
  <circle cx="190" cy="690" r="80" fill="#EEE9FF" stroke="#6D5BD0" stroke-width="1"/>
  <circle cx="190" cy="690" r="54" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
  <text x="190" y="682" text-anchor="middle" class="sans label" fill="#6D5BD0" font-weight="700">epoch</text>
  <text x="190" y="710" text-anchor="middle" class="sans body" fill="#6D5BD0">mod 32</text>
  <circle cx="270.0" cy="690.0" r="11" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="300.0" y="696.0" text-anchor="middle" class="sans body" fill="#B45309" font-weight="700">c=8</text>
  <circle cx="256.51756898420365" cy="734.4456186415682" r="11" fill="#FFFFFF" stroke="#15803D" stroke-width="1"/>
  <text x="281.46165735328" y="757.1127256321562" text-anchor="middle" class="sans body" fill="#15803D" font-weight="700">e1=11</text>
  <circle cx="205.6072257612903" cy="768.4628224322585" r="11" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="1"/>
  <text x="211.45993542177413" y="803.8863808443554" text-anchor="middle" class="sans body" fill="#6D5BD0" font-weight="700">e2=15</text>
  <rect x="380" y="607" width="796" height="205" rx="0" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <line x1="380" y1="652" x2="1176" y2="652" stroke="#27313A" stroke-width="1"/>
  <line x1="380" y1="697" x2="1176" y2="697" stroke="#27313A" stroke-width="1"/>
  <line x1="380" y1="742" x2="1176" y2="742" stroke="#27313A" stroke-width="1"/>
  <text x="400" y="637" text-anchor="start" class="mono body" fill="#27313A" font-weight="700">current epoch c = 8</text>
  <text x="400" y="682" text-anchor="start" class="mono body" fill="#27313A">d1 = (11 + 32 - 8) mod 32 = 3</text>
  <text x="400" y="727" text-anchor="start" class="mono body" fill="#27313A">d2 = (15 + 32 - 8) mod 32 = 7</text>
  <text x="400" y="772" text-anchor="start" class="mono body" fill="#15803D" font-weight="700">nearest = min(3, 7) = 3</text>
  <text x="790" y="637" text-anchor="start" class="sans body" fill="#6D5BD0">line state stores absolute epochs</text>
  <text x="790" y="682" text-anchor="start" class="sans body" fill="#27313A">victim-time c may advance after fill</text>
  <text x="790" y="727" text-anchor="start" class="sans body" fill="#27313A">unstamped distance = 0</text>
  <text x="790" y="772" text-anchor="start" class="sans body" fill="#27313A">malformed epochs are clamped</text>
  <circle cx="44" cy="857" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="863" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="864" text-anchor="start" class="sans heading" fill="#B42318" font-weight="700">RRIP-FIRST DECISION</text>
  <text x="1158" y="863" text-anchor="end" class="sans body" fill="#9AA3AD">property-line ranking follows RRIP eligibility</text>
  <line x1="24" y1="883" x2="1176" y2="883" stroke="#B42318" stroke-width="3"/>
  <polygon points="220,912.5 325.0,970 220,1027.5 115.0,970" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="220" y="958" text-anchor="middle" class="sans label" fill="#15803D" font-weight="700">max-RRPV</text>
  <text x="220" y="985" text-anchor="middle" class="sans body" fill="#27313A">candidate exists?</text>
  <polygon points="555,912.5 660.0,970 555,1027.5 450.0,970" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="555" y="958" text-anchor="middle" class="sans label" fill="#B45309" font-weight="700">eligible structural</text>
  <text x="555" y="985" text-anchor="middle" class="sans body" fill="#27313A">candidate exists?</text>
  <rect x="760" y="910" width="190" height="120" rx="0" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="855" y="947" text-anchor="middle" class="sans label" fill="#B45309" font-weight="700">select oldest</text>
  <text x="855" y="980" text-anchor="middle" class="sans body" fill="#27313A">structural line</text>
  <rect x="980" y="910" width="196" height="120" rx="0" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="1078" y="943" text-anchor="middle" class="sans label" fill="#B42318" font-weight="700">select farthest</text>
  <text x="1078" y="973" text-anchor="middle" class="sans body" fill="#27313A">stamped distance</text>
  <text x="1078" y="1003" text-anchor="middle" class="sans body" fill="#27313A">stable set-order tie</text>
  <path d="M325 970 L450 970" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#arrow-green)" data-flow-kind="control" data-flow-label="eligible set formed"/>
  <text x="388" y="900" text-anchor="middle" class="sans body" fill="#15803D" font-weight="700">eligible set formed</text>
  <path d="M660 945 L760 945" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-amber)" data-flow-kind="control" data-flow-label="eligible structural"/>
  <path d="M660 995 L690 1050 L940 1050 L940 995 L980 995" fill="none" stroke="#B42318" stroke-width="3" marker-end="url(#arrow-red)" data-flow-kind="control" data-flow-label="no: property only"/>
  <text x="815" y="1085" text-anchor="middle" class="sans body" fill="#B42318" font-weight="700">no: property only</text>
  <path d="M220 1028 L220 1085 L80 1085 L80 970 L115 970" fill="none" stroke="#6D5BD0" stroke-width="3" marker-end="url(#arrow-purple)" data-flow-kind="loop" data-flow-label="none: age RRPV and retry"/>
  <text x="265" y="1075" text-anchor="start" class="sans body" fill="#6D5BD0" font-weight="700">none: age RRPV and retry</text>
</svg>
