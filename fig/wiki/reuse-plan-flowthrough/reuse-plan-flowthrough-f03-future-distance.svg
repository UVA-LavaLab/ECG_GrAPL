  <text x="497" y="692" text-anchor="start" class="sans body" fill="#182230">101</text>
  <line x1="710" y1="568" x2="710" y2="712" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
