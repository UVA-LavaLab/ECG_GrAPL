<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc" fill="#182230" data-figure-schema="ecg-public/v1">
  <title id="title">More metadata bits sharpen the future bound</title>
  <desc id="desc">CSR position seventeen accesses line A and position eighteen accesses line B. Their next uses are at positions nineteen and twenty-two. Full14 represents the tracked distance four exactly, while Scale6 decodes it to seven. A separate distance-one-hundred quantizer probe shows the effect of additional mantissa bits. Passed predictions become UNKNOWN, not DEAD; the timeline deliberately holds one prediction fixed.</desc>
