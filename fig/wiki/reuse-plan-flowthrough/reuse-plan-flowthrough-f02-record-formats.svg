<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc" fill="#182230" data-figure-schema="ecg-public/v1">
  <title id="title">Choose one adaptive layout for the graph</title>
  <desc id="desc">A record uses the actual maximum encoded vertex ID, not a rounded format family. Metadata consumes every remaining bit. H is the bit width of record_count; the largest mantissa m satisfying 2 + 2*H*2^m &lt;= 2^M is selected. Four bytes are tried before the explicit eight-byte escape unless width is forced.</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563EB"/></marker>
<marker id="arrow-green" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#0F8A72"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C56A13"/></marker>
<marker id="arrow-red" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C63C4A"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6558C5"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#98A2B3"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#182230"/></marker><style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        [fill="#FFFFFF"]{fill:#111827}[stroke="#FFFFFF"]{stroke:#111827}
        [fill="#F8FAFC"]{fill:#172033}[stroke="#F8FAFC"]{stroke:#172033}
        [fill="#EFF6FF"]{fill:#172554}[stroke="#EFF6FF"]{stroke:#172554}
        [fill="#ECFDF5"]{fill:#073B34}[stroke="#ECFDF5"]{stroke:#073B34}
        [fill="#FFF7ED"]{fill:#422A12}[stroke="#FFF7ED"]{stroke:#422A12}
        [fill="#FFF1F2"]{fill:#421B22}[stroke="#FFF1F2"]{stroke:#421B22}
        [fill="#F5F3FF"]{fill:#292349}[stroke="#F5F3FF"]{stroke:#292349}
        [fill="#182230"]{fill:#F8FAFC}[stroke="#182230"]{stroke:#F8FAFC}
        [fill="#475467"]{fill:#94A3B8}[stroke="#475467"]{stroke:#94A3B8}
        [fill="#98A2B3"]{fill:#A8B0BF}[stroke="#98A2B3"]{stroke:#A8B0BF}
        [fill="#2563EB"]{fill:#7FB0FF}[stroke="#2563EB"]{stroke:#7FB0FF}
        [fill="#0F8A72"]{fill:#5ED0B0}[stroke="#0F8A72"]{stroke:#5ED0B0}
        [fill="#C56A13"]{fill:#F0B36A}[stroke="#C56A13"]{stroke:#F0B36A}
        [fill="#6558C5"]{fill:#ADA4FF}[stroke="#6558C5"]{stroke:#ADA4FF}
        [fill="#C63C4A"]{fill:#F48B98}[stroke="#C63C4A"]{stroke:#F48B98}
      }
      .sans{font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif}
      .mono{font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:18px}
      .heading{font-size:22px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:16px}
</style></defs>
  <rect x="0" y="0" width="1200" height="1320" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Choose one adaptive layout for the graph</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">ID width, record count and requested precision determine every record field.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">GRAPH SIZE SETS THE BIT BUDGET</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#475467">b_ID = max(1, ceil(log2 |V|))</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="199" width="1120" height="264" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="199" data-width="1120" data-height="264"/>
  <line x1="40" y1="243.0" x2="1160" y2="243.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="287.0" x2="1160" y2="287.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="331.0" x2="1160" y2="331.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="375.0" x2="1160" y2="375.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="419.0" x2="1160" y2="419.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="52" y="227" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Numeric case</text>
  <text x="52" y="271" text-anchor="start" class="sans body" fill="#182230">Running fixture (actual max ID 31)</text>
  <text x="52" y="315" text-anchor="start" class="sans body" fill="#182230">18-bit IDs</text>
  <text x="52" y="359" text-anchor="start" class="sans body" fill="#182230">19-bit IDs</text>
  <text x="52" y="403" text-anchor="start" class="sans body" fill="#182230">20-bit IDs</text>
  <text x="52" y="447" text-anchor="start" class="sans body" fill="#182230">26-bit IDs</text>
  <line x1="370" y1="199" x2="370" y2="463" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="382" y="227" text-anchor="start" class="sans label" fill="#182230" font-weight="700">ID bits</text>
  <text x="382" y="271" text-anchor="start" class="sans body" fill="#182230">5</text>
  <text x="382" y="315" text-anchor="start" class="sans body" fill="#182230">18</text>
  <text x="382" y="359" text-anchor="start" class="sans body" fill="#182230">19</text>
  <text x="382" y="403" text-anchor="start" class="sans body" fill="#182230">20</text>
  <text x="382" y="447" text-anchor="start" class="sans body" fill="#182230">26</text>
  <line x1="540" y1="199" x2="540" y2="463" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="552" y="227" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Metadata M</text>
  <text x="552" y="271" text-anchor="start" class="sans body" fill="#182230">M=27</text>
  <text x="552" y="315" text-anchor="start" class="sans body" fill="#182230">M=14</text>
  <text x="552" y="359" text-anchor="start" class="sans body" fill="#182230">M=13</text>
  <text x="552" y="403" text-anchor="start" class="sans body" fill="#182230">M=12</text>
  <text x="552" y="447" text-anchor="start" class="sans body" fill="#182230">M=6</text>
  <line x1="730" y1="199" x2="730" y2="463" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="742" y="227" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Precision at H=31</text>
  <text x="742" y="271" text-anchor="start" class="sans body" fill="#182230">H=6 here; m=23</text>
  <text x="742" y="315" text-anchor="start" class="sans body" fill="#182230">m=8</text>
  <text x="742" y="359" text-anchor="start" class="sans body" fill="#182230">m=7</text>
  <text x="742" y="403" text-anchor="start" class="sans body" fill="#182230">m=6</text>
  <text x="742" y="447" text-anchor="start" class="sans body" fill="#182230">m=0</text>
  <text x="40" y="490" text-anchor="start" class="sans body" fill="#182230">These are numeric layouts of one method, not public fixed-format families.</text>
  <circle cx="44" cy="530" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="536" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="537" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">THE RUNNING 32-BIT LAYOUT</text>
  <text x="1158" y="536" text-anchor="end" class="sans body" fill="#475467">actual five-bit IDs; all 27 metadata bits are used</text>
  <line x1="24" y1="556" x2="1176" y2="556" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="556" x2="170" y2="556" stroke="#6558C5" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="512.5" y="554" text-anchor="middle" class="mono body" fill="#182230">[31:5]</text>
  <text x="1065" y="554" text-anchor="middle" class="mono body" fill="#182230">[4:0]</text>
  <rect x="40" y="577" width="945.0" height="88" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="40" data-y="577" data-width="945.0" data-height="88"/>
  <text x="512.5" y="619.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">joint state/distance token (M=27; H=6, e=3, m=23)</text>
  <text x="512.5" y="643.0" text-anchor="middle" class="sans body" fill="#182230">27 bits</text>
  <rect x="985.0" y="577" width="175.0" height="88" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="985.0" data-y="577" data-width="175.0" data-height="88"/>
  <text x="1072.5" y="619.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">vertex</text>
  <text x="1072.5" y="643.0" text-anchor="middle" class="sans body" fill="#182230">5 bits</text>
  <text x="40" y="706" text-anchor="start" class="sans body" fill="#182230">q = 2 &lt;&lt; 23; FINITE token = 2 + q; mask 0x20000040; R = 0x20000052.</text>
  <rect x="40" y="747" width="1120" height="220" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="747" data-width="1120" data-height="220"/>
  <line x1="40" y1="791.0" x2="1160" y2="791.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="835.0" x2="1160" y2="835.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="879.0" x2="1160" y2="879.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="923.0" x2="1160" y2="923.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="52" y="775" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Token range</text>
  <text x="52" y="819" text-anchor="start" class="sans body" fill="#182230">0</text>
  <text x="52" y="863" text-anchor="start" class="sans body" fill="#182230">1</text>
  <text x="52" y="907" text-anchor="start" class="sans body" fill="#182230">2 .. 1+K</text>
  <text x="52" y="951" text-anchor="start" class="sans body" fill="#182230">2+K .. 1+2K</text>
  <line x1="285" y1="747" x2="285" y2="967" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="297" y="775" text-anchor="start" class="sans label" fill="#182230" font-weight="700">State</text>
  <text x="297" y="819" text-anchor="start" class="sans body" fill="#182230">UNKNOWN</text>
  <text x="297" y="863" text-anchor="start" class="sans body" fill="#182230">DEAD</text>
  <text x="297" y="907" text-anchor="start" class="sans body" fill="#182230">FINITE</text>
  <text x="297" y="951" text-anchor="start" class="sans body" fill="#182230">WRAP</text>
  <line x1="530" y1="747" x2="530" y2="967" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="542" y="775" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Payload</text>
  <text x="542" y="819" text-anchor="start" class="sans body" fill="#182230">--</text>
  <text x="542" y="863" text-anchor="start" class="sans body" fill="#182230">--</text>
  <text x="542" y="907" text-anchor="start" class="sans body" fill="#182230">q=(e&lt;&lt;m)|mantissa</text>
  <text x="542" y="951" text-anchor="start" class="sans body" fill="#182230">q=(e&lt;&lt;m)|mantissa</text>
  <line x1="830" y1="747" x2="830" y2="967" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="842" y="775" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Meaning</text>
  <text x="842" y="819" text-anchor="start" class="sans body" fill="#182230">no finite bound</text>
  <text x="842" y="863" text-anchor="start" class="sans body" fill="#182230">no use in requested horizon</text>
  <text x="842" y="907" text-anchor="start" class="sans body" fill="#182230">same-traversal upper bound</text>
  <text x="842" y="951" text-anchor="start" class="sans body" fill="#182230">next-traversal upper bound</text>
  <text x="40" y="990" text-anchor="start" class="sans body" fill="#182230">K = H x 2^m. Invalid tokens, horizons, addresses and sequences fail closed.</text>
  <circle cx="44" cy="1040" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="1046" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="1047" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">THE EXPLICIT EIGHT-BYTE ESCAPE</text>
  <text x="1158" y="1046" text-anchor="end" class="sans body" fill="#475467">width changes; method semantics do not</text>
  <line x1="24" y1="1066" x2="1176" y2="1066" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="1066" x2="170" y2="1066" stroke="#6558C5" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="1095" width="560.0" height="80" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="40" data-y="1095" data-width="560.0" data-height="80"/>
  <text x="320.0" y="1133.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">joint metadata [63:32]</text>
  <text x="320.0" y="1157.0" text-anchor="middle" class="sans body" fill="#182230">32 bits</text>
  <rect x="600.0" y="1095" width="560.0" height="80" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="600.0" data-y="1095" data-width="560.0" data-height="80"/>
  <text x="880.0" y="1133.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">vertex ID [31:0]</text>
  <text x="880.0" y="1157.0" text-anchor="middle" class="sans body" fill="#182230">32 bits</text>
  <text x="40" y="1190" text-anchor="start" class="sans body" fill="#182230">A full 32-bit vertex ID leaves no metadata in a 32-bit word, so the record becomes 8 bytes with M=32.</text>
  <text x="40" y="1222" text-anchor="start" class="sans body" fill="#182230">The loader may force 4 or 8 bytes, or try 4 then 8 while enforcing minimum mantissa precision.</text>
  <text x="40" y="1254" text-anchor="start" class="sans body" fill="#182230">The 26-ID/M6/H31/m0 case reproduces the old compact bytes only as a numeric configuration.</text>
  <text x="40" y="1286" text-anchor="start" class="sans body" fill="#475467">An eight-byte record alone is not evidence of exascale graph-loader support.</text>
</svg>
