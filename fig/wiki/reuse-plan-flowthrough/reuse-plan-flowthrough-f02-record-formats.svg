      .body{font-size:16px}
</style></defs>
  <rect x="0" y="0" width="1200" height="1320" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Choose the mask to fit the graph</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">Scale6 is the compact large-ID mode. Smaller graphs can use richer reference and action fields.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">GRAPH SIZE SETS THE BIT BUDGET</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#475467">b_ID = max(1, ceil(log2 |V|))</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="199" width="1120" height="196" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="199" data-width="1120" data-height="196"/>
  <line x1="40" y1="248.0" x2="1160" y2="248.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="297.0" x2="1160" y2="297.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="346.0" x2="1160" y2="346.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="52" y="227" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Graph</text>
  <text x="52" y="276" text-anchor="start" class="sans body" fill="#182230">Running example: 32 vertices</text>
  <text x="52" y="325" text-anchor="start" class="sans body" fill="#182230">262,144 vertices (n18)</text>
  <text x="52" y="374" text-anchor="start" class="sans body" fill="#182230">Twitter: 41,652,230 vertices</text>
  <line x1="380" y1="199" x2="380" y2="395" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="392" y="227" text-anchor="start" class="sans label" fill="#182230" font-weight="700">ID bits</text>
  <text x="392" y="276" text-anchor="start" class="sans body" fill="#182230">5</text>
  <text x="392" y="325" text-anchor="start" class="sans body" fill="#182230">18</text>
  <text x="392" y="374" text-anchor="start" class="sans body" fill="#182230">26</text>
  <line x1="560" y1="199" x2="560" y2="395" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="572" y="227" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Spare bits</text>
  <text x="572" y="276" text-anchor="start" class="sans body" fill="#182230">27</text>
  <text x="572" y="325" text-anchor="start" class="sans body" fill="#182230">14</text>
  <text x="572" y="374" text-anchor="start" class="sans body" fill="#182230">6</text>
  <line x1="770" y1="199" x2="770" y2="395" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="782" y="227" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Implemented encoding</text>
  <text x="782" y="276" text-anchor="start" class="sans body" fill="#182230">Full14 uses 14; 13 remain unused</text>
  <text x="782" y="325" text-anchor="start" class="sans body" fill="#182230">Full14 fills the available budget</text>
  <text x="782" y="374" text-anchor="start" class="sans body" fill="#182230">Scale6 fills the available budget</text>
  <text x="40" y="433" text-anchor="start" class="sans body" fill="#182230">The budget is 32 - b_ID, not always six bits. Format selection is explicit, not an automatic bit allocator.</text>
  <circle cx="44" cy="492" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="498" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="499" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">FULL14: A RICHER SMALL-GRAPH MASK</text>
  <text x="1158" y="498" text-anchor="end" class="sans body" fill="#475467">actual five-bit IDs in the running example</text>
  <line x1="24" y1="518" x2="1176" y2="518" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="518" x2="170" y2="518" stroke="#6558C5" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="267.5" y="554" text-anchor="middle" class="mono body" fill="#182230">[31:19]</text>
  <text x="565" y="554" text-anchor="middle" class="mono body" fill="#182230">[18:15]</text>
  <text x="670" y="554" text-anchor="middle" class="mono body" fill="#182230">[14:13]</text>
  <text x="845" y="554" text-anchor="middle" class="mono body" fill="#182230">[12:5]</text>
  <text x="1072.5" y="554" text-anchor="middle" class="mono body" fill="#182230">[4:0]</text>
  <rect x="40" y="577" width="455.0" height="88" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="2" data-shape="rect" data-x="40" data-y="577" data-width="455.0" data-height="88"/>
  <text x="267.5" y="619.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">unused</text>
  <text x="267.5" y="643.0" text-anchor="middle" class="sans body" fill="#182230">13 bits</text>
  <rect x="495.0" y="577" width="140.0" height="88" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="2" data-shape="rect" data-x="495.0" data-y="577" data-width="140.0" data-height="88"/>
  <text x="565.0" y="619.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">action</text>
  <text x="565.0" y="643.0" text-anchor="middle" class="sans body" fill="#182230">4 bits</text>
  <rect x="635.0" y="577" width="70.0" height="88" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="635.0" data-y="577" data-width="70.0" data-height="88"/>
  <text x="670.0" y="619.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">state</text>
  <text x="670.0" y="643.0" text-anchor="middle" class="sans body" fill="#182230">2 bits</text>
  <rect x="705.0" y="577" width="280.0" height="88" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="705.0" data-y="577" data-width="280.0" data-height="88"/>
  <text x="845.0" y="619.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">reference</text>
  <text x="845.0" y="643.0" text-anchor="middle" class="sans body" fill="#182230">8 bits</text>
  <rect x="985.0" y="577" width="175.0" height="88" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="985.0" data-y="577" data-width="175.0" data-height="88"/>
  <text x="1072.5" y="619.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">vertex</text>
  <text x="1072.5" y="643.0" text-anchor="middle" class="sans body" fill="#182230">5 bits</text>
  <text x="40" y="706" text-anchor="start" class="sans body" fill="#182230">0x00002212: vertex 18, reference 0x10, FINITE state 1, action 0. The ID is still recoverable.</text>
  <rect x="40" y="747" width="1120" height="176" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="747" data-width="1120" data-height="176"/>
  <line x1="40" y1="791.0" x2="1160" y2="791.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="835.0" x2="1160" y2="835.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="879.0" x2="1160" y2="879.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="52" y="775" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Ref / state / action</text>
  <text x="52" y="819" text-anchor="start" class="sans body" fill="#182230">8 / 2 / 4 (default)</text>
  <text x="52" y="863" text-anchor="start" class="sans body" fill="#182230">10 / 2 / 2</text>
  <text x="52" y="907" text-anchor="start" class="sans body" fill="#182230">12 / 2 / 0</text>
  <line x1="300" y1="747" x2="300" y2="923" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="312" y="775" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Reference precision</text>
  <text x="312" y="819" text-anchor="start" class="sans body" fill="#182230">5 exponent + 3 mantissa</text>
  <text x="312" y="863" text-anchor="start" class="sans body" fill="#182230">5 exponent + 5 mantissa</text>
  <text x="312" y="907" text-anchor="start" class="sans body" fill="#182230">5 exponent + 7 mantissa</text>
  <line x1="560" y1="747" x2="560" y2="923" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="572" y="775" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Action interpretation</text>
  <text x="572" y="819" text-anchor="start" class="sans body" fill="#182230">direct forward record lead</text>
  <text x="572" y="863" text-anchor="start" class="sans body" fill="#182230">codes for {none, 8, 12, 15}</text>
  <text x="572" y="907" text-anchor="start" class="sans body" fill="#182230">no encoded prefetch action</text>
  <line x1="880" y1="747" x2="880" y2="923" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="892" y="775" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Metadata total</text>
  <text x="892" y="819" text-anchor="start" class="sans body" fill="#182230">14 bits</text>
  <text x="892" y="863" text-anchor="start" class="sans body" fill="#182230">14 bits</text>
  <text x="892" y="907" text-anchor="start" class="sans body" fill="#182230">14 bits</text>
  <text x="40" y="958" text-anchor="start" class="sans body" fill="#182230">More reference precision trades against action bits within Full14; it does not automatically consume all spare bits.</text>
  <circle cx="44" cy="1012" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="1018" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="1019" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">SCALE6: THE TWITTER-SCALE CHOICE</text>
  <text x="1158" y="1018" text-anchor="end" class="sans body" fill="#475467">also the current fixed-width native ABI</text>
  <line x1="24" y1="1038" x2="1176" y2="1038" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="1038" x2="170" y2="1038" stroke="#6558C5" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="1070" width="210.0" height="80" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="40" data-y="1070" data-width="210.0" data-height="80"/>
  <text x="145.0" y="1108.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">token [31:26]</text>
  <text x="145.0" y="1132.0" text-anchor="middle" class="sans body" fill="#182230">6 bits</text>
  <rect x="250.0" y="1070" width="910.0" height="80" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="250.0" data-y="1070" data-width="910.0" data-height="80"/>
  <text x="705.0" y="1108.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">vertex ID [25:0]</text>
  <text x="705.0" y="1132.0" text-anchor="middle" class="sans body" fill="#182230">26 bits</text>
  <text x="40" y="1190" text-anchor="start" class="sans body" fill="#182230">Token: 0 UNKNOWN | 1 DEAD | 2..32 FINITE | 33..63 WRAP. No separate action field.</text>
  <text x="40" y="1222" text-anchor="start" class="sans body" fill="#182230">The same edge is 0x10000012 in the 26+6 ABI; its distance-four hint decodes to seven.</text>
  <text x="40" y="1254" text-anchor="start" class="sans body" fill="#182230">Full14 supports ID widths through 18; Scale6 through 26. Unused headroom is not silently reassigned.</text>
  <text x="40" y="1286" text-anchor="start" class="sans body" fill="#475467">Native rich-format decode is not implemented. The functional model supports both encodings.</text>
</svg>
