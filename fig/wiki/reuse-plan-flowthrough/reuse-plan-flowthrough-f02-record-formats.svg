<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc" fill="#182230" data-figure-schema="ecg-public/v1">
  <title id="title">One 32-bit record, including Twitter-sized IDs</title>
  <desc id="desc">The Scale6 word places the six-bit future token in bits 31 through 26 and the property vertex in bits 25 through zero. A token table explains unknown, dead, finite-current and next-traversal reuse. The plate contrasts this format with the retained n18 Full14 format without claiming identical precision.</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563EB"/></marker>
<marker id="arrow-green" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#0F8A72"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C56A13"/></marker>
<marker id="arrow-red" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C63C4A"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6558C5"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#98A2B3"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#182230"/></marker><style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        [fill="#FFFFFF"]{fill:#111827}[stroke="#FFFFFF"]{stroke:#111827}
        [fill="#F8FAFC"]{fill:#172033}[stroke="#F8FAFC"]{stroke:#172033}
        [fill="#EFF6FF"]{fill:#172554}[stroke="#EFF6FF"]{stroke:#172554}
        [fill="#ECFDF5"]{fill:#073B34}[stroke="#ECFDF5"]{stroke:#073B34}
        [fill="#FFF7ED"]{fill:#422A12}[stroke="#FFF7ED"]{stroke:#422A12}
        [fill="#FFF1F2"]{fill:#421B22}[stroke="#FFF1F2"]{stroke:#421B22}
        [fill="#F5F3FF"]{fill:#292349}[stroke="#F5F3FF"]{stroke:#292349}
        [fill="#182230"]{fill:#F8FAFC}[stroke="#182230"]{stroke:#F8FAFC}
        [fill="#475467"]{fill:#94A3B8}[stroke="#475467"]{stroke:#94A3B8}
        [fill="#98A2B3"]{fill:#A8B0BF}[stroke="#98A2B3"]{stroke:#A8B0BF}
        [fill="#2563EB"]{fill:#7FB0FF}[stroke="#2563EB"]{stroke:#7FB0FF}
        [fill="#0F8A72"]{fill:#5ED0B0}[stroke="#0F8A72"]{stroke:#5ED0B0}
        [fill="#C56A13"]{fill:#F0B36A}[stroke="#C56A13"]{stroke:#F0B36A}
        [fill="#6558C5"]{fill:#ADA4FF}[stroke="#6558C5"]{stroke:#ADA4FF}
        [fill="#C63C4A"]{fill:#F48B98}[stroke="#C63C4A"]{stroke:#F48B98}
      }
      .sans{font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif}
      .mono{font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:18px}
      .heading{font-size:22px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:16px}
</style></defs>
  <rect x="0" y="0" width="1200" height="1020" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">One 32-bit record, including Twitter-sized IDs</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">The six-bit token encodes state and a logarithmic distance class; prefetch uses no record bits.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">SCALE6: THE CURRENT SCALABLE FORMAT</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#475467">high bits on the left; ordinary edge width retained</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="141" y="206" text-anchor="middle" class="mono body" fill="#6558C5">[31:26]</text>
  <text x="801" y="206" text-anchor="middle" class="mono body" fill="#2563EB">[25:0]</text>
  <rect x="40" y="227" width="210.0" height="106" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="40" data-y="227" data-width="210.0" data-height="106"/>
  <text x="145.0" y="278.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">future token</text>
  <text x="145.0" y="302.0" text-anchor="middle" class="sans body" fill="#182230">6 bits</text>
  <rect x="250.0" y="227" width="910.0" height="106" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="250.0" data-y="227" data-width="910.0" data-height="106"/>
  <text x="705.0" y="278.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">property vertex ID</text>
  <text x="705.0" y="302.0" text-anchor="middle" class="sans body" fill="#182230">26 bits</text>
  <text x="40" y="376" text-anchor="start" class="sans body" fill="#182230">Checked word: 0x10000012 = (token 4 &lt;&lt; 26) | vertex 18.</text>
  <text x="40" y="407" text-anchor="start" class="sans body" fill="#475467">Twitter needs 26 destination bits. The primary Scale6 configuration leaves exactly six token bits.</text>
  <circle cx="44" cy="460" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="466" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="467" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">THE TOKEN ALPHABET</text>
  <text x="1158" y="466" text-anchor="end" class="sans body" fill="#475467">one state code or one distance bucket</text>
  <line x1="24" y1="486" x2="1176" y2="486" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="486" x2="170" y2="486" stroke="#6558C5" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="517" width="1120" height="240" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="517" data-width="1120" data-height="240"/>
  <line x1="40" y1="565.0" x2="1160" y2="565.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="613.0" x2="1160" y2="613.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="661.0" x2="1160" y2="661.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="709.0" x2="1160" y2="709.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="52" y="545" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Token</text>
  <text x="52" y="593" text-anchor="start" class="sans body" fill="#182230">0</text>
  <text x="52" y="641" text-anchor="start" class="sans body" fill="#182230">1</text>
  <text x="52" y="689" text-anchor="start" class="sans body" fill="#182230">2..32</text>
  <text x="52" y="737" text-anchor="start" class="sans body" fill="#182230">33..63</text>
  <line x1="185" y1="517" x2="185" y2="757" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="197" y="545" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Meaning</text>
  <text x="197" y="593" text-anchor="start" class="sans body" fill="#182230">UNKNOWN</text>
  <text x="197" y="641" text-anchor="start" class="sans body" fill="#182230">DEAD</text>
  <text x="197" y="689" text-anchor="start" class="sans body" fill="#182230">FINITE</text>
  <text x="197" y="737" text-anchor="start" class="sans body" fill="#182230">WRAP</text>
  <line x1="390" y1="517" x2="390" y2="757" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="402" y="545" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Payload interpretation</text>
  <text x="402" y="593" text-anchor="start" class="sans body" fill="#182230">no usable future prediction</text>
  <text x="402" y="641" text-anchor="start" class="sans body" fill="#182230">no remaining governed use</text>
  <text x="402" y="689" text-anchor="start" class="sans body" fill="#182230">bucket = token - 2</text>
  <text x="402" y="737" text-anchor="start" class="sans body" fill="#182230">bucket = token - 33</text>
  <line x1="745" y1="517" x2="745" y2="757" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="757" y="545" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Runtime rule</text>
  <text x="757" y="593" text-anchor="start" class="sans body" fill="#182230">local GRASP / RRIP fallback</text>
  <text x="757" y="641" text-anchor="start" class="sans body" fill="#182230">bypass / prefer as victim</text>
  <text x="757" y="689" text-anchor="start" class="sans body" fill="#182230">current-traversal distance</text>
  <text x="757" y="737" text-anchor="start" class="sans body" fill="#182230">next-traversal distance</text>
  <text x="40" y="799" text-anchor="start" class="sans body" fill="#182230">bucket = floor(log2(distance)); decode upper bound = 2^(bucket + 1) - 1.</text>
  <text x="40" y="829" text-anchor="start" class="sans body" fill="#C56A13">Prefetch candidates come from the record lookahead, not a separately encoded action.</text>
  <circle cx="44" cy="888" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="894" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="895" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">DO NOT MIX FORMAT CLAIMS</text>
  <text x="1158" y="894" text-anchor="end" class="sans body" fill="#475467">explicitly select the format; never truncate IDs</text>
  <line x1="24" y1="914" x2="1176" y2="914" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="914" x2="170" y2="914" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="40" y="947" text-anchor="start" class="sans body" fill="#182230">Full14 (n18): destination 18 + reference 8 + state 2 + action 4 = 32 bits.</text>
  <text x="40" y="978" text-anchor="start" class="sans body" fill="#C63C4A">Scale6 (through n26): destination 26 + token 6 = 32 bits. Larger IDs fail closed.</text>
</svg>
