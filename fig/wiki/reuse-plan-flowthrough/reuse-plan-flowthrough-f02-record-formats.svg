  <text x="845.0" y="1073.0" text-anchor="middle" class="sans body" fill="#182230">2 bits</text>
  <rect x="890.0" y="1010" width="135.0" height="82" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="2" data-shape="rect" data-x="890.0" data-y="1010" data-width="135.0" data-height="82"/>
  <text x="957.5" y="1049.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">epoch 1: 15</text>
  <text x="957.5" y="1073.0" text-anchor="middle" class="sans body" fill="#182230">15 bits</text>
  <rect x="1025.0" y="1010" width="135.0" height="82" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="1025.0" data-y="1010" data-width="135.0" data-height="82"/>
  <text x="1092.5" y="1049.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">epoch 2: 15</text>
  <text x="1092.5" y="1073.0" text-anchor="middle" class="sans body" fill="#182230">15 bits</text>
  <text x="40" y="1130" text-anchor="start" class="sans body" fill="#C63C4A" font-weight="700">traffic = weighted-edge bytes + 4 sidecar bytes; edge and sidecar FlowThrough roles are accounted separately</text>
