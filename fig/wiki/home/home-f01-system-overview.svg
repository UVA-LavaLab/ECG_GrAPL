<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc" fill="#182230" data-figure-schema="ecg-public/v1">
  <title id="title">Scale6: future reuse in the existing edge word</title>
  <desc id="desc">The current ECG candidate uses a four-byte destination-plus-token record. Offline line-indexed construction precedes PageRank. Demand accesses, private-hit commit updates and bounded LLC prefetching are modeled in cache_sim. The diagram explicitly distinguishes that evidence from the still-unimplemented Scale6 gem5 path and physical-cost qualification.</desc>
