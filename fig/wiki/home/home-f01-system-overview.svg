  <rect x="0" y="0" width="1200" height="1060" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Scale6: future reuse in the existing edge word</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">Current result: functional cache behavior. Native cycle-timed integration remains a separate gate.</text>
