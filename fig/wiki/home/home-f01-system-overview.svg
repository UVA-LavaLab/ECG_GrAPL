  <text x="72" y="265" text-anchor="start" class="sans body" fill="#182230">row offsets + neighbors</text>
  <text x="72" y="293" text-anchor="start" class="sans body" fill="#182230">property-line reuse</text>
  <rect x="420" y="195" width="295" height="133" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="420" data-y="195" data-width="295" data-height="133"/>
