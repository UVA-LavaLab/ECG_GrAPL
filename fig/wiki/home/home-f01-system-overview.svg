  <text x="40" y="376" text-anchor="start" class="sans body" fill="#182230">4 bytes per edge; no runtime rereference matrix and no extra edge sidecar.</text>
  <text x="40" y="404" text-anchor="start" class="sans body" fill="#475467">Twitter preprocessing scratch: about 39.7 MiB, indexed by property line, not by edge.</text>
