  <rect x="0" y="0" width="1200" height="1160" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#27313A" font-weight="700">ECG Next: offline guidance to request-bound LLC state</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#27313A">The diagram separates offline graph analysis, runtime requests, cache policy, and evaluation scope.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <circle cx="44" cy="138" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#1769C2" font-weight="700">OFFLINE GRAPH ANALYSIS</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#9AA3AD">immutable records; excluded from the ROI</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#1769C2" stroke-width="3"/>
  <rect x="24" y="180" width="360" height="205" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="40" y="209" text-anchor="start" class="sans label" fill="#1769C2" font-weight="700">Kernel traversal direction</text>
  <text x="40" y="239" text-anchor="start" class="sans body" fill="#27313A">PageRank: incoming-neighbor rows</text>
  <text x="40" y="263" text-anchor="start" class="sans body" fill="#27313A">BFS / BC / CC / SSSP:</text>
  <text x="40" y="287" text-anchor="start" class="sans body" fill="#27313A">outgoing-neighbor rows</text>
  <text x="40" y="311" text-anchor="start" class="sans body" fill="#27313A">CSR fixes property-access order</text>
  <rect x="420" y="180" width="360" height="205" rx="9" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="436" y="209" text-anchor="start" class="sans label" fill="#6D5BD0" font-weight="700">Per-line ReusePlan</text>
  <text x="436" y="239" text-anchor="start" class="sans body" fill="#27313A">rank d_in or d_out access counts</text>
  <text x="436" y="263" text-anchor="start" class="sans body" fill="#27313A">assign tier 1 / 2 / 3</text>
  <text x="436" y="287" text-anchor="start" class="sans body" fill="#27313A">find two subsequent line accesses</text>
  <text x="436" y="311" text-anchor="start" class="sans body" fill="#27313A">combine vertices in one 64-byte line</text>
  <text x="436" y="335" text-anchor="start" class="sans body" fill="#27313A">pack destination + tier + two epochs</text>
  <rect x="816" y="180" width="360" height="205" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="832" y="209" text-anchor="start" class="sans label" fill="#B42318" font-weight="700">Validated runtime input</text>
  <text x="832" y="239" text-anchor="start" class="sans body" fill="#27313A">record order follows canonical CSR</text>
  <text x="832" y="263" text-anchor="start" class="sans body" fill="#27313A">compact record substitutes for edge ID</text>
  <text x="832" y="287" text-anchor="start" class="sans body" fill="#27313A">otherwise use edge plus sidecar</text>
  <text x="832" y="311" text-anchor="start" class="sans body" fill="#27313A">guest validates graph + payload hashes</text>
  <circle cx="44" cy="430" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="436" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="437" text-anchor="start" class="sans heading" fill="#15803D" font-weight="700">RUNTIME REQUEST PATH</text>
  <text x="1158" y="436" text-anchor="end" class="sans body" fill="#9AA3AD">two loads and one explicit register dependency</text>
  <line x1="24" y1="456" x2="1176" y2="456" stroke="#15803D" stroke-width="3"/>
  <rect x="24" y="472" width="270" height="205" rx="9" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="40" y="501" text-anchor="start" class="sans label" fill="#B45309" font-weight="700">Record request</text>
  <text x="40" y="531" text-anchor="start" class="sans body" fill="#27313A">ecg.plan.load*</text>
  <text x="40" y="555" text-anchor="start" class="sans body" fill="#27313A">or ecg.flow.load*</text>
  <text x="40" y="579" text-anchor="start" class="sans body" fill="#27313A">returns ReusePlan in rd</text>
  <text x="40" y="603" text-anchor="start" class="sans body" fill="#27313A">FlowThrough marks request</text>
  <text x="40" y="627" text-anchor="start" class="sans body" fill="#27313A">normal translation + lookup</text>
  <rect x="318" y="472" width="270" height="205" rx="9" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="334" y="501" text-anchor="start" class="sans label" fill="#6D5BD0" font-weight="700">ReusePlan operand</text>
  <text x="334" y="531" text-anchor="start" class="sans body" fill="#27313A">rename maps record rd</text>
  <text x="334" y="555" text-anchor="start" class="sans body" fill="#27313A">property reads it as rs2</text>
  <text x="334" y="579" text-anchor="start" class="sans body" fill="#27313A">issue waits for both sources</text>
  <text x="334" y="603" text-anchor="start" class="sans body" fill="#27313A">no shared O3 mailbox</text>
  <rect x="612" y="472" width="270" height="205" rx="9" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="628" y="501" text-anchor="start" class="sans label" fill="#15803D" font-weight="700">Property request</text>
  <text x="628" y="531" text-anchor="start" class="sans body" fill="#27313A">ecg.bind.load.*</text>
  <text x="628" y="555" text-anchor="start" class="sans body" fill="#27313A">computed address</text>
  <text x="628" y="579" text-anchor="start" class="sans body" fill="#27313A">ecg.bind.iload.*</text>
  <text x="628" y="603" text-anchor="start" class="sans body" fill="#27313A">indexed address</text>
  <text x="628" y="627" text-anchor="start" class="sans body" fill="#27313A">typed ReuseBind extension</text>
  <text x="628" y="651" text-anchor="start" class="sans body" fill="#27313A">property: no FlowThrough</text>
  <rect x="906" y="472" width="270" height="205" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="922" y="501" text-anchor="start" class="sans label" fill="#B42318" font-weight="700">LLC line update</text>
  <text x="922" y="531" text-anchor="start" class="sans body" fill="#27313A">valid hit/fill</text>
  <text x="922" y="555" text-anchor="start" class="sans body" fill="#27313A">stamps tier + epochs</text>
  <text x="922" y="579" text-anchor="start" class="sans body" fill="#27313A">line guard must match</text>
  <text x="922" y="603" text-anchor="start" class="sans body" fill="#27313A">MSHR conflict rejects hint</text>
  <text x="922" y="627" text-anchor="start" class="sans body" fill="#27313A">data completion is unchanged</text>
  <circle cx="44" cy="722" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="728" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="729" text-anchor="start" class="sans heading" fill="#B42318" font-weight="700">POLICY AND EVIDENCE</text>
  <text x="1158" y="728" text-anchor="end" class="sans body" fill="#9AA3AD">mechanism state is not itself a speedup claim</text>
  <line x1="24" y1="748" x2="1176" y2="748" stroke="#B42318" stroke-width="3"/>
  <rect x="24" y="764" width="360" height="205" rx="9" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="40" y="793" text-anchor="start" class="sans label" fill="#6D5BD0" font-weight="700">Default rrip_first victim rule</text>
  <text x="40" y="823" text-anchor="start" class="sans body" fill="#27313A">age until a way reaches max RRPV</text>
  <text x="40" y="847" text-anchor="start" class="sans body" fill="#27313A">old structural line wins in that set</text>
  <text x="40" y="871" text-anchor="start" class="sans body" fill="#27313A">else evict farthest stamped property</text>
  <text x="40" y="895" text-anchor="start" class="sans body" fill="#27313A">unstamped property distance is zero</text>
  <rect x="420" y="764" width="360" height="205" rx="9" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="436" y="793" text-anchor="start" class="sans label" fill="#B45309" font-weight="700">Placement is a separate decision</text>
  <text x="436" y="823" text-anchor="start" class="sans body" fill="#27313A">record FlowThrough: design mechanism</text>
  <text x="436" y="847" text-anchor="start" class="sans body" fill="#27313A">structural FlowThrough fairness</text>
  <text x="436" y="871" text-anchor="start" class="sans body" fill="#27313A">LLC hits and private fills stay normal</text>
  <text x="436" y="895" text-anchor="start" class="sans body" fill="#27313A">mixed MSHR targets may still allocate</text>
  <rect x="816" y="764" width="360" height="205" rx="9" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <text x="832" y="793" text-anchor="start" class="sans label" fill="#B42318" font-weight="700">Claim boundary</text>
  <text x="832" y="823" text-anchor="start" class="sans body" fill="#27313A">gem5 O3: timing authority</text>
  <text x="832" y="847" text-anchor="start" class="sans body" fill="#27313A">cache_sim: functional policy + traffic</text>
  <text x="832" y="871" text-anchor="start" class="sans body" fill="#27313A">Sniper: modeled cache/traffic</text>
  <text x="832" y="895" text-anchor="start" class="sans body" fill="#27313A">analytic P-OPT time is optimistic</text>
  <path d="M105 1015 L405 1015" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-amber)" data-flow-kind="transfer" data-flow-label="immutable ReusePlan records" data-flow-cadence="once before the ROI"/>
  <text x="255" y="1000" text-anchor="middle" class="sans body" fill="#B45309" font-weight="700">immutable ReusePlan records | once before the ROI</text>
  <path d="M455 1080 L745 1080" fill="none" stroke="#6D5BD0" stroke-width="3" marker-end="url(#arrow-purple)" data-flow-kind="transfer" data-flow-label="property request + ReuseBind" data-flow-cadence="per governed load"/>
  <text x="600" y="1065" text-anchor="middle" class="sans body" fill="#6D5BD0" font-weight="700">property request + ReuseBind | per governed load</text>
  <path d="M795 1015 L1095 1015" fill="none" stroke="#B42318" stroke-width="3" marker-end="url(#arrow-red)" data-flow-kind="transfer" data-flow-label="semantic receipt and counters" data-flow-cadence="per experiment row"/>
  <text x="945" y="1000" text-anchor="middle" class="sans body" fill="#B42318" font-weight="700">semantic receipt and counters | per experiment row</text>
</svg>
