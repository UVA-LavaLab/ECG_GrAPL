  <path d="M715 260 L840 260" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="transfer" data-flow-underlay="false" data-flow-label="pack" data-flow-cadence="per edge"/>
  <rect x="704.60" y="171.00" width="146.80" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
