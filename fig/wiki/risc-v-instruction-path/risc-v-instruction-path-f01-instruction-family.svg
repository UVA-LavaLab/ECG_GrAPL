</style></defs>
  <rect x="0" y="0" width="1200" height="1050" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">RISC-V integration: existing path and next step</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">Native operands and replacement transport are under qualification; prefetch remains pending.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">EXISTING EXPERIMENTAL GEM5 SUPPORT</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#475467">legacy ReusePlan / ReuseBind, not Scale6</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="207" width="320" height="145" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="207" data-width="320" data-height="145"/>
  <text x="54" y="235" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Record-load family</text>
  <text x="54" y="264" text-anchor="start" class="sans body" fill="#182230">plan.load / flow.load</text>
  <text x="54" y="289" text-anchor="start" class="sans body" fill="#182230">record -&gt; integer register</text>
  <text x="54" y="314" text-anchor="start" class="sans body" fill="#182230">placement is explicit</text>
  <rect x="475" y="207" width="305" height="145" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="475" data-y="207" data-width="305" data-height="145"/>
  <text x="489" y="235" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Renamed operand</text>
  <text x="489" y="264" text-anchor="start" class="sans body" fill="#182230">per-dynamic dependency</text>
  <text x="489" y="289" text-anchor="start" class="sans body" fill="#182230">not a shared mailbox</text>
  <text x="489" y="314" text-anchor="start" class="sans body" fill="#182230">property waits for the record</text>
  <rect x="895" y="207" width="265" height="145" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="895" data-y="207" data-width="265" data-height="145"/>
  <text x="909" y="235" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Property-load family</text>
  <text x="909" y="264" text-anchor="start" class="sans body" fill="#182230">bind.load / bind.iload</text>
  <text x="909" y="289" text-anchor="start" class="sans body" fill="#182230">typed property result</text>
  <text x="909" y="314" text-anchor="start" class="sans body" fill="#182230">Request-bound ReuseBind</text>
  <path d="M360 277 L475 277" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="dependency" data-flow-underlay="false" data-flow-label="record operand"/>
  <rect x="349.16" y="171.00" width="137.68" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="418" y="188" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">record operand</text>
  <path d="M780 277 L895 277" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="dependency" data-flow-underlay="false" data-flow-label="rs2 dependency"/>
  <rect x="769.16" y="171.00" width="137.68" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="838" y="188" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">rs2 dependency</text>
  <text x="40" y="401" text-anchor="start" class="sans body" fill="#475467">custom-0 is a research extension, not a ratified RISC-V ISA feature.</text>
  <text x="40" y="432" text-anchor="start" class="sans body" fill="#C56A13">Scale6 has a separate native operand / retirement / replacement path; no native prefetch yet.</text>
  <circle cx="44" cy="495" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="501" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="502" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">SCALE6 TARGET CONTRACT</text>
  <text x="1158" y="501" text-anchor="end" class="sans body" fill="#475467">native replacement under qualification; prefetch pending</text>
  <line x1="24" y1="521" x2="1176" y2="521" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="521" x2="170" y2="521" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="556" width="210.0" height="90" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="40" data-y="556" data-width="210.0" data-height="90"/>
  <text x="145.0" y="599.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">token</text>
  <text x="145.0" y="623.0" text-anchor="middle" class="sans body" fill="#182230">6 bits</text>
  <rect x="250.0" y="556" width="910.0" height="90" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="250.0" data-y="556" data-width="910.0" data-height="90"/>
  <text x="705.0" y="599.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">vertex</text>
  <text x="705.0" y="623.0" text-anchor="middle" class="sans body" fill="#182230">26 bits</text>
  <rect x="40" y="704" width="1120" height="225" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="704" data-width="1120" data-height="225"/>
  <line x1="40" y1="749.0" x2="1160" y2="749.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="794.0" x2="1160" y2="794.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="839.0" x2="1160" y2="839.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="884.0" x2="1160" y2="884.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="52" y="732" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Boundary</text>
  <text x="52" y="777" text-anchor="start" class="sans body" fill="#182230">record -&gt; property</text>
  <text x="52" y="822" text-anchor="start" class="sans body" fill="#182230">property -&gt; retirement</text>
  <text x="52" y="867" text-anchor="start" class="sans body" fill="#182230">retirement -&gt; LLC</text>
  <text x="52" y="912" text-anchor="start" class="sans body" fill="#182230">lookahead -&gt; prefetch</text>
  <line x1="325" y1="704" x2="325" y2="929" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="337" y="732" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Required information</text>
  <text x="337" y="777" text-anchor="start" class="sans body" fill="#182230">vertex + six-bit token</text>
  <text x="337" y="822" text-anchor="start" class="sans body" fill="#182230">physical line + position + context</text>
  <text x="337" y="867" text-anchor="start" class="sans body" fill="#182230">committed line prediction</text>
  <text x="337" y="912" text-anchor="start" class="sans body" fill="#182230">real record-stream candidates</text>
  <line x1="735" y1="704" x2="735" y2="929" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="747" y="732" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Must preserve</text>
  <text x="747" y="777" text-anchor="start" class="sans body" fill="#182230">one exact dynamic association</text>
  <text x="747" y="822" text-anchor="start" class="sans body" fill="#182230">squash, replay and translation</text>
  <text x="747" y="867" text-anchor="start" class="sans body" fill="#182230">bounded delay and bandwidth</text>
  <text x="747" y="912" text-anchor="start" class="sans body" fill="#182230">traffic, admission and LLC-only fill</text>
  <text x="40" y="977" text-anchor="start" class="sans body" fill="#C63C4A">Raw funct7 0x30 / 0x34 are experimental encodings; no Scale6 speedup claim is enabled.</text>
</svg>
