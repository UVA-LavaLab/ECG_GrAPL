  <line x1="40" y1="1111.25" x2="270" y2="1111.25" stroke="#27313A" stroke-width="1"/>
  <text x="56" y="980" text-anchor="start" class="sans label" fill="#1769C2" font-weight="700">Private hierarchy</text>
  <text x="56" y="1035" text-anchor="start" class="sans body" fill="#27313A">D-TLB: translation</text>
  <text x="56" y="1088" text-anchor="start" class="sans body" fill="#27313A">L1D: normal hit/fill</text>
  <text x="56" y="1142" text-anchor="start" class="sans body" fill="#27313A">L2: extension preserved</text>
  <rect x="330" y="950" width="230" height="215" rx="0" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <line x1="330" y1="1003.75" x2="560" y2="1003.75" stroke="#27313A" stroke-width="1"/>
  <line x1="330" y1="1057.5" x2="560" y2="1057.5" stroke="#27313A" stroke-width="1"/>
  <line x1="330" y1="1111.25" x2="560" y2="1111.25" stroke="#27313A" stroke-width="1"/>
  <text x="346" y="980" text-anchor="start" class="sans label" fill="#6D5BD0" font-weight="700">MSHR target table</text>
  <text x="346" y="1020" text-anchor="start" class="sans body" fill="#27313A">same property block</text>
  <text x="346" y="1075" text-anchor="start" class="sans body" fill="#27313A">newest compatible seq</text>
  <text x="346" y="1128" text-anchor="start" class="sans body" fill="#27313A">conflict propagation</text>
  <rect x="620" y="950" width="230" height="215" rx="0" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <line x1="620" y1="1003.75" x2="850" y2="1003.75" stroke="#27313A" stroke-width="1"/>
  <line x1="620" y1="1057.5" x2="850" y2="1057.5" stroke="#27313A" stroke-width="1"/>
  <line x1="620" y1="1111.25" x2="850" y2="1111.25" stroke="#27313A" stroke-width="1"/>
  <text x="636" y="980" text-anchor="start" class="sans label" fill="#6D5BD0" font-weight="700">LLC set + metadata</text>
  <text x="636" y="1020" text-anchor="start" class="mono body" fill="#27313A">line 0x80000040</text>
  <text x="636" y="1075" text-anchor="start" class="sans body" fill="#27313A">destination-line guard</text>
  <text x="636" y="1128" text-anchor="start" class="sans body" fill="#27313A">stamp tier + epochs</text>
  <rect x="930" y="962.0" width="190" height="191.0" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <ellipse cx="1025.0" cy="962.0" rx="95.0" ry="12.0" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <ellipse cx="1025.0" cy="1153.0" rx="95.0" ry="12.0" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="1025" y="995" text-anchor="middle" class="sans label" fill="#1769C2" font-weight="700">Memory</text>
  <text x="1025" y="1045" text-anchor="middle" class="sans body" fill="#27313A">ordinary line fetch</text>
  <text x="1025" y="1095" text-anchor="middle" class="sans body" fill="#27313A">allocOnFill applies</text>
  <text x="1025" y="1140" text-anchor="middle" class="sans body" fill="#27313A">normal response</text>
  <text x="600" y="1203" text-anchor="middle" class="sans body" fill="#1769C2" font-weight="700">property Request + ReuseBind | per governed load</text>
  <circle cx="44" cy="1250" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="1256" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">6</text>
  <text x="74" y="1257" text-anchor="start" class="sans heading" fill="#B42318" font-weight="700">COMPLETION AND RETIREMENT</text>
  <text x="1158" y="1256" text-anchor="end" class="sans body" fill="#9AA3AD">metadata is advisory; data uses normal O3 completion</text>
  <line x1="24" y1="1276" x2="1176" y2="1276" stroke="#B42318" stroke-width="3"/>
  <rect x="100" y="1292" width="470" height="145" rx="0" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <line x1="100" y1="1340.3333333333333" x2="570" y2="1340.3333333333333" stroke="#27313A" stroke-width="1"/>
