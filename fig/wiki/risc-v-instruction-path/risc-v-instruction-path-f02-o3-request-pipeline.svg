  <rect x="0" y="0" width="1200" height="1490" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#27313A" font-weight="700">A real ReusePlan instruction pair in the gem5 O3 pipeline</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#27313A">Source edge 4-&gt;7 maps to internal 8-&gt;18, property 0x80000048, and LLC line 0x80000040.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <circle cx="44" cy="138" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#B45309" font-weight="700">RECORD LOAD + DEPENDENT PROPERTY INSTRUCTION</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#9AA3AD">record result is a true rs2 dependency</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#B45309" stroke-width="3"/>
  <rect x="24" y="180" width="520" height="180" rx="9" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="40" y="209" text-anchor="start" class="sans label" fill="#B45309" font-weight="700">ecg.flow.load.compact</text>
  <text x="40" y="239" text-anchor="start" class="mono body" fill="#27313A">rs1 = record for source 4-&gt;7 / int 8-&gt;18</text>
  <text x="40" y="263" text-anchor="start" class="mono body" fill="#27313A">memory width = 4 bytes</text>
  <text x="40" y="287" text-anchor="start" class="mono body" fill="#27313A">Request flag = ECG_FLOWTHROUGH</text>
  <text x="40" y="311" text-anchor="start" class="mono body" fill="#27313A">rd = dest 18 | T1 | e1 11 | e2 15</text>
  <text x="40" y="335" text-anchor="start" class="mono body" fill="#27313A">execute reads format CSR and widens the result</text>
  <rect x="656" y="180" width="520" height="180" rx="9" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="672" y="209" text-anchor="start" class="sans label" fill="#15803D" font-weight="700">ecg.bind.load.u32</text>
  <text x="672" y="239" text-anchor="start" class="mono body" fill="#27313A">rs1 = computed property address 0x80000048</text>
  <text x="672" y="263" text-anchor="start" class="mono body" fill="#27313A">rs2 = renamed ReusePlan physical register</text>
  <text x="672" y="287" text-anchor="start" class="mono body" fill="#27313A">result = ordinary uint32 property value</text>
  <text x="672" y="311" text-anchor="start" class="mono body" fill="#27313A">property Request carries ReuseBind</text>
  <text x="672" y="335" text-anchor="start" class="mono body" fill="#27313A">never FlowThrough</text>
  <path d="M284 360 L284 405 L916 405 L916 360" fill="none" stroke="#6D5BD0" stroke-width="3" marker-end="url(#arrow-purple)" data-flow-kind="dependency" data-flow-label="canonical ReusePlan register"/>
  <text x="600" y="392" text-anchor="middle" class="sans body" fill="#6D5BD0" font-weight="700">canonical ReusePlan register</text>
  <circle cx="44" cy="450" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="456" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2-4</text>
  <text x="74" y="457" text-anchor="start" class="sans heading" fill="#15803D" font-weight="700">GEM5 O3 PIPELINE</text>
  <text x="1158" y="456" text-anchor="end" class="sans body" fill="#9AA3AD">both instructions: Fetch | Decode | Rename | IEW | Commit</text>
  <line x1="24" y1="476" x2="1176" y2="476" stroke="#15803D" stroke-width="3"/>
  <path d="M105 650 L1090 650" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow-green)" data-flow-kind="control" data-flow-label="I0 record load -&gt; I1 dependent property load"/>
  <rect x="40" y="560" width="140" height="150" rx="9" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="110" y="595" text-anchor="middle" class="sans label" fill="#15803D" font-weight="700">Fetch</text>
  <text x="110" y="627" text-anchor="middle" class="sans body" fill="#27313A">I0 flow.load</text>
  <text x="110" y="660" text-anchor="middle" class="sans body" fill="#27313A">I1 bind.load</text>
  <text x="110" y="692" text-anchor="middle" class="sans body" fill="#27313A">program order</text>
  <rect x="220" y="560" width="140" height="150" rx="9" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="290" y="595" text-anchor="middle" class="sans label" fill="#15803D" font-weight="700">Decode</text>
  <text x="290" y="627" text-anchor="middle" class="sans body" fill="#27313A">I0 record op</text>
  <text x="290" y="660" text-anchor="middle" class="sans body" fill="#27313A">I1 u32 bind</text>
  <text x="290" y="692" text-anchor="middle" class="sans body" fill="#27313A">custom-0 role</text>
  <rect x="400" y="520" width="170" height="225" rx="0" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <line x1="400" y1="576.25" x2="570" y2="576.25" stroke="#27313A" stroke-width="1"/>
  <line x1="400" y1="632.5" x2="570" y2="632.5" stroke="#27313A" stroke-width="1"/>
  <line x1="400" y1="688.75" x2="570" y2="688.75" stroke="#27313A" stroke-width="1"/>
  <text x="485" y="550" text-anchor="middle" class="sans label" fill="#6D5BD0" font-weight="700">Rename</text>
  <text x="485" y="602" text-anchor="middle" class="sans body" fill="#27313A">I0 rd -&gt; P17</text>
  <text x="485" y="660" text-anchor="middle" class="sans body" fill="#27313A">I1 rs2 -&gt; P17</text>
  <text x="485" y="718" text-anchor="middle" class="sans body" fill="#27313A">I1 rd -&gt; P21</text>
  <rect x="610" y="520" width="360" height="245" rx="9" fill="#F8F6EC" stroke="#15803D" stroke-width="3"/>
  <text x="790" y="548" text-anchor="middle" class="sans label" fill="#15803D" font-weight="700">IEW: issue / execute / writeback</text>
  <polygon points="640.0,568 750,568 735.0,646 625,646" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <text x="688" y="595" text-anchor="middle" class="sans body" fill="#6D5BD0" font-weight="700">Issue queue</text>
  <text x="688" y="625" text-anchor="middle" class="sans body" fill="#27313A">I1 waits P17</text>
  <rect x="770" y="568" width="90" height="78" rx="0" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <line x1="770" y1="607.0" x2="860" y2="607.0" stroke="#27313A" stroke-width="1"/>
  <text x="815" y="595" text-anchor="middle" class="sans body" fill="#1769C2" font-weight="700">Phys regs</text>
  <text x="815" y="625" text-anchor="middle" class="sans body" fill="#27313A">P17 plan</text>
  <polygon points="915,568.0 962.5,607 915,646.0 867.5,607" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="915" y="602" text-anchor="middle" class="sans body" fill="#15803D" font-weight="700">3 I1 AGU</text>
  <text x="915" y="627" text-anchor="middle" class="sans body" fill="#27313A">rs1 EA</text>
  <rect x="650" y="654" width="285" height="100" rx="0" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <line x1="650" y1="687.3333333333334" x2="935" y2="687.3333333333334" stroke="#27313A" stroke-width="1"/>
  <line x1="650" y1="720.6666666666666" x2="935" y2="720.6666666666666" stroke="#27313A" stroke-width="1"/>
  <text x="792" y="679" text-anchor="middle" class="sans label" fill="#6D5BD0" font-weight="700">4 LSQ requests</text>
  <text x="792" y="715" text-anchor="middle" class="sans body" fill="#27313A">I0: record Request</text>
  <text x="792" y="745" text-anchor="middle" class="sans body" fill="#27313A">I1: property Request + ReuseBind</text>
  <rect x="1010" y="520" width="150" height="225" rx="0" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <line x1="1010" y1="576.25" x2="1160" y2="576.25" stroke="#27313A" stroke-width="1"/>
  <line x1="1010" y1="632.5" x2="1160" y2="632.5" stroke="#27313A" stroke-width="1"/>
  <line x1="1010" y1="688.75" x2="1160" y2="688.75" stroke="#27313A" stroke-width="1"/>
  <text x="1085" y="550" text-anchor="middle" class="sans label" fill="#B42318" font-weight="700">Commit</text>
  <text x="1085" y="602" text-anchor="middle" class="sans body" fill="#27313A">I0 ROB entry</text>
  <text x="1085" y="660" text-anchor="middle" class="sans body" fill="#27313A">I1 ROB entry</text>
  <text x="1085" y="718" text-anchor="middle" class="sans body" fill="#27313A">in order</text>
  <text x="600" y="802" text-anchor="middle" class="sans body" fill="#15803D" font-weight="700">I0 record load -&gt; I1 dependent property load</text>
  <text x="600" y="832" text-anchor="middle" class="mono body" fill="#6D5BD0">LSQ extension: dest=18 tier=1 epochs=(11,15) current=8 context=k sequence=s</text>
  <circle cx="44" cy="880" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="886" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">5</text>
  <text x="74" y="887" text-anchor="start" class="sans heading" fill="#1769C2" font-weight="700">CACHE AND MISS PATH</text>
  <text x="1158" y="886" text-anchor="end" class="sans body" fill="#9AA3AD">the same property Request crosses every cache boundary</text>
  <line x1="24" y1="906" x2="1176" y2="906" stroke="#1769C2" stroke-width="3"/>
  <path d="M270 1075 L330 1075" fill="none" stroke="#1769C2" stroke-width="2.5" marker-end="url(#arrow-blue)" data-flow-kind="transfer" data-flow-label="property Request + ReuseBind" data-flow-cadence="per governed load"/>
  <path d="M560 1075 L620 1075" fill="none" stroke="#1769C2" stroke-width="2.5" marker-end="url(#arrow-blue)" data-flow-kind="transfer" data-flow-label="property Request + ReuseBind" data-flow-cadence="per governed load"/>
  <path d="M850 1075 L930 1075" fill="none" stroke="#1769C2" stroke-width="2.5" marker-end="url(#arrow-blue)" data-flow-kind="transfer" data-flow-label="property Request + ReuseBind" data-flow-cadence="per governed load"/>
  <rect x="40" y="950" width="230" height="215" rx="0" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <line x1="40" y1="1003.75" x2="270" y2="1003.75" stroke="#27313A" stroke-width="1"/>
