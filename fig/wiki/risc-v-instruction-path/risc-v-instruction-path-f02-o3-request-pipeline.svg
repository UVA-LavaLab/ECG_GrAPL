  <text x="116" y="1412" text-anchor="start" class="sans body" fill="#27313A">both load-queue entries complete normally</text>
  <rect x="630" y="1292" width="470" height="145" rx="0" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <line x1="630" y1="1340.3333333333333" x2="1100" y2="1340.3333333333333" stroke="#27313A" stroke-width="1"/>
  <line x1="630" y1="1388.6666666666667" x2="1100" y2="1388.6666666666667" stroke="#27313A" stroke-width="1"/>
