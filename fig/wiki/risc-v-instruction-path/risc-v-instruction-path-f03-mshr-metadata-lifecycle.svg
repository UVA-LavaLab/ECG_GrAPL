  <rect x="1035.3125" y="779" width="17.8125" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="1035.3125" data-y="779" data-width="17.8125" data-height="42"/>
  <rect x="1053.125" y="779" width="17.8125" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="1053.125" data-y="779" data-width="17.8125" data-height="42"/>
  <rect x="1070.9375" y="779" width="17.8125" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="1070.9375" data-y="779" data-width="17.8125" data-height="42"/>
  <rect x="1088.75" y="779" width="17.8125" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="1088.75" data-y="779" data-width="17.8125" data-height="42"/>
  <rect x="1106.5625" y="779" width="17.8125" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="1106.5625" data-y="779" data-width="17.8125" data-height="42"/>
  <rect x="1124.375" y="779" width="17.8125" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="1124.375" data-y="779" data-width="17.8125" data-height="42"/>
  <rect x="1142.1875" y="779" width="17.8125" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="1142.1875" data-y="779" data-width="17.8125" data-height="42"/>
  <text x="875" y="839" text-anchor="start" class="sans body" fill="#182230">head</text>
  <text x="1160" y="839" text-anchor="end" class="sans body" fill="#182230">tail</text>
  <path d="M1160 603 L1180 603 L1180 800 L1160 800" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="committed only"/>
  <rect x="981.16" y="708.00" width="137.68" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="1050" y="725" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">committed only</text>
  <circle cx="44" cy="931" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="937" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="938" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">LLC STATE HAS ITS OWN EXPIRY</text>
  <text x="1158" y="937" text-anchor="end" class="sans body" fill="#475467">no update is permission to allocate a data line</text>
  <line x1="24" y1="957" x2="1176" y2="957" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="957" x2="170" y2="957" stroke="#6558C5" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="40" y="990" text-anchor="start" class="sans body" fill="#182230">Apply only to the matching resident line. Expired update -&gt; discard; invalidated line -&gt; no allocation.</text>
  <text x="40" y="1025" text-anchor="start" class="sans body" fill="#C63C4A">A stale finite prediction becomes UNKNOWN when resolved. It must never become falsely DEAD.</text>
  <text x="40" y="1060" text-anchor="start" class="sans body" fill="#182230">Native squash, translation, retry, queue-full and drain behavior must be demonstrated before timing claims.</text>
</svg>
