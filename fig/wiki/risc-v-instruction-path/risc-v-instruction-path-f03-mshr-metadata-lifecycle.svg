  <rect x="0" y="0" width="1200" height="1140" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Request lifetime is not metadata lifetime</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">MSHR merging and commit-update coalescing solve different problems.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">EXISTING REUSEBIND MERGE RULES</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#475467">a reusable foundation, not a completed Scale6 extension</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="209" width="265" height="144" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="209" data-width="265" data-height="144"/>
  <text x="54" y="237" text-anchor="start" class="sans label" fill="#182230" font-weight="700">MSHR targets</text>
  <text x="54" y="266" text-anchor="start" class="sans body" fill="#182230">requestor + context</text>
  <text x="54" y="291" text-anchor="start" class="sans body" fill="#182230">sequence + typed payload</text>
  <text x="54" y="316" text-anchor="start" class="sans body" fill="#182230">ordinary targets can mix</text>
  <rect x="450" y="209" width="305" height="144" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="450" data-y="209" data-width="305" data-height="144"/>
  <text x="464" y="237" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Compatibility</text>
  <text x="464" y="266" text-anchor="start" class="sans body" fill="#182230">newest compatible sequence</text>
  <text x="464" y="291" text-anchor="start" class="sans body" fill="#182230">equal seq requires same payload</text>
  <text x="464" y="316" text-anchor="start" class="sans body" fill="#182230">mismatch -&gt; conflict marker</text>
  <rect x="900" y="209" width="260" height="144" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="900" data-y="209" data-width="260" data-height="144"/>
  <text x="914" y="237" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Response metadata</text>
  <text x="914" y="266" text-anchor="start" class="sans body" fill="#182230">copy chosen extension</text>
  <text x="914" y="291" text-anchor="start" class="sans body" fill="#182230">or propagate conflict</text>
  <text x="914" y="316" text-anchor="start" class="sans body" fill="#182230">clear on MSHR release</text>
  <path d="M305 285 L450 285" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="merge targets"/>
  <rect x="312.72" y="172.00" width="128.56" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="377" y="189" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">merge targets</text>
  <path d="M755 285 L900 285" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="one response"/>
  <rect x="767.28" y="172.00" width="119.44" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="827" y="189" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">one response</text>
  <text x="40" y="404" text-anchor="start" class="sans body" fill="#182230">allocOnFill combines with OR. A non-allocating target cannot suppress an ordinary allocating target.</text>
  <text x="40" y="435" text-anchor="start" class="sans body" fill="#C56A13">Primary Scale6 comparisons use FlowThrough OFF; these legacy allocation rules remain separate.</text>
  <circle cx="44" cy="495" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="501" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="502" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">TARGET SCALE6 REFRESH LIFECYCLE</text>
  <text x="1158" y="501" text-anchor="end" class="sans body" fill="#475467">required behavior; native gem5 transport is pending</text>
  <line x1="24" y1="521" x2="1176" y2="521" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="521" x2="170" y2="521" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="557" width="240" height="94" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="557" data-width="240" data-height="94"/>
  <text x="54" y="585" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Issued load</text>
  <text x="54" y="614" text-anchor="start" class="sans body" fill="#182230">retain dynamic metadata</text>
  <rect x="455" y="557" width="285" height="94" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="455" data-y="557" data-width="285" data-height="94"/>
  <text x="469" y="585" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Completed load</text>
  <text x="469" y="614" text-anchor="start" class="sans body" fill="#182230">may still be speculative</text>
  <rect x="920" y="557" width="240" height="94" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="920" data-y="557" data-width="240" data-height="94"/>
  <text x="934" y="585" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Retired load</text>
  <text x="934" y="614" text-anchor="start" class="sans body" fill="#182230">commit authorizes refresh</text>
  <path d="M280 603 L455 603" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="normal completion"/>
  <rect x="285.48" y="528.00" width="165.04" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="368" y="545" text-anchor="middle" class="sans body" fill="#2563EB" font-weight="700">normal completion</text>
  <path d="M740 603 L920 603" fill="none" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-green)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="oldest in ROB"/>
  <rect x="765.72" y="528.00" width="128.56" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="830" y="545" text-anchor="middle" class="sans body" fill="#0F8A72" font-weight="700">oldest in ROB</text>
  <rect x="455" y="757" width="285" height="100" rx="0" fill="#FFF1F2" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="455" data-y="757" data-width="285" data-height="100"/>
  <text x="469" y="785" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Squashed / faulted</text>
  <text x="469" y="814" text-anchor="start" class="sans body" fill="#182230">discard; do not enqueue</text>
  <path d="M160 651 L160 807 L455 807" fill="none" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-red)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="squash"/>
  <rect x="272.64" y="768.00" width="64.72" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="305" y="785" text-anchor="middle" class="sans body" fill="#C63C4A" font-weight="700">squash</text>
  <path d="M597 651 L597 757" fill="none" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-red)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="squash"/>
  <rect x="616.64" y="693.00" width="64.72" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="649" y="710" text-anchor="middle" class="sans body" fill="#C63C4A" font-weight="700">squash</text>
  <text x="875" y="765" text-anchor="start" class="sans label" fill="#6558C5" font-weight="700">Coalesce commit updates</text>
  <rect x="875.0" y="779" width="17.8125" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="875.0" data-y="779" data-width="17.8125" data-height="42"/>
  <rect x="892.8125" y="779" width="17.8125" height="42" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="892.8125" data-y="779" data-width="17.8125" data-height="42"/>
