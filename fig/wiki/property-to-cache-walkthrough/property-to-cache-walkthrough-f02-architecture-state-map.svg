  <text x="1089.0" y="887.0" text-anchor="middle" class="sans body" fill="#182230">1 bit</text>
  <text x="64" y="949" text-anchor="start" class="sans label" fill="#6558C5" font-weight="700">35 bits x 131,072 lines = 4,587,520 bits</text>
  <text x="64" y="991" text-anchor="start" class="sans body" fill="#182230">Queues + lookahead + 64 control bits = 3,064 additional bits</text>
