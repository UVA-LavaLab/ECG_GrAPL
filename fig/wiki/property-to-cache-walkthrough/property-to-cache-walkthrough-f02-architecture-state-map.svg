  <rect x="0" y="0" width="1200" height="1240" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#27313A" font-weight="700">ECG state placement in the processor and cache hierarchy</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#27313A">Containment denotes storage; arrows denote architectural operand or Request transfer.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <circle cx="44" cy="138" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#1769C2" font-weight="700">SOFTWARE AND ARCHITECTURAL INPUTS</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#9AA3AD">immutable graph data is separate from live execution state</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#1769C2" stroke-width="3"/>
