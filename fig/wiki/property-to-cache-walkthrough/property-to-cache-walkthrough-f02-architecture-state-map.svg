  <text x="876" y="639" text-anchor="start" class="sans label" fill="#2563EB" font-weight="700">Lookahead</text>
  <text x="876" y="683" text-anchor="start" class="sans body" fill="#182230">16 x 32-bit records</text>
  <text x="876" y="726" text-anchor="start" class="sans body" fill="#182230">512 bits</text>
  <text x="64" y="739" text-anchor="start" class="sans body" fill="#6558C5">1,840 bits</text>
  <text x="440" y="739" text-anchor="start" class="sans body" fill="#C56A13">648 bits</text>
  <text x="64" y="790" text-anchor="start" class="sans label" fill="#182230" font-weight="700">LLC: 8 MiB data capacity, 131,072 cache lines</text>
  <rect x="64" y="822" width="890.0" height="86" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="64" data-y="822" data-width="890.0" data-height="86"/>
  <text x="509.0" y="863.0" text-anchor="middle" class="sans body" fill="#182230" font-weight="700">deadline</text>
  <text x="509.0" y="887.0" text-anchor="middle" class="sans body" fill="#182230">32 bits</text>
  <rect x="954.0" y="822" width="90.0" height="86" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="954.0" data-y="822" data-width="90.0" data-height="86"/>
