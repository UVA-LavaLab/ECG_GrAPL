  <rect x="0" y="0" width="1200" height="1200" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Where Scale6 metadata lives</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">Storage ownership, lifetime, and accounting domain are explicit.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">GRAPH MEMORY AND BUILD-TIME SCRATCH</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#475467">no runtime P-OPT matrix in the Scale6 candidate</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
