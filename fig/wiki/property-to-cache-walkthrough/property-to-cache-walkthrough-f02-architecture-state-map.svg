  <text x="74" y="1107" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">REPORT THE RIGHT COST DOMAIN</text>
  <text x="1158" y="1106" text-anchor="end" class="sans body" fill="#475467">bit counts are not synthesized area</text>
