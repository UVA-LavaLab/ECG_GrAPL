  <text x="1100" y="642" text-anchor="middle" class="sans body" fill="#27313A">typed ext</text>
  <circle cx="44" cy="782" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="788" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="789" text-anchor="start" class="sans heading" fill="#6D5BD0" font-weight="700">CACHE HIERARCHY</text>
  <text x="1158" y="788" text-anchor="end" class="sans body" fill="#9AA3AD">private caches stay ordinary; LLC state is extended</text>
  <line x1="24" y1="808" x2="1176" y2="808" stroke="#6D5BD0" stroke-width="3"/>
  <path d="M60 930 L1130 930" fill="none" stroke="#1769C2" stroke-width="3" marker-end="url(#arrow-blue)" data-flow-kind="transfer" data-flow-label="property Request + ReuseBind" data-flow-cadence="per governed load"/>
  <text x="600" y="1070" text-anchor="middle" class="sans body" fill="#1769C2" font-weight="700">property Request + ReuseBind | per governed load</text>
  <rect x="40" y="850" width="180" height="140" rx="0" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="130.0" y="885" text-anchor="middle" class="sans label" fill="#1769C2" font-weight="700">L1D</text>
  <text x="130.0" y="928" text-anchor="middle" class="sans body" fill="#27313A">ordinary tags/data</text>
  <rect x="280" y="850" width="180" height="140" rx="0" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="370.0" y="885" text-anchor="middle" class="sans label" fill="#1769C2" font-weight="700">L2</text>
  <text x="370.0" y="928" text-anchor="middle" class="sans body" fill="#27313A">ordinary tags/data</text>
