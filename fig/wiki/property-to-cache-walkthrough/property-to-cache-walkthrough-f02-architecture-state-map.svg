  <text x="910" y="672" text-anchor="middle" class="sans body" fill="#27313A">ReuseBind ext</text>
  <rect x="1040" y="530" width="120" height="140" rx="0" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
