  <text x="315" y="585" text-anchor="middle" class="mono body" fill="#27313A">I0 rd -&gt; P17</text>
  <text x="315" y="625" text-anchor="middle" class="mono body" fill="#27313A">I1 rs2 -&gt; P17</text>
  <text x="315" y="665" text-anchor="middle" class="sans body" fill="#27313A">ROB + LQ allocate</text>
  <polygon points="460.4,530 610,530 589.6,670 440,670" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
  <text x="525" y="562" text-anchor="middle" class="sans label" fill="#15803D" font-weight="700">Issue / select</text>
  <text x="525" y="605" text-anchor="middle" class="sans body" fill="#27313A">I0 ready</text>
  <text x="525" y="645" text-anchor="middle" class="sans body" fill="#27313A">I1 waits P17</text>
  <polygon points="700,525.0 775.0,600 700,675.0 625.0,600" fill="#E7F7EA" stroke="#27313A" stroke-width="2" data-shape="diamond" data-cx="700" data-cy="600" data-width="150" data-height="150"/>
