  <text x="999.0" y="887.0" text-anchor="middle" class="sans body" fill="#182230">2 bits</text>
  <rect x="1044.0" y="822" width="90.0" height="86" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="2" data-shape="rect" data-x="1044.0" data-y="822" data-width="90.0" data-height="86"/>
