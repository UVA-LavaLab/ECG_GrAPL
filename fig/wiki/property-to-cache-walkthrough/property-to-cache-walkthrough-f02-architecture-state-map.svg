  <text x="60" y="225" text-anchor="start" class="sans label" fill="#2563EB" font-weight="700">Persistent graph / property memory</text>
  <rect x="60" y="254" width="680" height="138" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="60" data-y="254" data-width="680" data-height="138"/>
  <line x1="60" y1="300.0" x2="740" y2="300.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="60" y1="346.0" x2="740" y2="346.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="78" y="284" text-anchor="start" class="sans body" fill="#182230">CSR offsets: row boundaries</text>
  <text x="78" y="330" text-anchor="start" class="sans body" fill="#182230">Packed in-edge CSR: 4 bytes per edge, including token</text>
  <text x="78" y="376" text-anchor="start" class="sans body" fill="#182230">Property arrays: ordinary algorithm values</text>
  <rect x="830" y="224" width="330" height="168" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="830" data-y="224" data-width="330" data-height="168"/>
  <text x="844" y="252" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Preprocessing only</text>
  <text x="844" y="281" text-anchor="start" class="sans body" fill="#182230">first + next arrays</text>
  <text x="844" y="306" text-anchor="start" class="sans body" fill="#182230">about 39.7 MiB for Twitter</text>
  <text x="844" y="331" text-anchor="start" class="sans body" fill="#182230">release after construction</text>
  <text x="40" y="467" text-anchor="start" class="sans body" fill="#182230">The graph-scaled scratch is not resident hardware. The four-byte record stream remains after construction.</text>
  <circle cx="44" cy="525" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="531" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="532" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">BOUNDED RUNTIME MODEL STATE</text>
  <text x="1158" y="531" text-anchor="end" class="sans body" fill="#475467">native placement and timing still require gem5 work</text>
