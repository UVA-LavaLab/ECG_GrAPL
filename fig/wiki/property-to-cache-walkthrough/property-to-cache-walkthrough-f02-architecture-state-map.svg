  <line x1="40" y1="332.5" x2="560" y2="332.5" stroke="#27313A" stroke-width="1"/>
  <text x="300" y="220" text-anchor="middle" class="sans label" fill="#1769C2" font-weight="700">Memory image before ROI</text>
  <text x="56" y="265" text-anchor="start" class="sans body" fill="#27313A">CSR / weighted structural arrays</text>
  <text x="56" y="312" text-anchor="start" class="sans body" fill="#27313A">edge-aligned ReusePlan / sidecar arrays</text>
  <text x="56" y="360" text-anchor="start" class="sans body" fill="#27313A">property arrays + graph/payload identity</text>
  <rect x="640" y="190" width="520" height="190" rx="0" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
  <line x1="640" y1="237.5" x2="1160" y2="237.5" stroke="#27313A" stroke-width="1"/>
  <line x1="640" y1="285.0" x2="1160" y2="285.0" stroke="#27313A" stroke-width="1"/>
  <line x1="640" y1="332.5" x2="1160" y2="332.5" stroke="#27313A" stroke-width="1"/>
  <text x="900" y="220" text-anchor="middle" class="sans label" fill="#6D5BD0" font-weight="700">Architectural ECG CSR bank</text>
  <text x="656" y="265" text-anchor="start" class="mono body" fill="#27313A">format: id_bits | epoch_bits</text>
  <text x="656" y="312" text-anchor="start" class="sans body" fill="#27313A">current: quantized traversal epoch</text>
  <text x="656" y="360" text-anchor="start" class="sans body" fill="#27313A">context: nonzero execution identity</text>
  <circle cx="44" cy="450" r="19" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="44" y="456" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="457" text-anchor="start" class="sans heading" fill="#15803D" font-weight="700">OUT-OF-ORDER CORE</text>
  <text x="1158" y="456" text-anchor="end" class="sans body" fill="#9AA3AD">standard O3 structures carry one explicit dependency</text>
  <line x1="24" y1="476" x2="1176" y2="476" stroke="#15803D" stroke-width="3"/>
  <path d="M50 615 L1135 615" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#arrow-green)" data-flow-kind="control" data-flow-label="dynamic instruction state"/>
  <text x="600" y="735" text-anchor="middle" class="sans body" fill="#15803D" font-weight="700">dynamic instruction state</text>
  <rect x="40" y="530" width="150" height="140" rx="0" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="115" y="562" text-anchor="middle" class="sans label" fill="#1769C2" font-weight="700">Decode</text>
  <text x="115" y="602" text-anchor="middle" class="sans body" fill="#27313A">custom-0</text>
  <text x="115" y="642" text-anchor="middle" class="sans body" fill="#27313A">role + width</text>
  <rect x="230" y="510" width="170" height="180" rx="0" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
