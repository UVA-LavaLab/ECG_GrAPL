<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330" role="img" aria-labelledby="title desc" fill="#182230" data-figure-schema="ecg-public/v1">
  <title id="title">One edge, two encodings, unchanged data</title>
  <desc id="desc">The running graph needs five vertex bits. Vertex eighteen is ORed with Full14 metadata mask 0x00002200 to form record 0x00002212. The same access has Scale6 record 0x10000012 in the fixed native ABI. Both recover vertex eighteen and address 0x80000048, returning the exact initial contribution 1/128 with F32 bits 0x3C000000. Only the decoded future bounds differ: four versus seven, giving deadlines twenty-three and twenty-six.</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563EB"/></marker>
<marker id="arrow-green" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#0F8A72"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C56A13"/></marker>
<marker id="arrow-red" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C63C4A"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6558C5"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#98A2B3"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#182230"/></marker><style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        [fill="#FFFFFF"]{fill:#111827}[stroke="#FFFFFF"]{stroke:#111827}
        [fill="#F8FAFC"]{fill:#172033}[stroke="#F8FAFC"]{stroke:#172033}
        [fill="#EFF6FF"]{fill:#172554}[stroke="#EFF6FF"]{stroke:#172554}
        [fill="#ECFDF5"]{fill:#073B34}[stroke="#ECFDF5"]{stroke:#073B34}
        [fill="#FFF7ED"]{fill:#422A12}[stroke="#FFF7ED"]{stroke:#422A12}
        [fill="#FFF1F2"]{fill:#421B22}[stroke="#FFF1F2"]{stroke:#421B22}
        [fill="#F5F3FF"]{fill:#292349}[stroke="#F5F3FF"]{stroke:#292349}
        [fill="#182230"]{fill:#F8FAFC}[stroke="#182230"]{stroke:#F8FAFC}
        [fill="#475467"]{fill:#94A3B8}[stroke="#475467"]{stroke:#94A3B8}
        [fill="#98A2B3"]{fill:#A8B0BF}[stroke="#98A2B3"]{stroke:#A8B0BF}
        [fill="#2563EB"]{fill:#7FB0FF}[stroke="#2563EB"]{stroke:#7FB0FF}
        [fill="#0F8A72"]{fill:#5ED0B0}[stroke="#0F8A72"]{stroke:#5ED0B0}
        [fill="#C56A13"]{fill:#F0B36A}[stroke="#C56A13"]{stroke:#F0B36A}
        [fill="#6558C5"]{fill:#ADA4FF}[stroke="#6558C5"]{stroke:#ADA4FF}
        [fill="#C63C4A"]{fill:#F48B98}[stroke="#C63C4A"]{stroke:#F48B98}
      }
      .sans{font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif}
      .mono{font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:18px}
      .heading{font-size:22px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:16px}
</style></defs>
  <rect x="0" y="0" width="1200" height="1330" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">One edge, two encodings, unchanged data</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">The mask occupies unused edge-ID bits. It is not applied to the floating-point property value.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="130" width="1120" height="52" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="130" data-width="1120" data-height="52"/>
  <text x="58" y="162" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Same access: u=8 | CSR j=18 | request s=19 | property v=18 | line B</text>
  <circle cx="44" cy="236" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="242" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="243" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">BUILD THE METADATA MASK</text>
  <text x="1158" y="242" text-anchor="end" class="sans body" fill="#475467">Full14 example; b_ID=5, not 26</text>
  <line x1="24" y1="262" x2="1176" y2="262" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="262" x2="170" y2="262" stroke="#6558C5" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="309" width="390" height="138" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="309" data-width="390" data-height="138"/>
  <text x="54" y="337" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Ordinary edge ID</text>
  <text x="54" y="366" text-anchor="start" class="sans body" fill="#182230">v = 18 = 0x00000012</text>
  <text x="54" y="391" text-anchor="start" class="sans body" fill="#182230">ID extraction mask = 0x0000001F</text>
  <rect x="40" y="495" width="390" height="138" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="495" data-width="390" data-height="138"/>
  <text x="54" y="523" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Metadata M = 0x00002200</text>
  <text x="54" y="552" text-anchor="start" class="sans body" fill="#182230">(reference 0x10 &lt;&lt; 5) | (FINITE 1 &lt;&lt; 13)</text>
  <text x="54" y="577" text-anchor="start" class="sans body" fill="#182230">prefetch action = 0</text>
  <circle cx="610" cy="472" r="36" fill="#ECFDF5" stroke="#0F8A72" stroke-width="1"/>
  <text x="610" y="479" text-anchor="middle" class="sans subtitle" fill="#182230" font-weight="700">OR</text>
  <rect x="860" y="411" width="300" height="123" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="860" data-y="411" data-width="300" data-height="123"/>
  <text x="874" y="439" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Packed record R</text>
  <text x="874" y="468" text-anchor="start" class="sans body" fill="#182230">0x00002212</text>
  <text x="874" y="493" text-anchor="start" class="sans body" fill="#182230">one 32-bit word, not a sidecar</text>
  <path d="M430 378 L520 378 L520 454 L579 454" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)" data-flow-kind="dependency" data-flow-underlay="false" data-flow-label="preserve vertex"/>
  <rect x="522.60" y="327.00" width="146.80" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="596" y="344" text-anchor="middle" class="sans body" fill="#2563EB" font-weight="700">preserve vertex</text>
  <path d="M430 564 L520 564 L520 490 L579 490" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="dependency" data-flow-underlay="false" data-flow-label="insert metadata"/>
  <rect x="523.60" y="594.00" width="146.80" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="597" y="611" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">insert metadata</text>
  <path d="M646 472 L860 472" fill="none" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-green)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="R = v | M"/>
  <rect x="706.96" y="372.00" width="92.08" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="753" y="389" text-anchor="middle" class="sans body" fill="#0F8A72" font-weight="700">R = v | M</text>
  <text x="40" y="679" text-anchor="start" class="sans body" fill="#182230">The full word changes from 0x00000012 to 0x00002212; masking off metadata still recovers exactly vertex 18.</text>
  <circle cx="44" cy="736" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="742" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="743" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">DECODE THE SELECTED FORMAT</text>
  <text x="1158" y="742" text-anchor="end" class="sans body" fill="#475467">same address; different precision</text>
  <line x1="24" y1="762" x2="1176" y2="762" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="762" x2="170" y2="762" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="799" width="1120" height="144" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="799" data-width="1120" data-height="144"/>
  <line x1="40" y1="847.0" x2="1160" y2="847.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="895.0" x2="1160" y2="895.0" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="52" y="827" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Encoding</text>
  <text x="52" y="875" text-anchor="start" class="sans body" fill="#182230">Full14, 5 ID bits</text>
  <text x="52" y="923" text-anchor="start" class="sans body" fill="#182230">Scale6, native 26+6</text>
  <line x1="300" y1="799" x2="300" y2="943" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="312" y="827" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Record</text>
  <text x="312" y="875" text-anchor="start" class="sans body" fill="#182230">0x00002212</text>
  <text x="312" y="923" text-anchor="start" class="sans body" fill="#182230">0x10000012</text>
  <line x1="560" y1="799" x2="560" y2="943" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="572" y="827" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Recovered vertex</text>
  <text x="572" y="875" text-anchor="start" class="sans body" fill="#182230">R &amp; 0x1F = 18</text>
  <text x="572" y="923" text-anchor="start" class="sans body" fill="#182230">R &amp; 0x03FFFFFF = 18</text>
  <line x1="840" y1="799" x2="840" y2="943" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="852" y="827" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Candidate deadline</text>
  <text x="852" y="875" text-anchor="start" class="sans body" fill="#182230">s19 + 4 = 23</text>
  <text x="852" y="923" text-anchor="start" class="sans body" fill="#182230">s19 + 7 = 26</text>
  <circle cx="44" cy="1004" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="1010" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="1011" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">THE PROPERTY LOAD IS UNCHANGED</text>
  <text x="1158" y="1010" text-anchor="end" class="sans body" fill="#475467">line B contains p[16..31]; p[18] is byte offset 8</text>
  <line x1="24" y1="1030" x2="1176" y2="1030" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="1030" x2="170" y2="1030" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="1066" width="320" height="137" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="1066" data-width="320" data-height="137"/>
  <text x="54" y="1094" text-anchor="start" class="sans label" fill="#182230" font-weight="700">VA = 0x80000048</text>
  <text x="54" y="1123" text-anchor="start" class="sans body" fill="#182230">0x80000000 + 18 x 4</text>
  <text x="54" y="1148" text-anchor="start" class="sans body" fill="#182230">virtual line 0x80000040</text>
  <text x="54" y="1173" text-anchor="start" class="sans body" fill="#182230">translate to physical line P_B</text>
  <rect x="475" y="1066" width="300" height="137" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="475" data-y="1066" data-width="300" data-height="137"/>
  <text x="489" y="1094" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Ordinary memory hierarchy</text>
  <text x="489" y="1123" text-anchor="start" class="sans body" fill="#182230">read the addressed F32 value</text>
  <text x="489" y="1148" text-anchor="start" class="sans body" fill="#182230">no property-value masking</text>
  <text x="489" y="1173" text-anchor="start" class="sans body" fill="#182230">same coherent data semantics</text>
  <rect x="910" y="1066" width="250" height="137" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="910" data-y="1066" data-width="250" data-height="137"/>
  <text x="924" y="1094" text-anchor="start" class="sans label" fill="#182230" font-weight="700">F32 value</text>
  <text x="924" y="1123" text-anchor="start" class="sans body" fill="#182230">p[18] = 1/128</text>
  <text x="924" y="1148" text-anchor="start" class="sans body" fill="#182230">bits 0x3C000000</text>
  <text x="924" y="1173" text-anchor="start" class="sans body" fill="#182230">not the encoded edge word</text>
  <path d="M360 1135 L475 1135" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)" data-flow-kind="transfer" data-flow-underlay="false" data-flow-label="load" data-flow-cadence="4 bytes"/>
  <rect x="348.16" y="1031.00" width="137.68" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="417" y="1048" text-anchor="middle" class="sans body" fill="#2563EB" font-weight="700">load | 4 bytes</text>
  <path d="M775 1135 L910 1135" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)" data-flow-kind="transfer" data-flow-underlay="false" data-flow-label="return" data-flow-cadence="4 bytes"/>
  <rect x="765.04" y="1219.00" width="155.92" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="843" y="1236" text-anchor="middle" class="sans body" fill="#2563EB" font-weight="700">return | 4 bytes</text>
  <text x="40" y="1279" text-anchor="start" class="sans body" fill="#182230">The different future bounds feed cache ranking; the graph index, address and algorithm data remain the same.</text>
  <text x="40" y="1311" text-anchor="start" class="sans body" fill="#475467">Native P17 adds s19: 0x0000001310000012. That is a register operand, not an eight-byte edge-memory load.</text>
</svg>
