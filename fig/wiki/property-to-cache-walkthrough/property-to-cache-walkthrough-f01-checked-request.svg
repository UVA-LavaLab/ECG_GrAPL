</style></defs>
  <rect x="0" y="0" width="1200" height="1180" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">One edge word, one property line, one update</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">A concrete Scale6 example; this is functional-model arithmetic, not a measured gem5 execution.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">DECODE THE WORD ACTUALLY CONSUMED</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#475467">fixture row 8; edge position 18</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="210" width="295" height="126" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="210" data-width="295" data-height="126"/>
  <text x="54" y="238" text-anchor="start" class="sans label" fill="#182230" font-weight="700">record = 0x10000012</text>
  <text x="54" y="267" text-anchor="start" class="sans body" fill="#182230">32-bit substitute edge record</text>
  <text x="54" y="292" text-anchor="start" class="sans body" fill="#182230">no separate destination stream</text>
  <rect x="470" y="210" width="285" height="126" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="470" data-y="210" data-width="285" data-height="126"/>
  <text x="484" y="238" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Decode</text>
  <text x="484" y="267" text-anchor="start" class="sans body" fill="#182230">vertex = word &amp; ((1&lt;&lt;26)-1)</text>
  <text x="484" y="292" text-anchor="start" class="sans body" fill="#182230">token = word &gt;&gt; 26</text>
  <rect x="890" y="210" width="270" height="126" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="890" data-y="210" data-width="270" data-height="126"/>
  <text x="904" y="238" text-anchor="start" class="sans label" fill="#182230" font-weight="700">vertex 18 / token 4</text>
  <text x="904" y="267" text-anchor="start" class="sans body" fill="#182230">FINITE, bucket 2</text>
  <text x="904" y="292" text-anchor="start" class="sans body" fill="#182230">upper-bound distance 7</text>
  <path d="M335 272 L470 272" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="split fields"/>
  <rect x="342.28" y="171.00" width="119.44" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="402" y="188" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">split fields</text>
  <path d="M755 272 L890 272" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="decode token"/>
  <rect x="762.28" y="171.00" width="119.44" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="822" y="188" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">decode token</text>
  <circle cx="44" cy="410" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="416" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="417" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">FORM THE ORDINARY PROPERTY ADDRESS</text>
  <text x="1158" y="416" text-anchor="end" class="sans body" fill="#475467">neighbors 18 and 20 share the same 64-byte line</text>
  <line x1="24" y1="436" x2="1176" y2="436" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="436" x2="170" y2="436" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="40" y="477" text-anchor="start" class="sans body" fill="#182230">property address = 0x80000000 + 18 x 4 = 0x80000048</text>
  <text x="40" y="510" text-anchor="start" class="sans body" fill="#2563EB">line address = 0x80000040; byte offset = 8; property vertices 16..31</text>
  <rect x="40" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="548" data-width="70" data-height="68"/>
  <text x="75" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">16</text>
  <rect x="110" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="110" data-y="548" data-width="70" data-height="68"/>
  <text x="145" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">17</text>
  <rect x="180" y="548" width="70" height="68" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="180" data-y="548" data-width="70" data-height="68"/>
  <text x="215" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">18</text>
  <rect x="250" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="250" data-y="548" data-width="70" data-height="68"/>
  <text x="285" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">19</text>
  <rect x="320" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="320" data-y="548" data-width="70" data-height="68"/>
  <text x="355" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">20</text>
  <rect x="390" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="390" data-y="548" data-width="70" data-height="68"/>
  <text x="425" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">21</text>
  <rect x="460" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="460" data-y="548" data-width="70" data-height="68"/>
  <text x="495" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">22</text>
  <rect x="530" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="530" data-y="548" data-width="70" data-height="68"/>
  <text x="565" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">23</text>
  <rect x="600" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="600" data-y="548" data-width="70" data-height="68"/>
  <text x="635" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">24</text>
  <rect x="670" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="670" data-y="548" data-width="70" data-height="68"/>
  <text x="705" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">25</text>
  <rect x="740" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="740" data-y="548" data-width="70" data-height="68"/>
  <text x="775" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">26</text>
  <rect x="810" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="810" data-y="548" data-width="70" data-height="68"/>
  <text x="845" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">27</text>
  <rect x="880" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="880" data-y="548" data-width="70" data-height="68"/>
  <text x="915" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">28</text>
  <rect x="950" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="950" data-y="548" data-width="70" data-height="68"/>
  <text x="985" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">29</text>
  <rect x="1020" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="1020" data-y="548" data-width="70" data-height="68"/>
  <text x="1055" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">30</text>
  <rect x="1090" y="548" width="70" height="68" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="1090" data-y="548" data-width="70" data-height="68"/>
  <text x="1125" y="590" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">31</text>
  <text x="40" y="656" text-anchor="start" class="sans body" fill="#182230">Load p[18] through normal L1D / L2 / LLC data service. The property value is unchanged.</text>
  <circle cx="44" cy="717" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="723" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="724" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">STAMP, REFRESH, AND EXPIRE ARE DISTINCT</text>
  <text x="1158" y="723" text-anchor="end" class="sans body" fill="#475467">current sequence 19; actual next use 23</text>
  <line x1="24" y1="743" x2="1176" y2="743" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="743" x2="170" y2="743" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="782" width="305" height="151" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="782" data-width="305" data-height="151"/>
  <text x="54" y="810" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Demand LLC hit / fill</text>
  <text x="54" y="839" text-anchor="start" class="sans body" fill="#182230">candidate deadline = 19 + 7</text>
  <text x="54" y="864" text-anchor="start" class="sans body" fill="#182230">deadline = 26</text>
  <text x="54" y="889" text-anchor="start" class="sans body" fill="#182230">metadata, not property values</text>
  <rect x="450" y="782" width="305" height="151" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="450" data-y="782" data-width="305" data-height="151"/>
  <text x="464" y="810" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Private-hit commit refresh</text>
  <text x="464" y="839" text-anchor="start" class="sans body" fill="#182230">same line, newer prediction</text>
  <text x="464" y="864" text-anchor="start" class="sans body" fill="#182230">16-entry bounded channel</text>
  <text x="464" y="889" text-anchor="start" class="sans body" fill="#182230">check age when it arrives</text>
  <rect x="860" y="782" width="300" height="151" rx="0" fill="#FFF1F2" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="860" data-y="782" data-width="300" data-height="151"/>
  <text x="874" y="810" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Resolve at sequence 27</text>
  <text x="874" y="839" text-anchor="start" class="sans body" fill="#182230">unrefreshed bound has passed</text>
  <text x="874" y="864" text-anchor="start" class="sans body" fill="#182230">effective state = UNKNOWN</text>
  <text x="874" y="889" text-anchor="start" class="sans body" fill="#182230">never infer DEAD from expiry</text>
  <path d="M345 872 L450 872" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="later accesses"/>
  <rect x="330.16" y="950.00" width="137.68" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="399" y="967" text-anchor="middle" class="sans body" fill="#6558C5" font-weight="700">later accesses</text>
  <path d="M755 872 L860 872" fill="none" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-red)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="expiry check"/>
  <rect x="747.28" y="950.00" width="119.44" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="807" y="967" text-anchor="middle" class="sans body" fill="#C63C4A" font-weight="700">expiry check</text>
  <text x="40" y="1023" text-anchor="start" class="sans body" fill="#182230">The model&#x27;s 8-request update latency may outlast this 7-request prediction; an expired update is discarded.</text>
  <text x="40" y="1057" text-anchor="start" class="sans body" fill="#C63C4A">An expired update cannot install the stale deadline; a newer coalesced prediction has its own bound.</text>
  <text x="40" y="1120" text-anchor="start" class="sans body" fill="#C56A13">Native request binding, retirement messages and cycle timing for Scale6 are still a separate implementation task.</text>
</svg>
