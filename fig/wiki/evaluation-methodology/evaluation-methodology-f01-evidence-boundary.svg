  <rect x="0" y="0" width="1200" height="1120" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Evidence boundary for ECG architecture claims</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">Rows are compared only with matching baselines inside the same simulator.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="44" cy="138" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="144" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">1</text>
  <text x="74" y="145" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">SIMULATOR ROLES</text>
  <text x="1158" y="144" text-anchor="end" class="sans body" fill="#98A2B3">do not compare absolute rates or time across simulators</text>
  <line x1="24" y1="164" x2="1176" y2="164" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="164" x2="170" y2="164" stroke="#2563EB" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="190" width="1120" height="260" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="190" data-width="1120" data-height="260"/>
  <line x1="320" y1="190" x2="320" y2="450" stroke="#182230" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="600" y1="190" x2="600" y2="450" stroke="#182230" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="880" y1="190" x2="880" y2="450" stroke="#182230" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="40" y1="240" x2="1160" y2="240" stroke="#182230" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="180" y="222" text-anchor="middle" class="sans label" fill="#0F8A72" font-weight="700">gem5 O3</text>
  <text x="460" y="222" text-anchor="middle" class="sans label" fill="#2563EB" font-weight="700">cache_sim</text>
  <text x="740" y="222" text-anchor="middle" class="sans label" fill="#6558C5" font-weight="700">Sniper</text>
  <text x="1020" y="222" text-anchor="middle" class="sans label" fill="#C63C4A" font-weight="700">Claim output</text>
  <text x="56" y="280" text-anchor="start" class="sans body" fill="#182230">architectural time</text>
  <text x="56" y="310" text-anchor="start" class="sans body" fill="#182230">exact Request binding</text>
  <text x="56" y="340" text-anchor="start" class="sans body" fill="#182230">native LSQ/MSHR/cache</text>
  <text x="336" y="280" text-anchor="start" class="sans body" fill="#182230">functional victim logic</text>
  <text x="336" y="310" text-anchor="start" class="sans body" fill="#182230">off-chip traffic</text>
  <text x="336" y="340" text-anchor="start" class="sans body" fill="#182230">no cycle/instruction model</text>
  <text x="616" y="280" text-anchor="start" class="sans body" fill="#182230">modeled cache direction</text>
  <text x="616" y="310" text-anchor="start" class="sans body" fill="#182230">exact indexed markers</text>
  <text x="616" y="340" text-anchor="start" class="sans body" fill="#182230">computed fused sideband</text>
  <text x="616" y="370" text-anchor="start" class="sans body" fill="#182230">is diagnostic</text>
  <text x="616" y="400" text-anchor="start" class="sans body" fill="#182230">inconsistent hints</text>
  <text x="616" y="430" text-anchor="start" class="sans body" fill="#182230">fail closed</text>
  <text x="896" y="280" text-anchor="start" class="sans body" fill="#182230">gem5: timing speedup</text>
  <text x="896" y="310" text-anchor="start" class="sans body" fill="#182230">cache_sim: traffic</text>
  <text x="896" y="340" text-anchor="start" class="sans body" fill="#182230">Sniper: corroboration</text>
  <circle cx="44" cy="510" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="516" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">2</text>
  <text x="74" y="517" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">ROW ACCEPTANCE</text>
  <text x="1158" y="516" text-anchor="end" class="sans body" fill="#98A2B3">a success-shaped fallback is not a valid experiment row</text>
  <line x1="24" y1="536" x2="1176" y2="536" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="536" x2="170" y2="536" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="565" width="300" height="170" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="565" data-width="300" data-height="170"/>
  <text x="190" y="598" text-anchor="middle" class="sans label" fill="#6558C5" font-weight="700">Mechanism receipt vector</text>
  <text x="58" y="632" text-anchor="start" class="sans body" fill="#182230">requested == effective</text>
  <text x="58" y="656" text-anchor="start" class="sans body" fill="#182230">carrier + events positive</text>
  <text x="58" y="680" text-anchor="start" class="sans body" fill="#182230">width/substitution agree</text>
  <text x="58" y="704" text-anchor="start" class="sans body" fill="#182230">P-OPT matrix active if required</text>
  <rect x="420" y="565" width="300" height="170" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="420" data-y="565" data-width="300" data-height="170"/>
  <text x="570" y="598" text-anchor="middle" class="sans label" fill="#6558C5" font-weight="700">Semantic receipt vector</text>
  <text x="438" y="632" text-anchor="start" class="sans body" fill="#182230">kernel output / edge budget</text>
  <text x="438" y="656" text-anchor="start" class="sans body" fill="#182230">all matched policy rows agree</text>
  <text x="438" y="680" text-anchor="start" class="sans body" fill="#182230">failed peer invalidates timing</text>
  <text x="438" y="704" text-anchor="start" class="sans body" fill="#182230">not gated by speculation counts</text>
  <polygon points="825,587.5 910.0,650 825,712.5 740.0,650" fill="#FFF1F2" stroke="#475467" stroke-width="1.5" data-shape="diamond" data-cx="825" data-cy="650" data-width="170" data-height="125"/>
  <text x="825" y="637" text-anchor="middle" class="sans label" fill="#C63C4A" font-weight="700">mechanism</text>
  <text x="825" y="668" text-anchor="middle" class="sans body" fill="#182230">AND semantic</text>
  <rect x="965" y="595" width="195" height="110" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="965" data-y="595" data-width="195" data-height="110"/>
  <text x="1062" y="632" text-anchor="middle" class="sans label" fill="#0F8A72" font-weight="700">accepted row</text>
  <text x="1062" y="668" text-anchor="middle" class="sans body" fill="#182230">eligible for claims</text>
  <path d="M340 650 L420 650" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="Mechanism receipt vector"/>
  <path d="M720 650 L740 650" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="Semantic receipt vector"/>
  <path d="M910 650 L965 650" fill="none" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-green)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="accepted row"/>
  <circle cx="44" cy="842" r="19" fill="#182230" stroke="#182230" stroke-width="1"/>
  <text x="44" y="848" text-anchor="middle" class="sans label" fill="#FFFFFF" font-weight="700">3</text>
  <text x="74" y="849" text-anchor="start" class="sans heading" fill="#182230" font-weight="700">CLAIM LIMITS</text>
  <text x="1158" y="848" text-anchor="end" class="sans body" fill="#98A2B3">state what is omitted before interpreting a ratio</text>
  <line x1="24" y1="868" x2="1176" y2="868" stroke="#475467" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <line x1="24" y1="868" x2="170" y2="868" stroke="#C56A13" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="40" y="895" width="1120" height="165" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="40" data-y="895" data-width="1120" data-height="165"/>
  <line x1="600" y1="895" x2="600" y2="1060" stroke="#182230" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="56" y="928" text-anchor="start" class="sans label" fill="#C56A13" font-weight="700">Analytic P-OPT boundary</text>
  <text x="56" y="962" text-anchor="start" class="sans body" fill="#182230">charged: reserved ways + cumulative matrix bytes</text>
  <text x="56" y="992" text-anchor="start" class="sans body" fill="#182230">omitted: target-time latency / bandwidth / queueing</text>
  <text x="56" y="1022" text-anchor="start" class="mono body" fill="#C63C4A" font-weight="700">popt_target_time_charged = 0 -&gt; optimistic timing bound</text>
  <text x="616" y="928" text-anchor="start" class="sans label" fill="#C63C4A" font-weight="700">Publication vector</text>
  <text x="616" y="962" text-anchor="start" class="sans body" fill="#182230">time + total off-chip traffic + instructions</text>
  <text x="616" y="992" text-anchor="start" class="sans body" fill="#182230">same-build, same-cell baseline; geometric mean</text>
  <text x="616" y="1022" text-anchor="start" class="mono body" fill="#182230">exclude timing_valid_for_speedup = 0</text>
  <path d="M120 1095 L1080 1095" fill="none" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-red)" data-flow-kind="dependency" data-flow-underlay="false" data-flow-label="publish only after the frozen campaign"/>
  <rect x="421.72" y="1063.00" width="356.56" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="600" y="1080" text-anchor="middle" class="sans body" fill="#C63C4A" font-weight="700">publish only after the frozen campaign</text>
</svg>
