<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" fill="#182230" data-figure-schema="ecg-public/v1">
  <title id="title">Offline ReusePlan construction and the measured-ROI boundary</title>
  <desc id="desc">A left-to-right band shows CSR rows entering a deterministic future-use pass that ranks property vertices by request count, selects the next two accesses to the same property block, and quantizes them into epochs. The resulting edge-aligned ReusePlan crosses an explicit measured-ROI boundary: construction happens before the region of interest, and the kernel only streams validated records inside it.</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563EB"/></marker>
<marker id="arrow-green" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#0F8A72"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C56A13"/></marker>
<marker id="arrow-red" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C63C4A"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6558C5"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#98A2B3"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#182230"/></marker><style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        [fill="#FFFFFF"]{fill:#111827}[stroke="#FFFFFF"]{stroke:#111827}
        [fill="#F8FAFC"]{fill:#172033}[stroke="#F8FAFC"]{stroke:#172033}
        [fill="#EFF6FF"]{fill:#172554}[stroke="#EFF6FF"]{stroke:#172554}
        [fill="#ECFDF5"]{fill:#073B34}[stroke="#ECFDF5"]{stroke:#073B34}
        [fill="#FFF7ED"]{fill:#422A12}[stroke="#FFF7ED"]{stroke:#422A12}
        [fill="#FFF1F2"]{fill:#421B22}[stroke="#FFF1F2"]{stroke:#421B22}
        [fill="#F5F3FF"]{fill:#292349}[stroke="#F5F3FF"]{stroke:#292349}
        [fill="#182230"]{fill:#F8FAFC}[stroke="#182230"]{stroke:#F8FAFC}
        [fill="#475467"]{fill:#94A3B8}[stroke="#475467"]{stroke:#94A3B8}
        [fill="#98A2B3"]{fill:#A8B0BF}[stroke="#98A2B3"]{stroke:#A8B0BF}
        [fill="#2563EB"]{fill:#7FB0FF}[stroke="#2563EB"]{stroke:#7FB0FF}
        [fill="#0F8A72"]{fill:#5ED0B0}[stroke="#0F8A72"]{stroke:#5ED0B0}
        [fill="#C56A13"]{fill:#F0B36A}[stroke="#C56A13"]{stroke:#F0B36A}
        [fill="#6558C5"]{fill:#ADA4FF}[stroke="#6558C5"]{stroke:#ADA4FF}
        [fill="#C63C4A"]{fill:#F48B98}[stroke="#C63C4A"]{stroke:#F48B98}
      }
      .sans{font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif}
      .mono{font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:18px}
      .heading{font-size:22px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:16px}
</style></defs>
  <rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Offline ReusePlan construction and the measured-ROI boundary</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">One deterministic preprocessing pass turns CSR rows into an edge-aligned record stream.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="32" y="133" text-anchor="start" class="sans label" fill="#98A2B3" font-weight="700">OFFLINE PREPROCESSING: deterministic, outside the measured region</text>
  <rect x="30" y="155" width="300" height="216" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="30" data-y="155" data-width="300" data-height="216"/>
  <text x="44" y="187" text-anchor="start" class="sans label" fill="#2563EB" font-weight="700">Graph and CSR rows</text>
  <text x="44" y="219" text-anchor="start" class="sans subtitle" fill="#182230">outer vertex u owns row u</text>
  <text x="44" y="245" text-anchor="start" class="sans subtitle" fill="#182230">row_ptr[u] .. row_ptr[u+1]</text>
  <text x="44" y="271" text-anchor="start" class="sans subtitle" fill="#182230">col_idx enumerates N_in(u)</text>
  <text x="44" y="297" text-anchor="start" class="sans subtitle" fill="#182230">or N_out(u), by traversal</text>
  <text x="44" y="323" text-anchor="start" class="sans subtitle" fill="#182230">entry (u,v) reads p[v]</text>
  <rect x="450" y="155" width="300" height="216" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="450" data-y="155" data-width="300" data-height="216"/>
  <text x="464" y="187" text-anchor="start" class="sans label" fill="#0F8A72" font-weight="700">Future-use construction</text>
  <text x="464" y="219" text-anchor="start" class="sans subtitle" fill="#182230">rank by property requests</text>
  <text x="464" y="245" text-anchor="start" class="sans subtitle" fill="#182230">pull d_out(v); push d_in(v)</text>
  <text x="464" y="271" text-anchor="start" class="sans subtitle" fill="#182230">hot fraction 0.15 sets tiers</text>
  <text x="464" y="297" text-anchor="start" class="sans subtitle" fill="#182230">next two block accesses</text>
  <text x="464" y="323" text-anchor="start" class="sans subtitle" fill="#182230">after outer vertex u</text>
  <text x="464" y="349" text-anchor="start" class="sans subtitle" fill="#182230">quantize outer IDs to epochs</text>
  <rect x="870" y="155" width="300" height="216" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="870" data-y="155" data-width="300" data-height="216"/>
  <text x="884" y="187" text-anchor="start" class="sans label" fill="#C56A13" font-weight="700">Edge-aligned ReusePlan</text>
  <text x="884" y="219" text-anchor="start" class="sans subtitle" fill="#182230">one record per CSR entry</text>
  <text x="884" y="245" text-anchor="start" class="sans subtitle" fill="#182230">destination | tier | e1 | e2</text>
  <text x="884" y="271" text-anchor="start" class="sans subtitle" fill="#182230">record offset == CSR offset</text>
  <text x="884" y="297" text-anchor="start" class="sans subtitle" fill="#182230">immutable runtime input</text>
  <path d="M330 250 L450 250" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="CSR rows"/>
  <rect x="346.24" y="214.00" width="87.52" height="23" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="390" y="232" text-anchor="middle" class="sans label" fill="#2563EB" font-weight="700">CSR rows</text>
  <path d="M750 250 L870 250" fill="none" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-green)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="records"/>
  <rect x="771.09" y="214.00" width="77.83" height="23" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="810" y="232" text-anchor="middle" class="sans label" fill="#0F8A72" font-weight="700">records</text>
  <line x1="30" y1="400" x2="1170" y2="400" stroke="#C63C4A" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="30" y="392" text-anchor="start" class="sans label" fill="#C63C4A" font-weight="700">measured ROI boundary</text>
  <path d="M1020 371 L1020 416" fill="none" stroke="#C56A13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-amber)" data-flow-kind="transfer" data-flow-underlay="false" data-flow-label="validated record stream" data-flow-cadence="one record per governed edge access"/>
  <rect x="393.91" y="374.00" width="601.09" height="23" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="990" y="392" text-anchor="end" class="sans label" fill="#C56A13" font-weight="700">validated record stream | one record per governed edge access</text>
  <rect x="30" y="416" width="1140" height="110" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="30" data-y="416" data-width="1140" data-height="110"/>
  <text x="44" y="448" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Measured ROI</text>
  <text x="44" y="480" text-anchor="start" class="sans subtitle" fill="#182230">header, offsets, record width, and payload hash are checked before the ROI; disagreement aborts</text>
  <text x="44" y="506" text-anchor="start" class="sans subtitle" fill="#182230">the kernel streams validated records in CSR order; no record is built inside the measured region</text>
</svg>
