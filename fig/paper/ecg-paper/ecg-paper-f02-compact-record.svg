<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" fill="#182230" data-figure-schema="ecg-public/v1">
  <title id="title">Compact ReusePlan record: 32-bit budget and edge substitution</title>
  <desc id="desc">Two bit layouts show the compact ReusePlan record. The tiered layout packs a 16-bit destination, two tier bits, and two 5-bit epochs; the tierless layout drops the carried tier so an 18-bit destination and two 7-bit epochs still fit in 32 bits. Side panels give the field meanings, the format-word and sidecar binding that fails closed on an unsupported or mismatched width, and the substitution against the structural edge word.</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563EB"/></marker>
<marker id="arrow-green" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#0F8A72"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C56A13"/></marker>
<marker id="arrow-red" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C63C4A"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6558C5"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#98A2B3"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#182230"/></marker><style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        [fill="#FFFFFF"]{fill:#111827}[stroke="#FFFFFF"]{stroke:#111827}
        [fill="#F8FAFC"]{fill:#172033}[stroke="#F8FAFC"]{stroke:#172033}
        [fill="#EFF6FF"]{fill:#172554}[stroke="#EFF6FF"]{stroke:#172554}
        [fill="#ECFDF5"]{fill:#073B34}[stroke="#ECFDF5"]{stroke:#073B34}
        [fill="#FFF7ED"]{fill:#422A12}[stroke="#FFF7ED"]{stroke:#422A12}
        [fill="#FFF1F2"]{fill:#421B22}[stroke="#FFF1F2"]{stroke:#421B22}
        [fill="#F5F3FF"]{fill:#292349}[stroke="#F5F3FF"]{stroke:#292349}
        [fill="#182230"]{fill:#F8FAFC}[stroke="#182230"]{stroke:#F8FAFC}
        [fill="#475467"]{fill:#94A3B8}[stroke="#475467"]{stroke:#94A3B8}
        [fill="#98A2B3"]{fill:#A8B0BF}[stroke="#98A2B3"]{stroke:#A8B0BF}
        [fill="#2563EB"]{fill:#7FB0FF}[stroke="#2563EB"]{stroke:#7FB0FF}
        [fill="#0F8A72"]{fill:#5ED0B0}[stroke="#0F8A72"]{stroke:#5ED0B0}
        [fill="#C56A13"]{fill:#F0B36A}[stroke="#C56A13"]{stroke:#F0B36A}
        [fill="#6558C5"]{fill:#ADA4FF}[stroke="#6558C5"]{stroke:#ADA4FF}
        [fill="#C63C4A"]{fill:#F48B98}[stroke="#C63C4A"]{stroke:#F48B98}
      }
      .sans{font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif}
      .mono{font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:18px}
      .heading{font-size:22px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:16px}
</style></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Compact ReusePlan record: 32-bit budget and edge substitution</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">The compact record substitutes for the structural edge word; an unsupported width fails closed.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="32" y="133" text-anchor="start" class="sans label" fill="#98A2B3" font-weight="700">COMPACT RECORD FIELDS AND 32-BIT BUDGET</text>
  <rect x="32" y="152" width="356.9230769230769" height="88" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="32" data-y="152" data-width="356.9230769230769" data-height="88"/>
  <text x="210.46153846153845" y="188" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">destination</text>
  <text x="210.46153846153845" y="220" text-anchor="middle" class="sans subtitle" fill="#182230">16 bits</text>
  <rect x="388.9230769230769" y="152" width="110.0" height="88" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="2" data-shape="rect" data-x="388.9230769230769" data-y="152" data-width="110.0" data-height="88"/>
  <text x="443.9230769230769" y="188" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">tier</text>
  <text x="443.9230769230769" y="220" text-anchor="middle" class="sans subtitle" fill="#182230">2 bits</text>
  <rect x="498.9230769230769" y="152" width="111.53846153846153" height="88" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="2" data-shape="rect" data-x="498.9230769230769" data-y="152" data-width="111.53846153846153" data-height="88"/>
  <text x="554.6923076923076" y="188" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">epoch1</text>
  <text x="554.6923076923076" y="220" text-anchor="middle" class="sans subtitle" fill="#182230">5 bits</text>
  <rect x="610.4615384615385" y="152" width="111.53846153846153" height="88" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="610.4615384615385" data-y="152" data-width="111.53846153846153" data-height="88"/>
  <text x="666.2307692307692" y="188" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">epoch2</text>
  <text x="666.2307692307692" y="220" text-anchor="middle" class="sans subtitle" fill="#182230">5 bits</text>
  <text x="32" y="270" text-anchor="start" class="mono subtitle" fill="#182230">16 + 2 + 5 + 5 = 28 bits: 65,536 vertices, 32 epochs</text>
  <rect x="32" y="296" width="388.125" height="88" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="32" data-y="296" data-width="388.125" data-height="88"/>
  <text x="226.0625" y="332" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">destination</text>
  <text x="226.0625" y="364" text-anchor="middle" class="sans subtitle" fill="#182230">18 bits</text>
  <rect x="420.125" y="296" width="150.9375" height="88" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="2" data-shape="rect" data-x="420.125" data-y="296" data-width="150.9375" data-height="88"/>
  <text x="495.59375" y="332" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">epoch1</text>
  <text x="495.59375" y="364" text-anchor="middle" class="sans subtitle" fill="#182230">7 bits</text>
  <rect x="571.0625" y="296" width="150.9375" height="88" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="2" data-shape="rect" data-x="571.0625" data-y="296" data-width="150.9375" data-height="88"/>
  <text x="646.53125" y="332" text-anchor="middle" class="sans label" fill="#182230" font-weight="700">epoch2</text>
  <text x="646.53125" y="364" text-anchor="middle" class="sans subtitle" fill="#182230">7 bits</text>
  <text x="32" y="414" text-anchor="start" class="mono subtitle" fill="#182230">18 + 0 + 7 + 7 = 32 bits: 262,144 vertices, 128 epochs</text>
  <text x="32" y="440" text-anchor="start" class="mono subtitle" fill="#C63C4A">18 + 2 + 7 + 7 = 34 bits: rejected, no decoder implements it</text>
  <rect x="32" y="466" width="690" height="134" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="32" data-y="466" data-width="690" data-height="134"/>
  <text x="46" y="498" text-anchor="start" class="sans label" fill="#C56A13" font-weight="700">Substitution for the structural edge word</text>
  <text x="46" y="530" text-anchor="start" class="sans subtitle" fill="#182230">4-byte compact record replaces the 4-byte CSR edge word</text>
  <text x="46" y="556" text-anchor="start" class="sans subtitle" fill="#182230">8-byte general record instead adds a word per edge</text>
  <text x="46" y="582" text-anchor="start" class="sans subtitle" fill="#182230">weighted SSSP: 64-bit substitute, or edge plus 32-bit sidecar</text>
  <rect x="756" y="152" width="412" height="188" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="756" data-y="152" data-width="412" data-height="188"/>
  <text x="770" y="184" text-anchor="start" class="sans label" fill="#2563EB" font-weight="700">Field meaning</text>
  <text x="770" y="216" text-anchor="start" class="sans subtitle" fill="#182230">destination: property vertex</text>
  <text x="770" y="242" text-anchor="start" class="sans subtitle" fill="#182230">tier: optional carried hint</text>
  <text x="770" y="268" text-anchor="start" class="sans subtitle" fill="#182230">epoch1, epoch2: two future</text>
  <text x="770" y="294" text-anchor="start" class="sans subtitle" fill="#182230">epochs for the same block</text>
  <text x="770" y="320" text-anchor="start" class="sans subtitle" fill="#182230">unused high bits stay zero</text>
  <rect x="756" y="380" width="412" height="220" rx="0" fill="#FFF1F2" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="756" data-y="380" data-width="412" data-height="220"/>
  <text x="770" y="412" text-anchor="start" class="sans label" fill="#C63C4A" font-weight="700">Fail-closed format and sidecar binding</text>
  <text x="770" y="444" text-anchor="start" class="sans subtitle" fill="#182230">format word carries id_bits,</text>
  <text x="770" y="470" text-anchor="start" class="sans subtitle" fill="#182230">epoch_bits, tier_bits, presence</text>
  <text x="770" y="496" text-anchor="start" class="sans subtitle" fill="#182230">only tier_bits 0 or 2 decode</text>
  <text x="770" y="522" text-anchor="start" class="sans subtitle" fill="#182230">sidecar v2 binds the tier width</text>
  <text x="770" y="548" text-anchor="start" class="sans subtitle" fill="#182230">width mismatch aborts the run</text>
  <path d="M962 380 L962 340" fill="none" stroke="#C63C4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-red)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="bound record width"/>
  <rect x="760.58" y="348.00" width="184.42" height="23" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="940" y="366" text-anchor="end" class="sans label" fill="#C63C4A" font-weight="700">bound record width</text>
</svg>
