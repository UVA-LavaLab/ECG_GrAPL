<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img" aria-labelledby="title desc" fill="#182230" data-figure-schema="ecg-public/v1">
  <title id="title">Record load and property load through the RISC-V request path</title>
  <desc id="desc">The shared front end decodes the custom-0 role, generates the effective address in the AGU, and builds the Request in the LSQ. The path then splits into a record lane that sets the FlowThrough Request extension and reaches the LLC through a record-block MSHR, and a property lane whose ReuseBind Request extension consumes the renamed record operand and reaches the LLC through a property MSHR that merges compatible targets.</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563EB"/></marker>
<marker id="arrow-green" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#0F8A72"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C56A13"/></marker>
<marker id="arrow-red" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#C63C4A"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6558C5"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#98A2B3"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#182230"/></marker><style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        [fill="#FFFFFF"]{fill:#111827}[stroke="#FFFFFF"]{stroke:#111827}
        [fill="#F8FAFC"]{fill:#172033}[stroke="#F8FAFC"]{stroke:#172033}
        [fill="#EFF6FF"]{fill:#172554}[stroke="#EFF6FF"]{stroke:#172554}
        [fill="#ECFDF5"]{fill:#073B34}[stroke="#ECFDF5"]{stroke:#073B34}
        [fill="#FFF7ED"]{fill:#422A12}[stroke="#FFF7ED"]{stroke:#422A12}
        [fill="#FFF1F2"]{fill:#421B22}[stroke="#FFF1F2"]{stroke:#421B22}
        [fill="#F5F3FF"]{fill:#292349}[stroke="#F5F3FF"]{stroke:#292349}
        [fill="#182230"]{fill:#F8FAFC}[stroke="#182230"]{stroke:#F8FAFC}
        [fill="#475467"]{fill:#94A3B8}[stroke="#475467"]{stroke:#94A3B8}
        [fill="#98A2B3"]{fill:#A8B0BF}[stroke="#98A2B3"]{stroke:#A8B0BF}
        [fill="#2563EB"]{fill:#7FB0FF}[stroke="#2563EB"]{stroke:#7FB0FF}
        [fill="#0F8A72"]{fill:#5ED0B0}[stroke="#0F8A72"]{stroke:#5ED0B0}
        [fill="#C56A13"]{fill:#F0B36A}[stroke="#C56A13"]{stroke:#F0B36A}
        [fill="#6558C5"]{fill:#ADA4FF}[stroke="#6558C5"]{stroke:#ADA4FF}
        [fill="#C63C4A"]{fill:#F48B98}[stroke="#C63C4A"]{stroke:#F48B98}
      }
      .sans{font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif}
      .mono{font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:18px}
      .heading{font-size:22px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .body{font-size:16px}
</style></defs>
  <rect x="0" y="0" width="1200" height="648" fill="#FFFFFF"/>
  <text x="42" y="47" text-anchor="start" class="sans title" fill="#182230" font-weight="700">Record load and property load through the RISC-V request path</text>
  <text x="42" y="75" text-anchor="start" class="sans subtitle" fill="#182230">Two dynamic loads share the datapath; only the record load carries FlowThrough.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#182230" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <text x="32" y="133" text-anchor="start" class="sans label" fill="#98A2B3" font-weight="700">SHARED FRONT END</text>
  <rect x="32" y="140" width="336" height="130" rx="0" fill="#F8FAFC" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="32" data-y="140" data-width="336" data-height="130"/>
  <text x="46" y="172" text-anchor="start" class="sans label" fill="#182230" font-weight="700">Decode (custom-0 role)</text>
  <text x="46" y="204" text-anchor="start" class="sans subtitle" fill="#182230">record load or property load</text>
  <text x="46" y="230" text-anchor="start" class="sans subtitle" fill="#182230">format control/status register</text>
  <text x="46" y="256" text-anchor="start" class="sans subtitle" fill="#182230">supplies compact field widths</text>
  <rect x="432" y="140" width="336" height="130" rx="0" fill="#ECFDF5" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="432" data-y="140" data-width="336" data-height="130"/>
  <text x="446" y="172" text-anchor="start" class="sans label" fill="#0F8A72" font-weight="700">AGU (address generation)</text>
  <text x="446" y="204" text-anchor="start" class="sans subtitle" fill="#182230">forms the effective address</text>
  <text x="446" y="230" text-anchor="start" class="sans subtitle" fill="#182230">I0: record base + offset</text>
  <text x="446" y="256" text-anchor="start" class="sans subtitle" fill="#182230">I1: base + dest * elem size</text>
  <rect x="832" y="140" width="336" height="130" rx="0" fill="#F5F3FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="832" data-y="140" data-width="336" data-height="130"/>
  <text x="846" y="172" text-anchor="start" class="sans label" fill="#6558C5" font-weight="700">LSQ (load/store queue)</text>
  <text x="846" y="204" text-anchor="start" class="sans subtitle" fill="#182230">ordinary ordering and replay</text>
  <text x="846" y="230" text-anchor="start" class="sans subtitle" fill="#182230">attaches the Request extension</text>
  <path d="M368 205 L432 205" fill="none" stroke="#182230" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-ink)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="custom-0 role"/>
  <path d="M768 205 L832 205" fill="none" stroke="#0F8A72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-green)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="effective address"/>
  <path d="M860 270 L860 290 L420 290 L420 330" fill="none" stroke="#C56A13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-amber)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="record Request"/>
  <rect x="427.00" y="292.00" width="145.66" height="23" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="432" y="310" text-anchor="start" class="sans label" fill="#C56A13" font-weight="700">record Request</text>
  <path d="M980 270 L980 330" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="property Request"/>
  <rect x="990.00" y="292.00" width="165.04" height="23" rx="3" fill="#FFFFFF" fill-opacity="0.96" data-label-background="true"/>
  <text x="995" y="310" text-anchor="start" class="sans label" fill="#2563EB" font-weight="700">property Request</text>
  <text x="60" y="310" text-anchor="start" class="mono subtitle" fill="#C56A13">I0  ecg.flow.load.compact</text>
  <text x="620" y="310" text-anchor="start" class="mono subtitle" fill="#2563EB">I1  ecg.bind.load.u32</text>
  <rect x="60" y="330" width="520" height="76" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="60" data-y="330" data-width="520" data-height="76"/>
  <text x="74" y="362" text-anchor="start" class="sans label" fill="#C56A13" font-weight="700">Request extension: ECG_FLOWTHROUGH</text>
  <text x="74" y="394" text-anchor="start" class="sans subtitle" fill="#182230">record block; allocOnFill = false</text>
  <rect x="60" y="430" width="520" height="76" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="60" data-y="430" data-width="520" data-height="76"/>
  <text x="74" y="462" text-anchor="start" class="sans label" fill="#C56A13" font-weight="700">record-block MSHR</text>
  <text x="74" y="494" text-anchor="start" class="sans subtitle" fill="#182230">a no-allocate target joins the target list</text>
  <rect x="60" y="530" width="520" height="76" rx="0" fill="#FFF7ED" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="60" data-y="530" data-width="520" data-height="76"/>
  <text x="74" y="562" text-anchor="start" class="sans label" fill="#C56A13" font-weight="700">LLC fill decision</text>
  <text x="74" y="594" text-anchor="start" class="sans subtitle" fill="#182230">the structural line need not be allocated</text>
  <path d="M320 406 L320 430" fill="none" stroke="#C56A13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-amber)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="record-block MSHR"/>
  <path d="M320 506 L320 530" fill="none" stroke="#C56A13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-amber)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="LLC fill decision"/>
  <rect x="620" y="330" width="520" height="76" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="620" data-y="330" data-width="520" data-height="76"/>
  <text x="634" y="362" text-anchor="start" class="sans label" fill="#2563EB" font-weight="700">Request extension: ReuseBind</text>
  <text x="634" y="394" text-anchor="start" class="sans subtitle" fill="#182230">rs2 = renamed record operand</text>
  <rect x="620" y="430" width="520" height="76" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="620" data-y="430" data-width="520" data-height="76"/>
  <text x="634" y="462" text-anchor="start" class="sans label" fill="#2563EB" font-weight="700">property MSHR</text>
  <text x="634" y="494" text-anchor="start" class="sans subtitle" fill="#182230">merges compatible ReuseBind targets</text>
  <rect x="620" y="530" width="520" height="76" rx="0" fill="#EFF6FF" stroke="#475467" stroke-width="1.5" data-shape="rect" data-x="620" data-y="530" data-width="520" data-height="76"/>
  <text x="634" y="562" text-anchor="start" class="sans label" fill="#2563EB" font-weight="700">LLC stamp decision</text>
  <text x="634" y="594" text-anchor="start" class="sans subtitle" fill="#182230">validates context and property block</text>
  <path d="M880 406 L880 430" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="property MSHR"/>
  <path d="M880 506 L880 530" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)" data-flow-kind="control" data-flow-underlay="false" data-flow-label="LLC stamp decision"/>
  <path d="M580 368 L620 368" fill="none" stroke="#6558C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-purple)" data-flow-kind="dependency" data-flow-underlay="false" data-flow-label="renamed record operand"/>
  <text x="32" y="634" text-anchor="start" class="sans subtitle" fill="#182230">The property Request never receives FlowThrough, and the record Request never carries ReuseBind.</text>
</svg>
